name: release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # GITHUB_TOKEN cannot bypass the "protect main" ruleset on a user-owned repo,
      # so the release commit is pushed with an app installation token instead.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.x"
          cache: true

      - name: Read the next version
        id: dry
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f # v1.24.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          allow-initial-development-versions: true
          dry: true

      - name: Stop when no commit needs a release
        if: steps.dry.outputs.version == ''
        run: |
          set -eu
          echo "No feat, fix, perf, or revert commit since the last release."

      - name: Stamp plugin version files
        if: steps.dry.outputs.version != ''
        env:
          VERSION: ${{ steps.dry.outputs.version }}
        run: go run ./scripts/prepare-release "$VERSION"

      - name: Commit the version
        if: steps.dry.outputs.version != ''
        env:
          VERSION: ${{ steps.dry.outputs.version }}
        run: |
          set -eu
          git config user.name herdr-workflows-release
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add herdr-plugin.toml embed/herdr-plugin.toml docs/workflow.schema.json
          git commit -m "chore(release): $VERSION [skip ci]"
          git push origin HEAD:main

      - name: Write release notes
        if: steps.dry.outputs.version != ''
        env:
          CHANGELOG_JSON: ${{ toJSON(steps.dry.outputs.changelog) }}
        run: go run ./scripts/write-release-notes "${RUNNER_TEMP}/release-notes.md"

      - name: Point the release tag at HEAD
        if: steps.dry.outputs.version != ''
        env:
          VERSION: ${{ steps.dry.outputs.version }}
        run: |
          set -eu
          tag="v$VERSION"
          head=$(git rev-parse HEAD)
          remote=$(git ls-remote origin "refs/tags/$tag" | awk '{ print $1 }')
          if [ -n "$remote" ] && [ "$remote" != "$head" ]; then
            echo "remote tag $tag is $remote but HEAD is $head; not moving the tag" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            local=$(git rev-parse "$tag")
            if [ "$local" != "$head" ]; then
              echo "local tag $tag is $local but HEAD is $head; not moving the tag" >&2
              exit 1
            fi
          else
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi

      - name: Publish GitHub release
        if: steps.dry.outputs.version != ''
        env:
          VERSION: ${{ steps.dry.outputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh release create "v$VERSION" --notes-file "${RUNNER_TEMP}/release-notes.md"

id = "herdr-workflows"
name = "herdr-workflows"
version = "0.3.1"
min_herdr_version = "0.7.5"
description = "Linear YAML workflow runner for herdr panes"
platforms = ["linux", "macos"]

# Remote GitHub install: Bun preflight → production deps → compile → native setup.
# Local `herdr plugin link` / `bun run install:dev` do not run [[build]] — they compile the working tree.
[[build]]
command = ["sh", "scripts/preflight.sh"]

[[build]]
command = ["bun", "install", "--production", "--frozen-lockfile"]

[[build]]
command = ["bun", "build", "--compile", "--outfile=bin/herdr-workflows", "src/cli.ts"]

[[build]]
command = ["bin/herdr-workflows", "setup"]

[[actions]]
id = "launch"
title = "Launch herdr-workflows workflow"
contexts = ["workspace", "pane", "selection"]
command = ["bin/herdr-workflows", "launch"]

[[panes]]
id = "picker"
title = "Herdr Workflows"
placement = "popup"
width = 64
height = 15
command = ["./bin/herdr-workflows", "picker"]

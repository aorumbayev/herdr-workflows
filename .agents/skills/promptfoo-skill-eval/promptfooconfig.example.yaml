description: herdr-workflow-create skill — v1 (as shipped) vs v2 (refined), scored by the real hwf loader

providers:
  - id: file://provider.js
    label: v1-shipped
    config:
      model: sonnet
      label: v1-shipped
      working_dir: ./fixtures/v1
  - id: file://provider.js
    label: v2-refined
    config:
      model: sonnet
      label: v2-refined
      working_dir: ./fixtures/v2

prompts:
  - "{{task}}"

defaultTest:
  options:
    disableVarExpansion: true
  vars:
    expect_skill: herdr-workflow-create
  assert:
    - type: javascript
      value: file://assert-loads.js
      metric: loads
    - type: javascript
      value: file://assert-skill.js
      metric: skill
    # trial-and-error against the loader is what a vague skill costs; price it
    - type: cost
      threshold: 0.40
      metric: cost
    - type: latency
      threshold: 90000
      metric: latency
    - type: max-score
      value:
        method: average
        threshold: 0.7
        weights:
          loads: 4
          skill: 2
          cost: 0.5
          latency: 0.5

tests:
  - description: T1 simple two-step shell workflow
    vars:
      task: >-
        Create an hwf workflow called lint-then-test that runs "bun run lint" and then "bun test".
        Do not ask me anything. Print the final YAML in a fenced yaml block in your reply.

  - description: T2 inputs with a when guard
    vars:
      task: >-
        Create an hwf workflow called deep-review. Ask the picker whether to do a deep review
        (yes/no), and only when the answer is yes also ask for a free-text scope. Run
        "git diff HEAD" always, and run "bun run lint" only for a deep review, passing the
        scope along. Do not ask me anything, decide sensibly. Print the final YAML in a fenced
        yaml block in your reply.

  - description: T3 herdr step needing an explicit target
    vars:
      task: >-
        Create an hwf workflow called new-worktree that asks for a branch name and then makes a
        herdr worktree for it and focuses it. It must be a real herdr: step, not a shell call.
        Do not ask me anything. Print the final YAML in a fenced yaml block in your reply.
      must_contain: ["herdr: worktree.create"]

  - description: T4 on_failure recovery
    vars:
      task: >-
        Create an hwf workflow called test-guard that runs "bun test" and, if the workflow fails,
        shows a herdr desktop notification naming the failure. Do not ask me anything. Print the
        final YAML in a fenced yaml block in your reply.
      must_contain: ["on_failure"]

  - description: T5 hyphenated step ids and a cross-step reference
    vars:
      task: >-
        Create an hwf workflow called ci-echo with two steps. Name the first step id "check-lint"
        running "bun run lint", and the second step must echo the first step's stdout. Use those
        step names. Do not ask me anything. Print the final YAML in a fenced yaml block in your
        reply.

  - description: T6 placed pane with a size
    vars:
      task: >-
        Create an hwf workflow called dev-server that opens "bun run dev" in a new herdr tab,
        fire and forget, and give that pane about 40 percent of the space. Do not ask me
        anything. Print the final YAML in a fenced yaml block in your reply.

  - description: T7 under-specified — ask or invent
    vars:
      task: >-
        Set up an hwf workflow for my release process.
      require_yaml: false

  - description: T9 child composition — validation must resolve the existing child workflow
    vars:
      task: >-
        There is already a workflow called child-verify in this project that takes a branch input.
        Create an hwf workflow called verify-branch that asks for a branch name and reuses
        child-verify instead of repeating its steps. Do not ask me anything. Print the final YAML
        in a fenced yaml block in your reply.
      must_contain: ["workflow: child-verify"]

  - description: T10 editor schema pointer
    vars:
      task: >-
        Create an hwf workflow called fmt-check that runs "bun run format" and add the editor
        schema comment line at the top so my IDE validates it. Do not ask me anything. Print the
        final YAML in a fenced yaml block in your reply.
      must_not_contain: ["/main/docs/workflow.schema.json"]

  - description: T8 routing near-miss — belongs to the smoke-test skill
    vars:
      task: >-
        Bring up a throwaway Herdr instance in tmux with its own socket and config so I can
        smoke-test this plugin end to end without touching my live panes. Just tell me the steps,
        do not run anything.
      require_yaml: false
      expect_skill: ""
      forbid_skill: herdr-workflow-create

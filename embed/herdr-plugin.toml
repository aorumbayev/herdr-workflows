id = "herdr-workflows"
name = "herdr-workflows"
version = "0.10.0"
min_herdr_version = "0.8.2"
description = "Linear YAML workflow runner for herdr panes"
platforms = ["linux", "macos"]

# Remote GitHub install: download+verify the tag's archive into bin/, then native setup.
# Local `herdr plugin link` / `go run ./scripts/install-dev` do not run [[build]] — they compile the working tree.
[[build]]
command = ["sh", "scripts/install-release.sh"]

[[build]]
command = ["bin/herdr-workflows", "setup"]

[[actions]]
id = "launch"
title = "Launch herdr-workflows workflow"
contexts = ["workspace", "pane", "selection"]
command = ["bin/herdr-workflows", "launch"]

[[panes]]
id = "picker"
title = "Herdr Workflows"
# Compact default: the workflows and runs tabs hug their content. The console
# tab needs more, so it respawns the popup at its own size.
placement = "popup"
width = 64
height = 15
command = ["./bin/herdr-workflows", "picker"]

[[panes]]
id = "editor"
title = "Edit workflow"
placement = "split"
command = ["./bin/herdr-workflows", "editor"]

[[panes]]
id = "console"
title = "Herdr Workflows Console"
placement = "split"
command = ["./bin/herdr-workflows", "console"]

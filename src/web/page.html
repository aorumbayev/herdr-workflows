              hideAc();
              return;
            }
          }
          if (e.key === "Escape") {
            escaped = true; // Escape then Tab moves focus out instead of indenting
            return;
          }
          if (e.key === "Tab") {
            if (escaped) {
              escaped = false;
              return;
            }
            e.preventDefault();
            indent(e.shiftKey);
            return;
          }
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            newline();
            return;
          }
          escaped = false;
        });

        ta.addEventListener("input", () => {
          refresh();
          suggest();
          onInput();
        });
        ta.addEventListener("compositionstart", () => {
          composing = true;
        });
        ta.addEventListener("compositionend", () => {
          composing = false;
          refresh();
        });
        ta.addEventListener("scroll", () => {
          pre.scrollTop = ta.scrollTop;
          pre.scrollLeft = ta.scrollLeft;
        });
        ta.addEventListener("blur", hideAc);
        paint();

        return {
          wrap,
          ta,
          setValue(text) {
            ta.value = text;
            hideAc();
            paint();
          },
          gotoLine(i) {
            const lines = ta.value.split("\n");
            if (i < 0 || i >= lines.length) return;
            let start = 0;
            for (let k = 0; k < i; k++) start += lines[k].length + 1;
            ta.focus();
            ta.setSelectionRange(start, start + lines[i].length);
            ta.scrollTop = Math.max(0, i * lineHeight() - ta.clientHeight / 2);
            pre.scrollTop = ta.scrollTop;
          },
        };
      }

      // "buffer.yaml, step 2, run: …" → the 0-based line of that step (and its key, when named).
      function errorLine(text, err) {
        const sm = /\bstep (\d+)/.exec(err || "");
        if (!sm) return -1;
        const lines = text.split("\n");
        const want = Number(sm[1]);
        let inSteps = false;
        let seen = 0;
        let at = -1;
        for (let i = 0; i < lines.length && at < 0; i++) {
          if (/^steps:/.test(lines[i])) inSteps = true;
          else if (!inSteps) continue;
          else if (/^\S/.test(lines[i])) inSteps = false;
          else if (/^\s*-\s/.test(lines[i]) && ++seen === want) at = i;
        }
        if (at < 0) return -1;
        const km = /\bstep \d+, ([a-z_][a-z0-9_.]*):/.exec(err);
        if (!km) return at;
        const keyRe = new RegExp("(^|-\\s+)" + km[1].replace(/\./g, "\\.") + "\\s*:");
        for (let i = at; i < lines.length; i++) {
          if (i > at && /^\s*-\s/.test(lines[i])) break;
          if (keyRe.test(lines[i])) return i;
        }
        return at;
      }

      function renderEditor(name, scope, text, loadError, flags) {
        const pane = $("pane");
        pane.innerHTML = "";
        editorDirty = false;
        editorFileText = text;
        let mode = "text";
        let extras = { version: "v1alpha1" }; // metadata carried through canvas mode untouched
        let validateTimer = null;
        let syncTimer = null;
        let syncSeq = 0;

        const nameIn = document.createElement("input");
        nameIn.placeholder = "name";
        nameIn.value = name;
        const scopeSel = mkScopeSelect(scope);

        const modeSeg = document.createElement("div");
        modeSeg.className = "seg";
        const textBtn = mkBtn("yaml", () => setMode("text"));
        const visBtn = mkBtn("canvas", () => setMode("visual"));
        textBtn.classList.add("on");
        modeSeg.append(textBtn, visBtn);

        const addbar = document.createElement("div");
        addbar.className = "addbar";
        const addCap = document.createElement("span");
        addCap.className = "cap";
        addCap.textContent = "append";
        addbar.appendChild(addCap);
        for (const verb of VERBS) addbar.appendChild(mkBtn("+ " + verb, () => addStep(verb)));

        const bar1 = document.createElement("div");
        bar1.className = "bar";
        bar1.append(nameIn, scopeSel, modeSeg, addbar);

        const flagBox = document.createElement("div");
        flagBox.className = "flags";
        function paintFlags(list) {
          const items = list || [];
          if (!items.length) {
            flagBox.classList.remove("warn");
            flagBox.textContent = "";
            flagBox.classList.add("hide");
            return;
          }
          flagBox.classList.remove("hide");
          flagBox.classList.add("warn");
          flagBox.textContent = "sensitive: " + items.join(" · ");
        }
        paintFlags(flags);

        const ed = mkCodeEditor(text, () => {
          editorDirty = true;
          runValidate();
        });
        const ta = ed.ta;

        const canvasHost = document.createElement("div");
        canvasHost.className = "canvas hide";
        const canvas = makeCanvas(
          canvasHost,
          () => scheduleSync(),
          () => "When you run: hwf run " + (nameIn.value.trim() || "<name>"),
        );

        const status = document.createElement("div");
        status.className = "status";

        function runValidate() {
          clearTimeout(validateTimer);
          validateTimer = setTimeout(async () => {
            const r = await api("/api/validate", {
              method: "POST",
              body: JSON.stringify({ name: nameIn.value.trim() || "buffer", text: ta.value }),
            });
            if (!ta.isConnected) return; // editor was replaced while the request was in flight
            showProblem(r.data.ok, r.data.ok ? "valid" : r.data.error);
            const t = ta.value;
            const next = [];
            if (/^\s*-\s*run\s*:/m.test(t) || /\n\s*-\s*run\s*:/.test(t)) next.push("commands");
            if (/context\.transcript(?:_file)?/.test(t)) next.push("transcript");
            for (const m of t.matchAll(/^\s*herdr:\s*(\S+)/gm)) {
              const method = m[1];
              if (
                /^(pane\.close|tab\.close|workspace\.close|agent\.send_keys|pane\.send_keys|pane\.send_text|pane\.send_input|worktree\.create|layout\.apply)$/.test(
                  method,
                )
              )
                next.push("herdr:" + method);
            }
            paintFlags([...new Set(next)]);
          }, 350);
        }

        function showProblem(ok, msg) {
          const line = ok ? -1 : errorLine(ta.value, msg);
          setStatus(status, ok, msg, line < 0 ? null : () => ed.gotoLine(line));
        }

        function addStep(verb) {
          let t = ta.value.replace(/\s+$/, "");
          if (!/^steps:/m.test(t)) t = (t ? t + "\n" : "") + "steps:";
          ed.setValue(t + "\n\n" + SKELETONS[verb] + "\n");
          editorDirty = true;
          ta.focus();
          ta.setSelectionRange(ta.value.length, ta.value.length);
          runValidate();
        }

        async function setMode(next) {
          if (next === mode) return;
          if (next === "visual") {
            const r = await api("/api/parse", {
              method: "POST",
              body: JSON.stringify({ text: ta.value }),
            });
            if (!r.data.ok) {
              showProblem(
                false,
                "fix YAML before canvas edit — " + (r.data.error || "parse failed"),
              );
              return;
            }
            extras = { version: "v1alpha1" };
            if (r.data.doc.version) extras.version = r.data.doc.version;
            if (r.data.doc.title) extras.title = r.data.doc.title;
            if (r.data.doc.description) extras.description = r.data.doc.description;
            if (r.data.doc.hidden) extras.hidden = r.data.doc.hidden;
            if (r.data.doc.inputs) extras.inputs = r.data.doc.inputs;
            if (r.data.doc.returns) extras.returns = r.data.doc.returns;
            if (r.data.doc.on_failure) extras.on_failure = r.data.doc.on_failure;
            canvasHost.classList.remove("hide");
            canvas.load(r.data.doc.steps);
          } else if (!(await syncFromCanvas())) {
            return; // stale YAML would wipe the node edits on the way back in
          }
          mode = next;
          editorMode = next;
          textBtn.classList.toggle("on", mode === "text");
          visBtn.classList.toggle("on", mode === "visual");
          ed.wrap.classList.toggle("hide", mode !== "text");
          addbar.classList.toggle("hide", mode !== "text");
          canvasHost.classList.toggle("hide", mode !== "visual");
        }

        function scheduleSync() {
          clearTimeout(syncTimer);
          syncTimer = setTimeout(() => syncFromCanvas(), 300);
        }

        // Canvas → raw steps → server format → back into the shared YAML buffer, then validate.
        async function syncFromCanvas() {
          clearTimeout(syncTimer);
          const built = canvas.steps();
          if (built.error) {
            setStatus(status, false, built.error);
            return false;
          }
          if (built.steps.length === 0) {
            setStatus(status, "info", "no steps yet — add your first step on the canvas");
            return false;
          }
          const seq = ++syncSeq;
          const r = await api("/api/format", {
            method: "POST",
            body: JSON.stringify({
              doc: Object.assign({ version: "v1alpha1" }, extras, { steps: built.steps }),
            }),
          });
          if (seq !== syncSeq || !ta.isConnected) return false; // a newer sync already won
          if (!r.data.ok) {
            setStatus(status, false, r.data.error || "format failed");
            return false;
          }
          ed.setValue(r.data.text);
          editorDirty = true;
          runValidate();
          return true;
        }

        const bar2 = document.createElement("div");
        bar2.className = "bar";
        const save = mkBtn("save", async () => {
          if (mode === "visual" && !(await syncFromCanvas())) return;
          const newName = nameIn.value.trim();
          const newScope = scopeSel.value;
          const r = await api("/api/workflow", {
            method: "PUT",
            body: JSON.stringify({ name: newName, scope: newScope, text: ta.value }),
          });
          if (!r.data.ok) {
            showProblem(false, r.data.error || "save failed");
            toast("not saved — " + (r.data.error || "save failed"), false);
            return;
          }
          editorDirty = false;
          // Renamed or re-scoped: drop the previous file so a save doesn't silently fork.
          if (name && (name !== newName || scope !== newScope)) {
            await api("/api/workflow", { method: "DELETE", body: JSON.stringify({ name, scope }) });
          }
          toast("saved " + newName, true);
          await loadState();
          await openWorkflow(newName, newScope);
        });
        save.className = "primary";
        const copy = mkBtn("copy", () => {
          navigator.clipboard.writeText(ta.value).then(
            () => toast("YAML copied to clipboard", true),
            (e) => toast("copy failed — " + errMsg(e), false),
          );
        });
        const download = mkBtn("download", () => {
          const blob = new Blob([ta.value], { type: "text/yaml" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = (nameIn.value.trim() || "workflow") + ".yaml";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        });
        bar2.append(save, copy, download);

        const entry = state.entries.find((e) => e.name === name);
        const inBoth = !!entry && entry.inRepo && entry.inGlobal;

        // Move (copy to the other scope, then drop the source) only when the name lives in one scope;
        // when it exists in both, a move would clobber, so no button.
        if (entry && !inBoth) {
          const otherLabel = (s) => (s === "repo" ? "global" : "local");
          const move = mkBtn("", async () => {
            const fromScope = scopeSel.value;
            const to = fromScope === "repo" ? "global" : "repo";
            const mvName = nameIn.value.trim();
            const p = await api("/api/promote", {
              method: "POST",
              body: JSON.stringify({ name: mvName, from: fromScope, to }),
            });
            if (!p.data.ok) {
              setStatus(status, false, p.data.error || "move failed");
              return;
            }
            await api("/api/workflow", {
              method: "DELETE",
              body: JSON.stringify({ name: mvName, scope: fromScope }),
            });
            editorDirty = false;
            toast("moved to " + otherLabel(fromScope), true);
            await loadState();
            await openWorkflow(mvName, to);
          });
          const syncMoveLabel = () => {
            move.textContent = "move to " + otherLabel(scopeSel.value);
          };
          scopeSel.addEventListener("change", syncMoveLabel);
          syncMoveLabel();
          bar2.appendChild(move);
        }

        async function dropScopes(scopes) {
          for (const s of scopes)
            await api("/api/workflow", {
              method: "DELETE",
              body: JSON.stringify({ name, scope: s }),
            });
          editorDirty = false;
          current = null;
          toast("deleted " + name, true);
          await loadState();
        }

        // Delete: when the name exists in both scopes, let the user pick which variant(s) to remove.
        if (inBoth) {
          const delSel = document.createElement("select");
          for (const [val, lbl] of [
            ["repo", "local"],
            ["global", "global"],
            ["both", "both"],
          ]) {
            const o = document.createElement("option");
            o.value = val;
            o.textContent = lbl;
            delSel.appendChild(o);
          }
          const del = mkBtn("delete", () => {
            const which = delSel.value;
            if (!confirm("delete " + name + " (" + (which === "repo" ? "local" : which) + ")?"))
              return;
            dropScopes(which === "both" ? ["repo", "global"] : [which]);
          });
          bar2.append(delSel, del);
        } else {
          const del = mkBtn("delete", () => {
            if (!confirm("delete " + name + "?")) return;
            dropScopes([scope]);
          });
          bar2.appendChild(del);
        }

        const foot = document.createElement("div");
        foot.className = "hint";
        foot.append("run in a terminal: ");
        const footCmd = document.createElement("code");
        foot.append(footCmd, " (no run from browser)");
        const setFoot = () => {
          footCmd.textContent = "hwf run " + (nameIn.value.trim() || "<name>");
          canvas.setTrigger("When you run: hwf run " + (nameIn.value.trim() || "<name>"));
        };
        setFoot();
        nameIn.oninput = () => {
          editorDirty = true;
          setFoot();
        };

        pane.append(bar1, flagBox, ed.wrap, canvasHost, status, bar2, foot);
        if (loadError) showProblem(false, loadError);
        runValidate();
        if (editorMode === "visual") setMode("visual");
      }

      function mkScopeSelect(scope) {
        const sel = document.createElement("select");
        for (const s of ["repo", "global"]) {
          const o = document.createElement("option");
          o.value = s;
          o.textContent = s === "repo" ? "local" : "global";
          if (s === scope) o.selected = true;
          sel.appendChild(o);
        }
        return sel;
      }

      function mkBtn(label, fn) {
        const b = document.createElement("button");
        b.textContent = label;
        b.onclick = fn;
        return b;
      }

      function setStatus(el, ok, msg, jump) {
        el.textContent = msg || "";
        el.className = "status " + (ok === "info" ? "" : ok ? "ok" : "bad") + (jump ? " jump" : "");
        el.onclick = jump || null;
        el.title = jump ? "jump to the line" : "";
      }

      async function renderConfig() {
        $("list").classList.add("hide");
        const pane = $("pane");
        pane.innerHTML = "";
        const bar = document.createElement("div");
        bar.className = "bar";
        const scopeSel = mkScopeSelect("repo");
        let shownScope = scopeSel.value;
        let cfgSeq = 0;
        const ta = document.createElement("textarea");
        ta.setAttribute("aria-label", "config YAML");
        const status = document.createElement("div");
        status.className = "status";
        const save = mkBtn("save", async () => {
          const r = await api("/api/config", {
            method: "PUT",
            body: JSON.stringify({ scope: shownScope, text: ta.value }),
          });
          setStatus(status, !!r.data.ok, r.data.ok ? "saved" : r.data.error || "save failed");
          if (!r.data.ok) return;
          configDirty = false;
          toast("saved " + (shownScope === "repo" ? "local" : "global") + " config", true);
        });
        save.className = "primary";
        // Last-write-wins: a superseded load must not drop its text into a newer scope's buffer.
        const load = async () => {
          const seq = ++cfgSeq;
          const want = scopeSel.value;
          save.disabled = true;
          setStatus(status, "info", "loading…");
          const r = await api("/api/config?scope=" + want);
          if (seq !== cfgSeq || !ta.isConnected) return;
          save.disabled = false;
          if (r.status !== 200) {
            setStatus(status, false, r.data.error || "load failed");
            return;
          }
          ta.value = r.data.text || "";
          shownScope = want;
          configDirty = false;
          setStatus(status, "info", "");
        };
        scopeSel.onchange = () => {
          if (configDirty && !confirm("discard unsaved config changes?")) {
            scopeSel.value = shownScope;
            return;
          }
          load();
        };
        ta.oninput = () => {
          configDirty = true;
        };
        bar.append(scopeSel, save);
        pane.append(bar, ta, status);
        await load();
      }

      function fmtWhen(ts) {
        const d = new Date(ts);
        if (isNaN(d)) return ts;
        return d.toLocaleString(undefined, {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      async function renderRuns() {
        $("list").classList.add("hide");
        const pane = $("pane");
        pane.innerHTML = "<p class=hint>loading…</p>";
        const { data } = await api("/api/runs");
        const runs = data.runs || [];
        pane.innerHTML = "";
        if (!runs.length) {
          pane.innerHTML = "<p class=hint>no runs yet</p>";
          return;
        }
        const wrap = document.createElement("div");
        wrap.id = "runs-list";
        for (const r of runs) {
          const row = document.createElement("div");
          row.className = "run";
          const status = r.ok ? "ok" : "failed";
          row.innerHTML =
            '<span class="dot ' +
            (r.ok ? "ok" : "bad") +
            '"></span>' +
            '<span class="name">' +
            esc(r.workflow) +
            "</span>" +
            '<span class="' +
            (r.ok ? "hint" : "err") +
            '">' +
            esc(status) +
            "</span>" +
            (r.error ? '<span class="err">— ' + esc(r.error) + "</span>" : "") +
            '<span class="when">' +
            esc(fmtWhen(r.ts)) +
            "</span>";
          wrap.appendChild(row);
        }
        pane.appendChild(wrap);
      }

      async function renderShare(scope, name) {
        syncWorkflowLayout();
        const pane = $("pane");
        const seq = ++openSeq;
        pane.innerHTML = "<p class=hint>loading share…</p>";
        const r = await api(
          "/api/share?name=" + encodeURIComponent(name) + "&scope=" + encodeURIComponent(scope),
        );
        if (seq !== openSeq) return;
        if (!routeView || routeView.kind !== "share") return;
        pane.innerHTML = "";
        const head = document.createElement("div");
        head.className = "route-head";
        head.innerHTML =
          "<h2>share <code>" +
          esc(scope) +
          ":" +
          esc(name) +
          "</code></h2><span class=hint>connected workflows · import command</span>";
        pane.appendChild(head);
        if (r.status !== 200 || !r.data.ok) {
          const err = document.createElement("p");
          err.className = "status bad";
          err.textContent = r.data.error || "could not build share bundle";
          pane.appendChild(err);
          return;
        }
        const provenance = {};
        for (const p of r.data.provenance || []) provenance[p.name] = p.source;
        const entries = r.data.entries || [];
        if (!entries.length) {
          const empty = document.createElement("p");
          empty.className = "hint";
          empty.textContent = "bundle is empty";
          pane.appendChild(empty);
          return;
        }
        const names = document.createElement("div");
        names.className = "flags";
        names.textContent =
          "includes " +
          entries
            .map((e) => {
              const src = provenance[e.name];
              const label = src === "repo" ? "local" : src === "global" ? "global" : "local";
              return e.name + " (" + label + ")";
            })
            .join(" · ");
        pane.appendChild(names);
        const cap = document.createElement("p");
        cap.className = "bar";
        cap.innerHTML = "<span class=cap>import command</span>";
        pane.appendChild(cap);
        const cmd = document.createElement("div");
        cmd.className = "cmd-box";
        cmd.setAttribute("role", "textbox");
        cmd.setAttribute("aria-readonly", "true");
        cmd.setAttribute("aria-label", "import command");
        cmd.tabIndex = 0;
        cmd.textContent = r.data.command || "";
        pane.appendChild(cmd);
        const bar = document.createElement("div");
        bar.className = "bar";
        const copy = mkBtn("copy import command", () => {
          navigator.clipboard.writeText(r.data.command || "").then(
            () => toast("import command copied", true),
            (e) => toast("copy failed — " + errMsg(e), false),
          );
        });
        copy.className = "primary";
        bar.appendChild(copy);
        pane.appendChild(bar);
        const listCap = document.createElement("p");
        listCap.className = "bar";
        listCap.innerHTML = "<span class=cap>bundled workflows</span>";
        pane.appendChild(listCap);
        const bundle = document.createElement("div");
        bundle.className = "bundle";
        for (const e of entries) {
          const item = document.createElement("div");
          item.className = "item";
          const top = document.createElement("div");
          top.className = "top";
          top.innerHTML =
            "<span class=name>" +
            esc(e.name) +
            "</span><span class=badge>" +
            esc(
              provenance[e.name] === "global"
                ? "global"
                : provenance[e.name] === "repo"
                  ? "local"
                  : "—",
            ) +
            "</span>";
          item.append(top, yamlBlock(e.yaml || ""));
          bundle.appendChild(item);
        }
        pane.appendChild(bundle);
      }

      function renderImport() {
        syncWorkflowLayout();
        const pane = $("pane");
        pane.innerHTML = "";
        const head = document.createElement("div");
        head.className = "route-head";
        head.innerHTML =
          "<h2>import workflows</h2><span class=hint>review every YAML · one destination · no run</span>";
        pane.appendChild(head);
        const paste = document.createElement("textarea");
        paste.id = "import-paste";
        paste.setAttribute("aria-label", "import command or encoded bundle");
        paste.placeholder = 'hwf workflow import "…"  — or paste the encoded bundle';
        pane.appendChild(paste);
        const bar = document.createElement("div");
        bar.className = "bar";
        const previewBtn = mkBtn("preview", () => runImportPreview());
        previewBtn.className = "primary";
        bar.appendChild(previewBtn);
        pane.appendChild(bar);
        const status = document.createElement("div");
        status.id = "import-status";
        status.className = "status";
        pane.appendChild(status);
        const review = document.createElement("div");
        review.id = "import-review";
        pane.appendChild(review);

        async function runImportPreview() {
          const text = paste.value.trim();
          review.innerHTML = "";
          if (!text) {
            setStatus(status, false, "paste an import command or encoded bundle");
            return;
          }
          setStatus(status, "info", "loading preview…");
          const r = await api("/api/import/preview", {
            method: "POST",
            body: JSON.stringify({ text }),
          });
          if (!r.data.ok) {
            setStatus(status, false, r.data.error || "preview failed");
            return;
          }
          setStatus(status, true, "preview ready — choose a destination and confirm");
          const entries = r.data.entries || [];
          const warnings = r.data.warnings || [];
          const unresolved = r.data.unresolvedChildren || [];
          const availability = r.data.availability || {};

          if (r.data.banner) {
            const banner = document.createElement("div");
            banner.className = "flags warn";
            banner.textContent = r.data.banner.trim();
            review.appendChild(banner);
          }
          if (warnings.length) {
            const wl = document.createElement("div");
            wl.className = "flags warn";
            wl.textContent = "warnings · " + warnings.join(" · ");
            review.appendChild(wl);
          }
          if (unresolved.length) {
            const note = document.createElement("p");
            note.className = "hint";
            note.textContent =
              "referenced but not in bundle: " +
              unresolved.join(", ") +
              " — resolve on import host";
            review.appendChild(note);
          }
          if (!entries.length) {
            const empty = document.createElement("p");
            empty.className = "hint";
            empty.textContent = "no workflows in this bundle";
            review.appendChild(empty);
            return;
          }
          const bundle = document.createElement("div");
          bundle.className = "bundle";
          for (const e of entries) {
            const item = document.createElement("div");
            item.className = "item";
            const top = document.createElement("div");
            top.className = "top";
            const warnBits = (e.warnings || []).length ? " · " + e.warnings.join(" · ") : "";
            top.innerHTML =
              "<span class=name>" +
              esc(e.title || e.name) +
              "</span><span class=badge>" +
              esc(e.name) +
              esc(warnBits) +
              "</span>";
            item.append(top, yamlBlock(e.yaml || ""));
            bundle.appendChild(item);
          }
          review.appendChild(bundle);

          const dest = document.createElement("div");
          dest.className = "bar";
          dest.innerHTML = "<span class=cap>destination</span>";
          const scopeSel = document.createElement("select");
          scopeSel.setAttribute("aria-label", "import destination scope");
          for (const s of ["repo", "global"]) {
            const o = document.createElement("option");
            o.value = s;
            o.textContent = s === "repo" ? "local (repo)" : "global";
            scopeSel.appendChild(o);
          }
          dest.appendChild(scopeSel);
          const conflictHint = document.createElement("span");
          conflictHint.className = "hint";
          const syncConflicts = () => {
            const scope = scopeSel.value;
            const conflicts = (availability[scope] && availability[scope].conflicts) || [];
            conflictHint.textContent = conflicts.length
              ? "conflicts: " + conflicts.map((c) => c.name || c).join(", ")
              : "no name conflicts in " + (scope === "repo" ? "local" : "global");
          };
          scopeSel.onchange = syncConflicts;
          syncConflicts();
          dest.appendChild(conflictHint);
          review.appendChild(dest);

          const actions = document.createElement("div");
          actions.className = "bar";
          const confirmBtn = mkBtn("confirm import", async () => {
            const scope = scopeSel.value;
            const n = entries.length;
            if (
              !confirm(
                "import " +
                  n +
                  " workflow" +
                  (n === 1 ? "" : "s") +
                  " into " +
                  (scope === "repo" ? "local (repo)" : "global") +
                  "?",
              )
            )
              return;
            await writeImport(text, scope, false);
          });
          confirmBtn.className = "primary";
          actions.appendChild(confirmBtn);
          review.appendChild(actions);
          const resultBox = document.createElement("div");
          resultBox.id = "import-result";
          resultBox.className = "status";
          review.appendChild(resultBox);

          async function writeImport(payload, scope, replaceAll) {
            const out = $("import-result") || resultBox;
            setStatus(out, "info", replaceAll ? "replacing…" : "importing…");
            const wr = await api("/api/import", {
              method: "POST",
              body: JSON.stringify({ text: payload, scope, replaceAll }),
            });
            if (wr.status === 409) {
              const conflicts = wr.data.conflicts || [];
              const names = conflicts.map((c) => c.name || c).join(", ");
              if (
                !confirm(
                  "replace existing workflows (" +
                    (names || "conflicts") +
                    ")? this overwrites every conflicting file in the chosen scope.",
                )
              ) {
                setStatus(out, false, "import cancelled — existing files kept");
                return;
              }
              return writeImport(payload, scope, true);
            }
            if (!wr.data.ok) {
              setStatus(out, false, wr.data.error || "import failed");
              toast("import failed", false);
              return;
            }
            const saved = wr.data.results || [];
            const msg =
              "saved " +
              saved.length +
              " file" +
              (saved.length === 1 ? "" : "s") +
              (saved.length ? ": " + saved.map((s) => s.name).join(", ") : "");
            setStatus(out, true, msg);
            toast(msg, true);
            await loadState();
          }
        }
      }

      function openShare(scope, name) {
        openSeq += 1;
        routeView = { kind: "share", scope, name };
        current = null;
        wantOpen = null;
        tab = "workflows";
        setHash("share=" + scope + ":" + name);
        document
          .querySelectorAll(".tab")
          .forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
        syncWorkflowLayout();
        void renderShare(scope, name);
      }

      function openImport() {
        openSeq += 1;
        routeView = { kind: "import" };
        current = null;
        wantOpen = null;
        tab = "workflows";
        setHash("import");
        document
          .querySelectorAll(".tab")
          .forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
        syncWorkflowLayout();
        renderImport();
      }

      document.querySelectorAll(".tab").forEach(
        (b) =>
          (b.onclick = () => {
            if (!confirmLeave()) return;
            routeView = null;
            clearRouteHash();
            tab = b.dataset.tab;
            if (tab === "workflows") current = null;
            render();
          }),
      );
      addEventListener("beforeunload", (e) => {
        if (!editorDirty && !configDirty) return;
        e.preventDefault();
        e.returnValue = "";
      });

      function setHash(h) {
        if (location.hash !== "#" + h) location.hash = h;
      }

      // #w=<scope>:<name> — editor deep link
      // #share=<scope>:<name> — share bundle + import command
      // #import — paste/preview/confirm import (no run)
      // empty hash — leave share/import (and editor deep-link) for the workflow list
      function applyHash() {
        const hash = location.hash.slice(1);
        if (!hash) {
          if (!routeView && !current) return;
          if (!confirmLeave()) {
            restoreRouteHash();
            return;
          }
          openSeq += 1;
          routeView = null;
          current = null;
          wantOpen = null;
          tab = "workflows";
          syncWorkflowLayout();
          renderWorkflows();
          return;
        }
        if (hash === "import") {
          if (routeView && routeView.kind === "import") return;
          if (!confirmLeave()) {
            restoreRouteHash();
            return;
          }
          openImport();
          return;
        }
        const share = /^share=(repo|global):([a-z0-9][a-z0-9-_]*)$/.exec(hash);
        if (share) {
          const scope = share[1];
          const name = share[2];
          if (
            routeView &&
            routeView.kind === "share" &&
            routeView.scope === scope &&
            routeView.name === name
          )
            return;
          if (!confirmLeave()) {
            restoreRouteHash();
            return;
          }
          openShare(scope, name);
          return;
        }
        const m = /^w=(repo|global):([a-z0-9][a-z0-9-_]*)$/.exec(hash);
        if (!m) return;
        const [, scope, name] = m;
        if (!routeView && current && current.name === name && current.scope === scope) return;
        if (!confirmLeave()) {
          restoreRouteHash();
          return;
        }
        routeView = null;
        tab = "workflows";
        const entry = state.entries.find((e) => e.name === name);
        if (entry) {
          const has = scope === "repo" ? entry.inRepo : entry.inGlobal;
          return openWorkflow(name, has ? scope : entry.source);
        }
        wantOpen = { name, scope }; // not written yet — liveTick opens it once it appears
        current = null;
        syncWorkflowLayout();
        renderWorkflows();
        $("pane").innerHTML = "<p class=hint>waiting for " + esc(name) + "…</p>";
      }

      let liveSig = "";
      let liveBusy = false;

      // Poll disk so a workflow an agent is writing shows up (and redraws) without a reload.
      // Local edits win: a dirty buffer is never overwritten.
      async function liveTick() {
        if (
          liveBusy ||
          document.hidden ||
          tab !== "workflows" ||
          routeView ||
          editorDirty ||
          configDirty
        )
          return;
        liveBusy = true;
        try {
          const s = await api("/api/state");
          if (s.status === 200 && !s.data.error) {
            const sig = JSON.stringify(s.data.entries || []);
            if (sig !== liveSig) {
              liveSig = sig;
              state = Object.assign(state, s.data);
              renderWorkflows();
              if (wantOpen) applyHash();
            }
          }
          if (!current || !current.name || editorDirty) return;
          const r = await api(
            "/api/workflow?name=" + encodeURIComponent(current.name) + "&scope=" + current.scope,
          );
          if (r.status !== 200 || editorDirty) return;
          const text = r.data.text || "";
          if (text === editorFileText) return;
          renderEditor(current.name, current.scope, text, r.data.error || "");
        } finally {
          liveBusy = false;
        }
      }

      addEventListener("hashchange", applyHash);
      setInterval(liveTick, 1500);
      loadState().then(applyHash);

      function themeMode() {
        try {
          const t = localStorage.getItem(THEME_KEY);
          if (t === "light" || t === "dark") return t;
        } catch (e) {}
        return null;
      }

      function themeLabel(mode) {
        return mode || "system";
      }

      function syncThemeControl() {
        const btn = $("theme-btn");
        if (!btn) return;
        const mode = themeMode();
        const label = themeLabel(mode);
        btn.textContent = label;
        btn.setAttribute("aria-label", "Theme: " + label);
        btn.setAttribute("aria-pressed", mode ? "true" : "false");
        document.documentElement.dataset.theme =
          mode || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      }

      function cycleTheme() {
        const cur = themeMode();
        const i = THEME_CYCLE.indexOf(cur);
        const next = THEME_CYCLE[(i + 1) % THEME_CYCLE.length];
        try {
          if (next) localStorage.setItem(THEME_KEY, next);
          else localStorage.removeItem(THEME_KEY);
        } catch (e) {}
        syncThemeControl();
      }

      $("theme-btn").addEventListener("click", cycleTheme);
      syncThemeControl();
      try {
        matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => {
          if (themeMode() == null) syncThemeControl();
        });
      } catch (e) {}
    </script>
  </body>
</html>

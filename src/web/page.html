<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap"
    />
    <title>herdr-workflows</title>
    <script>
      // Stamps the resolved theme before first paint, so a light-preferring reload never flashes dark.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("hwf-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark")
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      :root {
        /* Nord palette. Kept as rgb() literals so verifyx hardcoded-colors still guards the rest of the file. */
        --nord0: rgb(46 52 64);
        --nord1: rgb(59 66 82);
        --nord2: rgb(67 76 94);
        --nord3: rgb(76 86 106);
        --nord4: rgb(216 222 233);
        --nord5: rgb(229 233 240);
        --nord6: rgb(236 239 244);
        --nord7: rgb(143 188 187);
        --nord8: rgb(136 192 208);
        --nord9: rgb(129 161 193);
        --nord10: rgb(94 129 172);
        --nord11: rgb(191 97 106);
        --nord12: rgb(208 135 112);
        --nord13: rgb(235 203 139);
        --nord14: rgb(163 190 140);
        --nord15: rgb(180 142 173);
        color-scheme: dark;
        --bg: var(--nord0);
        --bg-elevated: color-mix(in srgb, var(--nord1) 50%, var(--nord0));
        --ink: rgb(255 255 255);
        --ink-soft: var(--nord6);
        /* Lighter than the pre-token value: the original rgb(135 146 168) missed AA on --bg. */
        --muted: color-mix(in srgb, var(--nord4) 52%, var(--nord3));
        --muted-2: color-mix(in srgb, var(--nord4) 14%, var(--nord3));
        --line: var(--nord2);
        --line-strong: var(--nord3);
        --accent: var(--nord8);
        --accent-soft: color-mix(in srgb, var(--accent) 10%, transparent);
        --green: var(--nord14);
        --yellow: var(--nord13);
        --red: var(--nord11);
        --term-bg: var(--nord1);
        --term-border: var(--nord2);
        --term-text: var(--nord6);
        --fill: var(--accent);
        --fill-ink: var(--nord0);
        --canvas-bg: var(--nord0);
        --canvas-dot: var(--nord3);
        --edge: color-mix(in srgb, var(--nord4) 42%, var(--nord3));
        --port: color-mix(in srgb, var(--nord4) 58%, var(--nord3));
        --node-surface: var(--nord1);
        --node-border: var(--nord3);
        --node-shadow: 0 2px 10px color-mix(in srgb, black 38%, transparent);
        --scrim: color-mix(in srgb, color-mix(in srgb, var(--nord0) 52%, black) 72%, transparent);
        --n-trigger: var(--nord15);
        --n-run: var(--nord14);
        --n-agent: var(--nord9);
        --n-use: var(--nord13);
        --n-prim: var(--nord7);
        --tok-key: var(--n-agent);
        --tok-verb: var(--yellow);
        --tok-str: var(--green);
        --tok-num: var(--n-use);
        --tok-com: var(--muted);
        --tok-blk: var(--n-prim);
        /* Lifted off --n-trigger: bare nord15 sits at 4.4:1 on --bg. */
        --tok-ph: color-mix(in srgb, var(--nord6) 12%, var(--nord15));
        --tok-pun: var(--muted);
        --caret: var(--accent);
        --pop-bg: var(--bg-elevated);
        --pop-sel: var(--accent-soft);
        --toast-bg: var(--bg-elevated);
        --num-bg: var(--line-strong);
        --radius: 4px;
        --radius-sm: 2px;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      /* Nord Light. Frost and Aurora hues are darkened toward nord0 so they hold AA on Snow Storm.
         The head script always stamps data-theme, so no prefers-color-scheme block is needed here. */
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: var(--nord6);
        --bg-elevated: var(--nord5);
        --ink: var(--nord0);
        --ink-soft: var(--nord1);
        --muted: var(--nord3);
        --muted-2: rgb(93 104 121);
        --line: var(--nord4);
        --line-strong: rgb(195 203 217);
        --accent: var(--nord10);
        --accent-soft: rgb(221 228 237);
        --green: rgb(93 108 80);
        --yellow: rgb(117 101 69);
        --red: rgb(148 83 93);
        --term-bg: var(--nord5);
        --term-border: var(--nord4);
        --term-text: var(--nord0);
        --fill: var(--accent);
        --fill-ink: var(--nord6);
        --canvas-bg: var(--nord6);
        --canvas-dot: rgb(195 203 217);
        --edge: rgb(90 102 122);
        --port: rgb(76 86 106);
        --node-surface: var(--nord5);
        --node-border: rgb(160 170 186);
        --node-shadow: 0 2px 10px color-mix(in srgb, var(--nord0) 14%, transparent);
        --scrim: rgb(46 52 64 / 60%);
        --n-trigger: rgb(122 97 118);
        --n-run: rgb(93 108 80);
        --n-agent: rgb(85 106 127);
        --n-use: rgb(117 101 69);
        --n-prim: rgb(83 109 108);
        --tok-key: var(--n-agent);
        --tok-verb: var(--yellow);
        --tok-str: var(--green);
        --tok-num: var(--n-use);
        --tok-com: var(--muted);
        --tok-blk: var(--n-prim);
        --tok-ph: var(--n-trigger);
        --tok-pun: var(--muted);
        --caret: var(--accent);
        --pop-bg: var(--bg-elevated);
        --pop-sel: var(--accent-soft);
        --toast-bg: var(--bg-elevated);
        --num-bg: var(--line-strong);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--mono);
        font-size: 14px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      ::selection {
        background: var(--accent-soft);
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--line-strong);
        border-radius: 6px;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 1ms !important;
          animation-duration: 1ms !important;
        }
      }

      header {
        display: flex;
        gap: 1.2rem;
        align-items: center;
        padding: 0.7rem 1.1rem;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(12px);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      header h1 {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      header h1 span {
        color: var(--muted);
        font-weight: 400;
      }
      header .tabs {
        display: flex;
        gap: 0.25rem;
        padding-left: 1.2rem;
        border-left: 1px solid var(--line-strong);
      }
      header .repo {
        font-size: 11px;
        color: var(--muted);
      }
      header .repo b {
        color: var(--ink-soft);
        font-weight: 600;
      }
      header .theme {
        margin-left: auto;
        min-width: 32px;
        min-height: 32px;
        padding: 0.35rem 0.65rem;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: lowercase;
      }

      button,
      select,
      input {
        font: inherit;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        padding: 0.4rem 0.75rem;
        cursor: pointer;
        transition:
          background 120ms ease,
          border-color 120ms ease,
          color 120ms ease;
      }
      button:hover:not(:disabled),
      select:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      button:not(.plus):active {
        transform: translateY(1px);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.primary {
        background: var(--ink);
        border-color: transparent;
        color: var(--bg);
        font-weight: 600;
      }
      button.primary:hover:not(:disabled) {
        background: var(--accent);
        border-color: transparent;
        color: var(--fill-ink);
      }
      input {
        min-width: 9rem;
        cursor: text;
      }
      input[type="checkbox"] {
        min-width: 0;
        padding: 0;
        width: 1rem;
        height: 1rem;
        cursor: pointer;
        accent-color: var(--accent);
      }
      button:focus-visible,
      .tab:focus-visible,
      select:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      .canvas:focus-visible,
      .cmd-box:focus-visible,
      .node:focus-visible,
      .theme:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        border-color: transparent;
      }

      .tab {
        font-weight: 600;
        min-height: 32px;
        min-width: 32px;
      }
      .tab:hover:not(.on):not(:disabled) {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .tab.on {
        background: var(--accent);
        color: var(--fill-ink);
        border-color: var(--accent);
      }
      .tab.on:hover {
        background: var(--fill);
        color: var(--fill-ink);
      }
      .bar button {
        min-height: 32px;
      }

      main {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        flex: 1;
        min-height: 0;
      }
      main.full {
        grid-template-columns: minmax(0, 1fr);
      }
      aside {
        border-right: 1px solid var(--line);
        overflow: auto;
        padding: 0.6rem;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        min-width: 0;
      }
      .list-chrome {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        flex: 0 0 auto;
        position: sticky;
        top: 0;
        z-index: 2;
        padding-bottom: 0.45rem;
        margin-bottom: 0.2rem;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }
      .list-actions {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 0.35rem;
        width: 100%;
        align-items: stretch;
      }
      .list-actions > button {
        width: 100%;
        min-width: 0;
        min-height: 32px;
        margin: 0;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: lowercase;
      }
      .list-actions > .list-collapse {
        width: 32px;
        min-width: 32px;
        padding: 0;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0;
        color: var(--muted);
        border-color: var(--line-strong);
      }
      .list-actions > .list-collapse:hover:not(:disabled) {
        color: var(--ink);
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .list-rail {
        display: none;
        align-items: center;
        justify-content: center;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        min-width: 32px;
        min-height: 32px;
        padding: 0.75rem 0.2rem;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: lowercase;
        border-radius: 0;
        border-top: none;
        border-bottom: none;
        border-left: none;
        color: var(--muted);
      }
      main.list-collapsed {
        grid-template-columns: auto minmax(0, 1fr);
      }
      main.list-collapsed .list-rail {
        display: inline-flex;
      }
      main.list-collapsed #list {
        display: none !important;
      }
      .list-rail:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      aside .row {
        width: 100%;
        text-align: left;
        padding: 0.45rem 0.6rem;
        border-radius: var(--radius);
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        gap: 0.5rem;
        align-items: center;
        border: 1px solid transparent;
      }
      aside .row:hover {
        background: var(--accent-soft);
        border-color: var(--line);
      }
      aside .row.on {
        background: var(--accent);
        color: var(--fill-ink);
        border-color: var(--accent);
      }
      aside .row.on .badge {
        color: var(--fill-ink);
        opacity: 0.8;
      }
      aside .row.bad > span:first-child {
        color: var(--red);
      }
      .badge {
        font-size: 11px;
        color: var(--muted);
      }
      .flags,
      .chip {
        font-size: 11px;
        color: var(--n-use);
      }
      .flags {
        margin: 0.35rem 0 0.6rem;
      }
      .chip {
        white-space: nowrap;
        max-width: 16rem;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .flags.warn,
      .chip.warn {
        padding: 0.2rem 0.5rem;
        border: 1px solid color-mix(in srgb, var(--n-use) 40%, var(--line));
        border-radius: var(--radius);
        background: color-mix(in srgb, var(--n-use) 12%, transparent);
      }
      .flags.warn {
        padding: 0.4rem 0.55rem;
      }
      .row-meta {
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
        min-width: 0;
      }
      .row-meta .sub {
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      aside .row.on .row-meta .sub {
        color: var(--fill-ink);
        opacity: 0.85;
      }

      section {
        display: flex;
        flex-direction: column;
        padding: 1rem 1.2rem;
        gap: 0.7rem;
        overflow: auto;
      }
      .bar {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .bar-spacer {
        flex: 1 1 auto;
        min-width: 0.5rem;
      }
      .bar > input {
        flex: 1 1 8rem;
        max-width: 22rem;
        min-width: 0;
      }
      .bar .cap {
        font-size: 11px;
        color: var(--muted);
        text-transform: lowercase;
        letter-spacing: 0.06em;
        font-weight: 600;
      }
      .menu {
        position: relative;
        display: inline-flex;
      }
      .menu-pop {
        position: absolute;
        top: calc(100% + 0.25rem);
        right: 0;
        z-index: 6;
        min-width: 10rem;
        max-width: min(18rem, calc(100vw - 1.5rem));
        padding: 0.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
        background: var(--pop-bg);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: 0 6px 20px var(--scrim);
      }
      .menu-pop[hidden] {
        display: none;
      }
      .menu-pop button {
        min-height: 32px;
        justify-content: flex-start;
        text-align: left;
        border-color: transparent;
        color: var(--ink-soft);
        background: transparent;
      }
      .menu-pop button:hover:not(:disabled),
      .menu-pop button:focus-visible {
        background: var(--pop-sel);
        border-color: transparent;
        color: var(--ink);
      }
      .menu-pop button:active {
        background: var(--pop-sel);
      }
      @media (min-width: 721px) {
        .menu-pop .hist-item {
          display: none;
        }
      }
      textarea {
        flex: 1;
        min-height: 55vh;
        font: inherit;
        padding: 0.8rem 1rem;
        border: 1px solid var(--term-border);
        border-radius: var(--radius);
        background: var(--term-bg);
        color: var(--term-text);
        resize: vertical;
        line-height: 1.7;
      }
      .status {
        min-height: 1.4rem;
        white-space: pre-wrap;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .status:empty {
        display: none;
      }
      .status.bad {
        color: var(--red);
      }
      .status.ok {
        color: var(--green);
      }
      .status.jump {
        cursor: pointer;
        text-decoration: underline dotted;
      }
      code {
        background: var(--term-bg);
        border: 1px solid var(--term-border);
        padding: 0.12rem 0.4rem;
        border-radius: var(--radius-sm);
        color: var(--accent);
      }
      .hint {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .hide {
        display: none !important;
      }

      .toast {
        position: fixed;
        right: 1.1rem;
        bottom: 1.1rem;
        z-index: 50;
        padding: 0.55rem 0.9rem;
        border-radius: var(--radius);
        background: var(--toast-bg);
        border: 1px solid var(--line-strong);
        box-shadow: 0 6px 20px var(--scrim);
        font-size: 0.85rem;
      }
      .toast.ok {
        border-color: var(--green);
        color: var(--green);
      }
      .toast.bad {
        border-color: var(--red);
        color: var(--red);
      }

      /* yaml editor: highlighted <pre> under a transparent-text textarea; metrics must match exactly */
      .ed {
        position: relative;
        flex: 1;
        min-height: 55vh;
      }
      .ed .hl,
      .ed textarea {
        position: absolute;
        inset: 0;
        margin: 0;
        font: inherit;
        font-family: var(--mono);
        font-size: 14px;
        line-height: 1.7;
        letter-spacing: normal;
        tab-size: 2;
        padding: 0.8rem 1rem;
        border: 1px solid var(--term-border);
        border-radius: var(--radius);
        white-space: pre-wrap;
        overflow-wrap: break-word;
        overflow-y: scroll;
        overflow-x: hidden;
      }
      .ed .hl {
        border-color: transparent;
        background: var(--term-bg);
        color: var(--term-text);
        pointer-events: none;
      }
      .ed .hl::-webkit-scrollbar-thumb {
        background: transparent;
      }
      .ed .hl.mirror {
        visibility: hidden;
      }
      .ed textarea {
        resize: none;
        background: transparent;
        color: transparent;
        caret-color: var(--caret);
      }
      .tok-key {
        color: var(--tok-key);
      }
      .tok-verb {
        color: var(--tok-verb);
        font-weight: 600;
      }
      .tok-str {
        color: var(--tok-str);
      }
      .tok-num {
        color: var(--tok-num);
      }
      .tok-com {
        color: var(--tok-com);
        font-style: italic;
      }
      .tok-blk {
        color: var(--tok-blk);
      }
      .tok-ph {
        color: var(--tok-ph);
      }
      .tok-pun {
        color: var(--tok-pun);
      }

      .ac {
        position: absolute;
        z-index: 6;
        min-width: 12rem;
        max-width: 22rem;
        max-height: 12rem;
        overflow: auto;
        background: var(--pop-bg);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        box-shadow: 0 6px 20px var(--scrim);
        font-size: 0.85rem;
      }
      .ac div {
        padding: 0.2rem 0.6rem;
        cursor: pointer;
        white-space: nowrap;
      }
      .ac div.on {
        background: var(--pop-sel);
        color: var(--accent);
      }

      .seg {
        display: inline-flex;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .seg button {
        border: 0;
        border-radius: 0;
        padding: 0.4rem 0.8rem;
      }
      .seg button.on {
        background: var(--accent);
        color: var(--fill-ink);
      }
      .seg button.on:hover {
        background: var(--fill);
      }
      /* canvas */
      .canvas {
        position: relative;
        flex: 1 1 auto;
        min-height: 22rem;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background-color: var(--canvas-bg);
        background-image: radial-gradient(var(--canvas-dot) 1px, transparent 1px);
        touch-action: none;
        cursor: grab;
      }
      .canvas.expanded {
        position: fixed;
        inset: 0;
        z-index: 40;
        height: auto;
        min-height: 0;
        border-radius: 0;
        border: none;
      }
      body.canvas-expanded {
        overflow: hidden;
      }
      .canvas:focus {
        outline: none;
      }
      .canvas:focus-visible {
        outline-offset: -2px;
      }
      .canvas.panning {
        cursor: grabbing;
      }
      .canvas .edges {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      .canvas .edges path {
        fill: none;
        stroke: var(--edge);
        stroke-width: 2.5;
      }
      .canvas .layer {
        position: absolute;
        inset: 0;
        transform-origin: 0 0;
        pointer-events: none;
      }
      .canvas .layer > * {
        pointer-events: auto;
      }
      .canvas .empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 0.6rem;
        pointer-events: none;
        text-align: center;
      }
      .canvas .empty p {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .canvas .empty button {
        pointer-events: auto;
        background: var(--bg-elevated);
      }

      .node {
        position: absolute;
        width: 96px;
        height: 96px;
        border-radius: 8px;
        border: 1px solid var(--node-border);
        background: var(--node-surface);
        box-shadow: var(--node-shadow);
        display: grid;
        place-items: center;
        cursor: grab;

  <body>
    <header>
      <h1>herdr<span>-workflows</span></h1>
      <nav class="tabs">
        <button class="tab on" data-tab="workflows">Workflows</button>
        <button class="tab" data-tab="config">Config</button>
        <button class="tab" data-tab="runs">Runs</button>
      </nav>
      <button type="button" class="theme" id="theme-btn" aria-label="Theme: system">system</button>
      <span id="repo" class="repo"></span>
    </header>
    <main>
      <button
        type="button"
        class="list-rail"
        id="list-rail"
        aria-controls="list"
        aria-expanded="false"
        aria-pressed="true"
        aria-label="Show workflow list"
        hidden
      >
        show list
      </button>
      <aside id="list"></aside>
      <section id="pane"></section>
    </main>
    <div id="live" class="sr-live" aria-live="polite" aria-atomic="true"></div>
    <script>
      /**
       * Workbench page script — section map (approx. line ranges in this file):
       *   state / helpers       ~1570–2080  (globals, api, list/tabs, open/new)
       *   schema form engine    ~2080–2570  (step fields, encode/decode, summaries)
       *   canvas editor         ~2570–3725  (makeCanvas, NDV, pan/zoom, palette)
       *   YAML editor           ~3725–4610  (highlight, code editor, validate/sync)
       *   run inspector         ~1610–1690, ~4610–4935  (pure state + list/detail paint)
       *   import / share        ~4935–5280  (share payload, import preview/write)
       *   boot                  ~5280–end   (hash routes, live tick, theme, listeners)
       */
      const TOKEN = "__HWF_TOKEN__";
      const $ = (id) => document.getElementById(id);
      const THEME_KEY = "hwf-theme";
      const THEME_CYCLE = [null, "dark", "light"];
      let state = { entries: [], profiles: [], repoRoot: "" };
      let tab = "workflows";
      let current = null; // {name, scope}
      let configDirty = false;
      let editorDirty = false;
      let editorFileText = ""; // open workflow as last read from disk — live reload compares to it
      let editorMode = "text"; // desired mode, kept across live reloads
      let wantOpen = null; // {name, scope} from the URL hash; opened as soon as the file exists
      let routeView = null; // null | {kind:"share",scope,name} | {kind:"import"} | {kind:"new"} | {kind:"run",id,state}
      let listCollapsed = false;
      let runsLocation = "current";
      let runsQuery = "";
      let runsSelectedId = null;
      let runsNarrowPane = "list";
      let runsAbort = null;
      let runsSelectedStatusId = null;
      let runsSelectedStatus = null;

      function latest() {
        let gen = 0;
        return {
          begin() {
            return ++gen;
          },
          current(token) {
            return token === gen;
          },
          bump() {
            return ++gen;
          },
        };
      }
      const openWorkflowToken = latest();
      const runsPoll = latest();
      const runsRoute = latest();

      /* ---------- runs inspector pure state ---------- */
      function runRowFocusId(id) {
        return "run-row-" + String(id || "");
      }

      function runsBackFocusId() {
        return "runs-back";
      }

      function parseRunHash(hash) {
        if (!String(hash || "").startsWith("run=")) return { kind: "absent" };
        const id = String(hash).slice(4).trim().toLowerCase();
        const complete = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(id);
        return { kind: "run", id: id, complete: complete };
      }

      function seedSelectedStatus(id, status) {
        runsSelectedStatusId = id || null;
        runsSelectedStatus = status || null;
      }

      function terminalAnnouncement(id, nextStatus) {
        if (!id || !nextStatus) return null;
        if (nextStatus !== "succeeded" && nextStatus !== "failed" && nextStatus !== "interrupted") {
          return null;
        }
        if (runsSelectedStatusId !== id) {
          seedSelectedStatus(id, nextStatus);
          return null;
        }
        if (!runsSelectedStatus || runsSelectedStatus === nextStatus) {
          runsSelectedStatus = nextStatus;
          return null;
        }
        const prev = runsSelectedStatus;
        runsSelectedStatus = nextStatus;
        return prev;
      }

      /** Retain nonterminal observation; announce only after a known prior status. */
      function observeRunStatus(id, status) {
        if (!id || !status) return null;
        if (status === "running" || status === "stale") {
          seedSelectedStatus(id, status);
          return null;
        }
        return terminalAnnouncement(id, status);
      }

      function resolveFocusAfterPaint(savedFocusId, selectedId) {
        if (savedFocusId) return savedFocusId;
        if (selectedId) return runRowFocusId(selectedId);
        return null;
      }

      /** Invalidate an in-flight run deep link, then clear route state. */
      function exitRouteView(view) {
        if (view && view.kind === "run") runsRoute.bump();
        return null;
      }

      function resolveRunsListSelection(runs, selectedId, forceList, hasRouteView) {
        let next = selectedId;
        if (next && !runs.some((r) => r.id === next) && !hasRouteView) {
          next = runs[0] ? runs[0].id : null;
        }
        if (!next && runs[0] && !forceList) next = runs[0].id;
        return next || null;
      }

      /** Adopt list selection and seed status when the selected id changes or is unobserved. */
      function adoptRunsSelection(runs, selectedId, forceList, hasRouteView) {
        const next = resolveRunsListSelection(runs, selectedId, forceList, hasRouteView);
        if (next !== selectedId || (next && runsSelectedStatusId !== next)) {
          const row = next ? runs.find((r) => r.id === next) : null;
          seedSelectedStatus(next, row && row.status ? row.status : null);
        }
        return next;
      }
      /* ---------- end runs inspector pure state ---------- */

      function errMsg(e) {
        return (e && e.message) || String(e);
      }

      function narrowViewport() {
        return matchMedia("(max-width: 720px)").matches;
      }

      function esc(s) {
        return String(s == null ? "" : s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }

      // Lives on <body>, so it outlives the post-save re-render of the editor pane.
      function toast(msg, ok) {
        const t = document.createElement("div");
        t.className = "toast " + (ok ? "ok" : "bad");
        t.setAttribute("role", "status");
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2600);
      }

      async function api(path, opts) {
        const o = opts || {};
        o.headers = Object.assign({ "x-hwf-token": TOKEN }, o.headers || {});
        if (o.body) o.headers["content-type"] = "application/json";
        let res;
        try {
          res = await fetch(path, o);
        } catch (e) {
          return {
            status: 0,
            data: { ok: false, error: "cannot reach the server — " + errMsg(e) },
          };
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          data.ok = false;
          if (!data.error) data.error = "server returned " + res.status;
        }
        return { status: res.status, data };
      }

      function confirmLeave() {
        if (configDirty && !confirm("discard unsaved config changes?")) return false;
        if (editorDirty && !confirm("discard unsaved workflow changes?")) return false;
        configDirty = false;
        editorDirty = false;
        return true;
      }

      async function loadState() {
        const { status, data } = await api("/api/state");
        if (status !== 200 || data.error) {
          state = { entries: [], profiles: [], repoRoot: "" };
          const pane = $("pane");
          pane.innerHTML = "";
          const p = document.createElement("p");
          p.className = "status bad";
          p.textContent = "cannot reach the hwf server — reload to retry (" + data.error + ")";
          pane.appendChild(p);
          return;
        }
        state = Object.assign({ entries: [], profiles: [], repoRoot: "" }, data);
        await loadFormSources();
        $("repo").innerHTML = "repo <b>" + esc(state.repoRoot) + "</b>";
        render();
      }

      // The node form's field types come from the loader's own schema and the generated herdr
      // method table. Both are read-only and cached for the editor's lifetime.
      async function loadFormSources() {
        const [schema, methods] = await Promise.all([api("/api/schema"), api("/api/methods")]);
        if (schema.status === 200) state.schema = schema.data;
        if (methods.status === 200) {
          const table = {};
          for (const m of methods.data.methods || []) table[m.method] = m;
          state.methods = table;
        }
      }

      function clearRouteHash() {
        if (!/^#(share=|import|new|run=)/.test(location.hash)) return;
        history.replaceState(null, "", location.pathname + location.search);
      }

      function currentRouteHash() {
        if (tab === "runs" && runsSelectedId) {
          return "#run=" + runsSelectedId;
        }
        if (tab !== "workflows") return "";
        if (routeView) {
          if (routeView.kind === "import") return "#import";
          if (routeView.kind === "new") return "#new";
          if (routeView.kind === "share") return "#share=" + routeView.scope + ":" + routeView.name;
          if (routeView.kind === "run") return "#run=" + routeView.id;
        }
        if (current && current.name) return "#w=" + current.scope + ":" + current.name;
        return "";
      }

      function restoreRouteHash() {
        const want = currentRouteHash();
        if (location.hash === want) return;
        history.replaceState(null, "", location.pathname + location.search + want);
      }

      function syncListToggle() {
        const rail = $("list-rail");
        const hideBtn = $("list-hide");
        const usable = tab === "workflows" && !routeView;
        const showRail = usable && listCollapsed;
        if (rail) {
          rail.hidden = !showRail;
          rail.setAttribute("aria-expanded", listCollapsed ? "false" : "true");
          rail.setAttribute("aria-pressed", listCollapsed ? "true" : "false");
          rail.title = "Show workflow list";
        }
        if (hideBtn) {
          hideBtn.hidden = !usable || listCollapsed;
          hideBtn.setAttribute("aria-expanded", listCollapsed ? "false" : "true");
          hideBtn.setAttribute("aria-pressed", listCollapsed ? "true" : "false");
          hideBtn.title = "Hide workflow list";
        }
      }

      function syncWorkflowLayout() {
        const workflows = tab === "workflows" && !routeView;
        const showList = workflows && !listCollapsed;
        const main = document.querySelector("main");
        main.classList.toggle("full", !workflows);
        main.classList.toggle("list-collapsed", workflows && listCollapsed);
        $("list").classList.toggle("hide", !showList);
        syncListToggle();
      }

      function syncTabs() {
        document
          .querySelectorAll(".tab")
          .forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
      }

      function setListCollapsed(on) {
        listCollapsed = !!on;
        syncWorkflowLayout();
      }

      function render() {
        syncTabs();
        syncWorkflowLayout();
        if (routeView) return;
        if (tab === "workflows") return renderWorkflows();
        if (tab === "config") return renderConfig();
        return renderRuns();
      }

      function renderWorkflows() {
        syncWorkflowLayout();
        const list = $("list");
        list.innerHTML = "";
        const chrome = document.createElement("div");
        chrome.className = "list-chrome";
        const actions = document.createElement("div");
        actions.className = "list-actions";
        const nu = document.createElement("button");
        nu.type = "button";
        nu.textContent = "new";
        nu.setAttribute("aria-label", "New workflow");
        nu.onclick = newWorkflow;
        const imp = document.createElement("button");
        imp.type = "button";
        imp.textContent = "import";
        imp.setAttribute("aria-label", "Import workflows");
        imp.onclick = () => {
          if (confirmLeave()) openImport();
        };
        actions.append(nu, imp);
        const hide = document.createElement("button");
        hide.type = "button";
        hide.id = "list-hide";
        hide.className = "list-collapse";
        hide.textContent = "«";
        hide.setAttribute("aria-controls", "list");
        hide.setAttribute("aria-expanded", "true");
        hide.setAttribute("aria-pressed", "false");
        hide.setAttribute("aria-label", "Hide workflow list");
        hide.title = "Hide workflow list";
        hide.onclick = () => setListCollapsed(true);
        actions.append(hide);
        chrome.append(actions);
        list.appendChild(chrome);
        const addRow = (e) => {
          const row = document.createElement("button");
          row.type = "button";
          row.className =
            "row" + (!e.valid ? " bad" : "") + (current && current.name === e.name ? " on" : "");
          const meta = document.createElement("div");
          meta.className = "row-meta";
          const name = document.createElement("span");
          name.textContent = e.title || e.name;
          const sub = document.createElement("span");
          sub.className = "sub";
          const bits = [e.provenance || e.source];
          if (e.flags && e.flags.length) bits.push(e.flags.join(" · "));
          sub.textContent = bits.join(" · ");
          meta.append(name, sub);
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent =
            e.inRepo && e.inGlobal ? "repo + global" : e.source === "repo" ? "repo" : "global";
          row.append(meta, badge);
          row.onclick = () => {
            if (confirmLeave()) openWorkflow(e.name, e.source);
          };
          list.appendChild(row);
        };
        for (const e of state.entries) if (!e.hidden) addRow(e);
        const hidden = state.entries.filter((e) => e.hidden);
        if (hidden.length) {
          const head = document.createElement("p");
          head.className = "hint";
          head.textContent = "background — not shown in the picker";
          list.appendChild(head);

        if (state.entries.length === 0) {
          const empty = document.createElement("p");
          empty.className = "hint";
          empty.textContent = "no workflows yet — create or import above";
          list.appendChild(empty);
        }
        if (!current && !routeView)
          $("pane").innerHTML = "<p class=hint>Select a workflow, create one, or import.</p>";
        syncListToggle();
      }

      async function openWorkflow(name, scope) {
        const seq = openWorkflowToken.begin();
        routeView = exitRouteView(routeView);
        current = { name, scope };
        wantOpen = null;
        if (narrowViewport()) listCollapsed = true;
        setHash("w=" + scope + ":" + name);
        syncWorkflowLayout();
        renderWorkflows();
        const pane = $("pane");
        pane.innerHTML = "<p class=hint>loading…</p>";
        const r = await api("/api/workflow?name=" + encodeURIComponent(name) + "&scope=" + scope);
        if (!openWorkflowToken.current(seq)) return;
        // A stored file that fails to parse still opens: the text came back, the error is pinned.
        if (r.status !== 200) {
          pane.innerHTML = "";
          const p = document.createElement("p");
          p.className = "status bad";
          p.textContent = r.data.error || "could not load " + name;
          pane.appendChild(p);
          return;
        }
        renderEditor(
          name,
          scope,
          r.data.text || "",
          r.data.error || "",
          r.data.flags || [],
          r.data.base,
        );
      }

      function newWorkflow() {
        if (!confirmLeave()) return;
        openWorkflowToken.bump(); // cancel any in-flight openWorkflow
        routeView = exitRouteView(routeView);
        routeView = { kind: "new" };
        current = { name: "", scope: "repo" };
        setHash("new");
        if (narrowViewport()) listCollapsed = true;
        syncWorkflowLayout();
        renderWorkflows();
        const pointer = state.workflowSchemaUrl
          ? "# yaml-language-server: $schema=" + state.workflowSchemaUrl + "\n"
          : "";
        renderEditor(
          "",
          "repo",
          pointer + "version: v1alpha1\nsteps:\n  - run: [echo, hello]\n",
          "",
          [],
        );
      }

      // Readable step blocks appended at the end of the step list (the right slot for a linear runner).
      const SKELETONS = {
        run: "  - run: [echo, hello]\n",
        agent:
          "  - agent: |\n      review this\n    using: claude\n    pane:\n      open: beside\n",
        herdr: "  - herdr: notification.show\n    params: { title: done }\n",
        workflow: "  - workflow: child\n",
      };

      const VERBS = ["run", "agent", "herdr", "workflow"];

      // Mirrors the Zod schema in src/workflow/parse.ts.
      const TOP_KEYS = [
        "version",
        "title",
        "description",
        "hidden",
        "inputs",
        "returns",
        "on_failure",
        "steps",
      ];
      const STEP_KEYS = [
        "agent",
        "run",
        "herdr",
        "workflow",
        "id",
        "using",
        "target",
        "shell",
        "params",
        "inputs",
        "cwd",
        "env",
        "pane",
        "background",
        "ready_when",
        "timeout",
        "retry",
        "when",
        "continue_on_error",
      ];
      const CONTEXT_HINTS = [
        "context.workspace",
        "context.tab",
        "context.pane",
        "context.worktree",
        "context.agent",
        "context.selection",
        "context.platform",
        "context.transcript",
        "context.transcript_file",
        "steps.<id>.response",
        "steps.<id>.agent",
        "steps.<id>.pane_id",
        "steps.<id>.stdout",
        "steps.<id>.stderr",
        "steps.<id>.exit_code",
        "steps.<id>.failed",
      ];

      const NODE_TYPES = {
        run: {
          title: "Command",
          icon: ">_",
          tint: "var(--n-run)",
          desc: "Local argv or shell command with natural result",
        },
        agent: {
          title: "Managed agent",
          icon: "✦",
          tint: "var(--n-agent)",
          desc: "Native Herdr agent via profile or existing target",
        },
        herdr: {
          title: "Herdr",
          icon: "⌗",
          tint: "var(--n-prim)",
          desc: "Explicit herdr: method with params",
        },
        workflow: {
          title: "Child workflow",
          icon: "⊞",
          tint: "var(--n-use)",
          desc: "Invoke another workflow with isolated inputs",
        },
      };

      const SVGNS = "http://www.w3.org/2000/svg";
      const NODE_W = 96;
      const NODE_H = 96;
      const GAP_X = 240;

      function verbOf(step) {
        if (step.run !== undefined) return "run";
        if (step.agent !== undefined) return "agent";
        if (step.herdr !== undefined) return "herdr";
        if (step.workflow !== undefined) return "workflow";
        return "run";
      }

      /* ---------- node form field model (pure) ---------- */

      const SECTIONS = [
        { id: "does", title: "what it does" },
        { id: "where", title: "where it runs" },
        { id: "when", title: "when it runs" },
        { id: "fails", title: "if it fails" },
        { id: "other", title: "other keys" },
      ];

      // Words and placement only. Types, bounds, and enumerations come from the served schema,
      // so this table cannot contradict it, and a key missing here still renders.
      const FIELD_INFO = {
        run: {
          label: "command",
          help: "one command line, or argv one token per line",
          group: "does",
          order: 1,
        },
        shell: { label: "shell", help: "command-line form only", group: "does", order: 2 },
        agent: { label: "prompt", group: "does", order: 1 },
        herdr: { label: "method", group: "does", order: 1 },
        params: { label: "params", group: "does", order: 2 },
        workflow: { label: "workflow", group: "does", order: 1 },
        inputs: { label: "inputs", group: "does", order: 2 },
        using: { label: "profile", help: "starts a new agent", group: "where", order: 1 },
        target: {
          label: "target agent",
          help: "prompts an agent that already runs",
          group: "where",
          order: 2,
        },
        cwd: { label: "working directory", group: "where", order: 3 },
        env: { label: "environment", group: "where", order: 4 },
        "pane.open": { label: "open pane", group: "where", order: 5 },
        "pane.target": { label: "split anchor", group: "where", order: 6 },
        "pane.workspace": { label: "workspace", group: "where", order: 7 },
        "pane.size": { label: "pane size %", group: "where", order: 8 },
        "pane.focus": { label: "focus the new pane", group: "where", order: 9 },
        "pane.close": { label: "close the pane", group: "where", order: 10 },
        when: {
          label: "condition",
          help: "one clause, or a list of clauses that all must hold",
          group: "when",
          order: 1,
        },
        background: { label: "run in the background", group: "when", order: 2 },
        ready_when: {
          label: "ready when",
          help: "regex the pane output must match",
          group: "when",
          order: 3,
        },
        timeout: { label: "timeout", group: "fails", order: 1 },
        "retry.attempts": { label: "attempts", group: "fails", order: 2 },
        "retry.delay": { label: "delay between attempts", group: "fails", order: 3 },
        success_codes: {
          label: "exit codes that count as success",
          help: "one code per line",
          group: "fails",
          order: 4,
        },
        continue_on_error: { label: "continue on error", group: "fails", order: 5 },
      };

      // The only per-verb knowledge left: which payload keys belong to which action.
      const PAYLOAD_KEYS = {
        run: ["run", "shell"],
        agent: ["agent", "using", "target"],
        herdr: ["herdr", "params"],
        workflow: ["workflow", "inputs"],
      };
      const ANY_PAYLOAD_KEY = [
        "run",
        "shell",
        "agent",
        "using",
        "target",
        "herdr",
        "params",
        "workflow",
        "inputs",
      ];
      const MODE_SUFFIX = "::mode";

      function widgetFor(node) {
        if (!node || typeof node !== "object") return { kind: "json" };
        if (Array.isArray(node.enum)) return { kind: "enum", options: node.enum.map(String) };
        if (Array.isArray(node.anyOf)) return anyOfWidget(node.anyOf);
        if (node.type === "boolean") return { kind: "check" };
        if (node.type === "integer" || node.type === "number")
          return {
            kind: "number",
            min: node.minimum,
            max: node.maximum,
            integer: node.type === "integer",
          };
        if (node.type === "array") return { kind: "list", item: widgetFor(node.items) };
        if (node.type === "object") {
          if (node.properties && Object.keys(node.properties).length)
            return { kind: "group", properties: node.properties };
          const values = node.additionalProperties;
          if (values && values.type === "string") return { kind: "map" };
          return { kind: "json" };
        }
        if (node.type === "string") return { kind: "text" };
        return { kind: "json" };
      }

      // A branch set that only adds a template pattern to an enumeration keeps the enumeration
      // and stays typeable, so a whole-value template is still an option.
      function anyOfWidget(branches) {
        const kinds = branches.map(widgetFor);
        const enumerated = kinds.find((k) => k.kind === "enum");
        if (enumerated && kinds.every((k) => k.kind === "enum" || k.kind === "text"))
          return { kind: "enumText", options: enumerated.options };
        const text = kinds.find((k) => k.kind === "text");
        const list = kinds.find((k) => k.kind === "list");
        if (text && list) return { kind: "textOrList", item: list.item };
        return kinds[0] || { kind: "json" };
      }

      function fieldInfo(key) {
        return FIELD_INFO[key] || { label: key, group: "other", order: 0 };
      }

      function pushFields(out, key, node) {
        const widget = key === "params" ? { kind: "params" } : widgetFor(node);
        if (widget.kind === "group") {
          for (const child of Object.keys(widget.properties))
            pushFields(out, key + "." + child, widget.properties[child]);
          return;
        }
        const info = fieldInfo(key);
        out.push({
          key,
          widget,
          label: info.label,
          help: info.help || "",
          group: info.group,
          order: info.order,
        });
      }

      // Every schema key renders for every verb except another action's payload keys.
      // The loader judges the combination; this form never anticipates a rule.
      function stepFields(props, verb) {
        const mine = PAYLOAD_KEYS[verb] || [];
        const out = [];
        for (const key of Object.keys(props || {})) {
          if (key === "id") continue;
          if (ANY_PAYLOAD_KEY.includes(key) && !mine.includes(key)) continue;
          pushFields(out, key, props[key]);
        }
        const rank = (f) => SECTIONS.findIndex((s) => s.id === f.group);
        return out.sort(
          (a, b) => rank(a) - rank(b) || a.order - b.order || a.key.localeCompare(b.key),
        );
      }

      function valueAt(obj, key) {
        let cur = obj;
        for (const part of key.split(".")) {
          if (!cur || typeof cur !== "object") return undefined;
          cur = cur[part];
        }
        return cur;
      }

      function setAt(obj, key, value) {
        const parts = key.split(".");
        let cur = obj;
        while (parts.length > 1) {
          const part = parts.shift();
          if (!cur[part] || typeof cur[part] !== "object") cur[part] = {};
          cur = cur[part];
        }
        cur[parts[0]] = value;
      }

      function listText(v) {
        if (!Array.isArray(v)) return v == null ? "" : String(v);
        return v.map((item) => (typeof item === "string" ? item : JSON.stringify(item))).join("\n");
      }

      function encodeValue(widget, v) {
        if (widget.kind === "check") return v === true;
        if (widget.kind === "map")
          return v && typeof v === "object"
            ? Object.keys(v).map((k) => ({ k, v: String(v[k]) }))
            : [];
        if (v === undefined || v === null) return "";
        if (widget.kind === "list" || widget.kind === "textOrList") return listText(v);
        if (widget.kind === "json") return typeof v === "object" ? JSON.stringify(v) : String(v);
        return typeof v === "string" ? v : JSON.stringify(v);
      }

      // One line per element. A string element keeps its own spacing, including an empty or
      // padded argument, so only the trailing line the editor leaves behind is dropped.
      function listValue(raw, item) {
        const scalar = item && (item.kind === "number" || item.kind === "json");
        const lines = String(raw ?? "").split("\n");
        if (lines.length && lines[lines.length - 1] === "") lines.pop();
        const kept = scalar
          ? lines.map((line) => line.trim()).filter((line) => line !== "")
          : lines;
        if (!kept.length) return undefined;
        return kept.map((line) => {
          if (item && item.kind === "number") return numberValue(line);
          if (item && item.kind === "json") {
            try {
              return JSON.parse(line);
            } catch (e) {
              return line;
            }
          }
          return line;
        });
      }

      // An element holding a newline has no one-line-per-element form, so the step keeps its own
      // value instead of being split into different elements.
      function rendersValue(widget, raw) {
        if (widget.kind !== "list" && widget.kind !== "textOrList") return true;
        if (!Array.isArray(raw)) return true;
        return !raw.some((item) => typeof item === "string" && item.indexOf("\n") >= 0);
      }

      // A value the schema cannot accept is passed through so the loader answers on the field,
      // instead of the form inventing its own message.
      function numberValue(raw) {
        const text = String(raw ?? "").trim();
        if (text === "") return undefined;
        const n = Number(text);
        return Number.isFinite(n) ? n : text;
      }

      function jsonValue(raw, label) {
        const text = String(raw ?? "").trim();
        if (text === "") return undefined;
        try {
          return JSON.parse(text);
        } catch (e) {
          throw new Error(label + " must be valid JSON");
        }
      }

      function decodeValue(widget, form, key, label) {
        const raw = form[key];
        if (widget.kind === "check") return raw === true ? true : undefined;
        if (widget.kind === "map") {
          const out = {};
          for (const row of Array.isArray(raw) ? raw : []) {
            const name = String(row.k ?? "").trim();
            if (name) out[name] = String(row.v ?? "");
          }
          return Object.keys(out).length ? out : undefined;
        }
        if (widget.kind === "list") return listValue(raw, widget.item);
        if (widget.kind === "textOrList")
          return form[key + MODE_SUFFIX] === "list"
            ? listValue(raw, widget.item)
            : trimmedValue(raw);
        if (widget.kind === "number") return numberValue(raw);
        if (widget.kind === "json") return jsonValue(raw, label);
        return trimmedValue(raw);
      }

      function trimmedValue(raw) {
        const text = String(raw ?? "");
        return text.trim() === "" ? undefined : text;
      }

      function methodSpec(methods, name) {
        const entry = methods ? methods[String(name ?? "")] : null;
        return entry && entry.params ? entry : null;
      }

      // A herdr parameter's own specification is the schema for that field.
      function paramNode(spec) {
        if (spec.enumValues && spec.enumValues.length)
          return { type: "string", enum: spec.enumValues.map(String) };
        const kind = (spec.kinds && spec.kinds[0]) || "string";
        if (kind === "boolean") return { type: "boolean" };
        if (kind === "integer" || kind === "number") return { type: kind };
        if (kind === "array") return { type: "array", items: {} };
        if (kind === "object") return {};
        return { type: "string" };
      }

      function paramFields(entry) {
        const props = (entry && entry.params && entry.params.properties) || {};
        const required = (entry && entry.params && entry.params.required) || [];
        return Object.keys(props)
          .sort((a, b) => required.indexOf(b) - required.indexOf(a) || a.localeCompare(b))
          .map((name) => ({
            key: "params." + name,
            name,
            required: required.includes(name),
            widget: widgetFor(paramNode(props[name])),
          }));
      }

      function paramsIntoForm(form, step, methods) {
        const params = step.params && typeof step.params === "object" ? step.params : {};
        const entry = methodSpec(methods, step.herdr);
        const rest = {};
        const named = new Set(paramFields(entry).map((f) => f.name));
        for (const f of paramFields(entry)) form[f.key] = encodeValue(f.widget, params[f.name]);
        for (const name of Object.keys(params)) if (!named.has(name)) rest[name] = params[name];
        form.params = Object.keys(rest).length ? JSON.stringify(rest) : "";
      }

      function paramsFromForm(form, methods) {
        const out = jsonValue(form.params, "params") || {};
        for (const f of paramFields(methodSpec(methods, form.herdr))) {
          const v = decodeValue(f.widget, form, f.key, f.name);
          if (v !== undefined) out[f.name] = v;
        }
        return Object.keys(out).length ? out : undefined;
      }

      function formFromStep(props, verb, step, methods) {
        const form = { id: typeof step.id === "string" ? step.id : "" };
        for (const f of stepFields(props, verb)) {
          if (f.widget.kind === "params") {
            paramsIntoForm(form, step, methods);
            continue;
          }
          const raw = valueAt(step, f.key);
          if (!rendersValue(f.widget, raw)) continue;
          form[f.key] = encodeValue(f.widget, raw);
          if (f.widget.kind === "textOrList")
            form[f.key + MODE_SUFFIX] = Array.isArray(raw) ? "list" : "text";
        }
        return form;
      }

      // Live form values → a raw step the /api/format endpoint judges. Nothing entered is
      // dropped: a group with an unset required key is still submitted, and the loader answers.
      function stepFromForm(props, verb, form, extra, methods) {
        const step = Object.assign({}, extra);
        try {
          for (const f of stepFields(props, verb)) {
            if (f.widget.kind === "params") {
              const params = paramsFromForm(form, methods);
              if (params) step.params = params;
              continue;
            }
            if (!(f.key in form)) continue; // a value the form left in YAML stays as it was
            let v = decodeValue(f.widget, form, f.key, f.label);
            if (v === undefined && f.key === verb)
              v = form[f.key + MODE_SUFFIX] === "list" ? [] : "";
            if (v === undefined) continue;
            setAt(step, f.key, v);
          }
        } catch (e) {
          return { error: (e && e.message) || String(e) };
        }
        const id = String(form.id ?? "").trim();
        if (id) step.id = id;
        return { step };
      }

      // Keys this form does not render: carried through untouched and reported as from YAML.
      function extraOf(props, verb, step) {
        const shown = new Set(["id"]);
        for (const f of stepFields(props, verb)) {
          if (!rendersValue(f.widget, valueAt(step, f.key))) continue;
          shown.add(f.key.split(".")[0]);
        }
        const extra = {};
        for (const key of Object.keys(step)) if (!shown.has(key)) extra[key] = step[key];
        return extra;
      }

      function rowNames(rows) {
        return (Array.isArray(rows) ? rows : [])
          .map((row) => String(row.k ?? "").trim())
          .filter((name) => name !== "");
      }

      function isFieldSet(widget, form, key) {
        if (widget.kind === "check") return form[key] === true;
        if (widget.kind === "map") return rowNames(form[key]).length > 0;
        if (widget.kind === "params")
          return Object.keys(form).some(
            (k) => k.indexOf("params") === 0 && String(form[k] ?? "").trim() !== "",
          );
        return String(form[key] ?? "").trim() !== "";
      }

      function sectionSummary(fields, form) {
        const bits = [];
        for (const f of fields) {
          if (!isFieldSet(f.widget, form, f.key)) continue;
          if (f.widget.kind === "check") {
            bits.push(f.label);
            continue;
          }
          if (f.widget.kind === "map") {
            bits.push(rowNames(form[f.key]).join(" "));
            continue;
          }
          const text = String(form[f.key] ?? "")
            .trim()
            .replace(/\s+/g, " ");
          if (f.widget.kind === "number") bits.push(f.label + " " + text);
          else bits.push(text.length > 0 && text.length <= 24 ? text : f.label);
        }
        return bits;
      }

      // ["steps", 2, "retry", "attempts"] → step 2, field "retry.attempts". A path that names
      // no step, or an item inside a field's value, addresses the step alone.
      function issueField(path) {
        if (!Array.isArray(path) || path[0] !== "steps" || typeof path[1] !== "number") return null;
        const keys = [];
        for (const part of path.slice(2)) {
          if (typeof part !== "string") break;
          keys.push(part);
        }
        return { index: path[1], key: keys.join(".") };
      }

      // A loader path and a form key need not agree on depth: "retry" addresses the fields the
      // group renders, and "env.LANG" addresses the field that holds the whole mapping.
      function addressesField(issueKey, fieldKey) {
        if (!issueKey || !fieldKey) return false;
        return (
          issueKey === fieldKey ||
          fieldKey.indexOf(issueKey + ".") === 0 ||
          issueKey.indexOf(fieldKey + ".") === 0
        );
      }

      /* ---------- end node form field model ---------- */

      // The two generated sources the field model reads, as the page caches them.
      function stepSchemaProps() {
        const steps = state.schema && state.schema.properties && state.schema.properties.steps;
        const items = steps && steps.items;
        return (items && items.properties) || {};
      }

      function methodTable() {
        return state.methods || {};
      }

      // Domain values the schema cannot know, offered as suggestions and never as a closed list.
      const SUGGESTIONS = {
        using: () => state.profiles || [],
        workflow: () => (state.entries || []).map((e) => e.name),
      };

      let dlSeq = 0;

      function seedStep(verb) {
        if (verb === "herdr") return { herdr: "notification.show", params: { title: "done" } };
        if (verb === "agent")
          return {
            agent: "review this",
            using: state.profiles[0] || "claude",
            pane: { open: "beside" },
          };
        if (verb === "workflow") return { workflow: "" };
        return { run: ["echo", "hello"] };
      }

      function nodeSummary(verb, form) {
        if (verb === "run") return form.run || "no command";
        if (verb === "agent") return form.using || form.target || form.agent || "no profile";
        if (verb === "workflow") return form.workflow || "no workflow";
        return form.herdr || "herdr";
      }

      function nodeTitle(verb, form) {
        return form.id || NODE_TYPES[verb].title;
      }

      function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
      }

      // n8n-style canvas: pan/zoom surface, one box per step, execution order = left-to-right.
      function makeCanvas(root, onChange, triggerLabel) {
        const svg = document.createElementNS(SVGNS, "svg");
        svg.setAttribute("class", "edges");
        const g = document.createElementNS(SVGNS, "g");
        svg.appendChild(g);
        const layer = document.createElement("div");
        layer.className = "layer";
        root.append(svg, layer);
        root.tabIndex = 0;

        let nodes = [];
        let view = { x: 60, y: 90, z: 1 };
        let selected = null;
        let palette = null;
        let ndv = null;
        let issues = [];
        const undos = [];
        const redos = [];
        let expanded = false;
        let expandBtn = null;
        let zoomPct = null;
        let onHistory = null;

        const trigger = document.createElement("div");
        trigger.className = "node trigger";
        trigger.style.setProperty("--tint", "var(--n-trigger)");
        trigger.innerHTML =
          '<span class="icon">⚡</span><span class="port out"></span><span class="label"></span>';
        trigger.querySelector(".label").textContent = triggerLabel();
        layer.appendChild(trigger);

        const empty = document.createElement("div");
        empty.className = "empty hide";
        const emptyMsg = document.createElement("p");
        emptyMsg.textContent = "This workflow has no steps yet.";
        const emptyBtn = document.createElement("button");
        emptyBtn.textContent = "add your first step";
        emptyBtn.onclick = () => openPalette(null);
        empty.append(emptyMsg, emptyBtn);
        root.appendChild(empty);

        let tipBtn = null;
        const tip = document.createElement("span");
        tip.className = "tip";
        tip.hidden = true;
        tip.textContent =
          "drag to move · scroll to pan · ⌘/ctrl+scroll to zoom · ⌘/ctrl+Z undo · ⌘/ctrl+⇧Z redo · Enter opens a step";
        root.appendChild(tip);

        function setTipOpen(on) {
          tip.hidden = !on;
          if (tipBtn) tipBtn.setAttribute("aria-expanded", on ? "true" : "false");
        }

        function ordered() {
          return nodes.slice().sort((a, b) => a.x - b.x || a.y - b.y);
        }

        // A form holds rows and lists, so history keeps its own copy of every value.
        function snapshot() {
          return nodes.map((n) => ({
            verb: n.verb,
            form: JSON.parse(JSON.stringify(n.form)),
            extra: n.extra,
            x: n.x,
            y: n.y,
          }));
        }

        function snap() {
          undos.push(snapshot());
          if (undos.length > 40) undos.shift();
          redos.length = 0;
          if (onHistory) onHistory();
        }

        function setNodes(recs) {
          for (const n of nodes) n.el.remove();
          nodes = recs.map((r) => ({
            verb: r.verb,
            form: JSON.parse(JSON.stringify(r.form)),
            extra: r.extra,
            x: r.x,
            y: r.y,
          }));
          issues = [];
          for (const n of nodes) makeNodeEl(n);
          selected = null;
        }

        // Loader issues, addressed to the field each one names. No rule is restated here:
        // the message, the path, and the decision all come from the loader.
        function setIssues(list) {
          issues = [];
          const rest = [];
          const seq = ordered();
          for (const it of list || []) {
            const at = issueField(it.path);
            const node = at ? seq[at.index] : null;
            if (!node) {
              rest.push(it.message);
              continue;
            }
            issues.push({ node, key: at.key, message: it.message });
            if (!addressedByForm(node, at.key)) rest.push(it.message);
          }
          paintIssues();
          return { count: issues.length, rest };
        }

        // An issue no rendered field can carry still has to reach the author, so it stays in the
        // status area as well as on the step.
        function addressedByForm(node, key) {
          if (!key) return false;
          return stepFields(stepSchemaProps(), node.verb).some((f) => addressesField(key, f.key));
        }

        function issuesFor(node) {
          return issues.filter((i) => i.node === node);
        }

        function paintIssues() {
          for (const n of nodes) {
            const mine = issuesFor(n);
            const warn = n.el.querySelector(".warn");
            warn.classList.toggle("hide", mine.length === 0);
            warn.title = mine.map((i) => i.message).join("; ");
            n.el.classList.toggle("bad", mine.length > 0);
          }
          if (ndv) paintNdvIssues();
        }

        function paintNdvIssues() {
          const mine = issuesFor(ndv.node);
          for (const key of Object.keys(ndv.fields)) {
            const field = ndv.fields[key];
            const hit = mine.filter((i) => addressesField(i.key, key)).map((i) => i.message);
            field.err.textContent = hit.join("; ");
            field.err.classList.toggle("hide", hit.length === 0);
            field.wrap.classList.toggle("bad", hit.length > 0);
          }
          for (const id of Object.keys(ndv.sections)) {
            const sec = ndv.sections[id];
            const bad = sec.fields.some((f) => mine.some((i) => addressesField(i.key, f.key)));
            sec.head.classList.toggle("bad", bad);
            if (bad) sec.open(true);
          }
        }

        function undo() {
          const prev = undos.pop();
          if (!prev) return;
          redos.push(snapshot());
          setNodes(prev);
          draw();
          onChange();
          if (onHistory) onHistory();
        }

        function redo() {
          const next = redos.pop();
          if (!next) return;
          undos.push(snapshot());
          if (undos.length > 40) undos.shift();
          setNodes(next);
          draw();
          onChange();
          if (onHistory) onHistory();
        }

        function applyView() {
          const t = "translate(" + view.x + "px," + view.y + "px) scale(" + view.z + ")";
          layer.style.transform = t;
          g.setAttribute(
            "transform",
            "translate(" + view.x + "," + view.y + ") scale(" + view.z + ")",
          );
          root.style.backgroundSize = 20 * view.z + "px " + 20 * view.z + "px";
          root.style.backgroundPosition = view.x + "px " + view.y + "px";
          if (zoomPct) zoomPct.textContent = Math.round(view.z * 100) + "%";
        }

        // Counter-scale so the 20px hit target stays clickable when the canvas is zoomed out.
        function plusScale() {
          return "translate(-50%,-50%) scale(" + Math.max(1, 1 / view.z) + ")";
        }

        function rescalePlus() {
          const t = plusScale();
          layer.querySelectorAll(".plus").forEach((b) => (b.style.transform = t));
        }

        function edge(x1, y1, x2, y2) {
          const d = Math.max(50, (x2 - x1) / 2);
          const p = document.createElementNS(SVGNS, "path");
          p.setAttribute(
            "d",
            "M " +
              x1 +
              " " +
              y1 +
              " C " +
              (x1 + d) +
              " " +
              y1 +
              ", " +
              (x2 - d) +
              " " +
              y2 +
              ", " +
              x2 +
              " " +
              y2,
          );
          g.appendChild(p);
        }

        // `before` is the node the new step lands in front of (null = append), re-resolved on click.
        function plusAt(x, y, before) {
          const b = document.createElement("button");
          b.className = "plus";
          b.textContent = "+";
          b.title = "add a step here";
          b.style.left = x + "px";
          b.style.top = y + "px";
          b.style.transform = plusScale();
          b.onclick = (e) => {
            e.stopPropagation();
            openPalette(before);
          };
          layer.appendChild(b);
        }

        function place() {
          ordered().forEach((n, i) => {
            n.el.style.left = n.x + "px";
            n.el.style.top = n.y + "px";
            n.el.classList.toggle("sel", selected === n);
            n.el.querySelector(".num").textContent = i + 1;
          });
        }

        function draw() {
          place();
          g.innerHTML = "";
          layer.querySelectorAll(".plus").forEach((el) => el.remove());
          const seq = ordered();
          empty.classList.toggle("hide", seq.length > 0);
          let px = NODE_W;
          let py = NODE_H / 2;
          seq.forEach((n) => {
            const cy = n.y + NODE_H / 2;
            edge(px, py, n.x, cy);
            plusAt((px + n.x) / 2, (py + cy) / 2, n);
            px = n.x + NODE_W;
            py = cy;
          });
          edge(px, py, px + 56, py);
          plusAt(px + 66, py, null);
        }

        function relabel(n) {
          const label = n.el.querySelector(".label");
          const title = nodeTitle(n.verb, n.form);
          const summary = nodeSummary(n.verb, n.form);
          label.textContent = title;
          const sub = document.createElement("small");
          sub.textContent = summary;
          label.appendChild(sub);
          const keys = Object.keys(n.extra);
          const ext = n.el.querySelector(".ext");
          ext.classList.toggle("hide", keys.length === 0);
          ext.title = keys.length
            ? "kept from YAML, not shown in this form: " + keys.join(", ")
            : "";
          n.el.setAttribute("aria-label", "step " + title + " — " + summary);
        }

        function makeNodeEl(n) {
          const el = document.createElement("div");
          el.className = "node";
          el.tabIndex = 0;
          el.setAttribute("role", "button");
          el.style.setProperty("--tint", NODE_TYPES[n.verb].tint);
          el.innerHTML =
            '<span class="icon"></span><span class="num"></span><span class="ext hide">⚙</span>' +
            '<span class="warn hide">!</span>' +
            '<span class="port in"></span><span class="port out"></span>' +
            '<span class="label"></span><span class="tools"></span>';
          el.querySelector(".icon").textContent = NODE_TYPES[n.verb].icon;
          const del = document.createElement("button");
          del.textContent = "✕";
          del.title = "delete step";
          del.onclick = (e) => {
            e.stopPropagation();
            remove(n);
          };
          el.querySelector(".tools").appendChild(del);
          el.ondblclick = (e) => {
            e.stopPropagation();
            openNdv(n);
          };
          wireNodeDrag(n, el);
          wireNodeKeys(n, el);
          n.el = el;
          layer.appendChild(el);
          relabel(n);
          return el;
        }

        function wireNodeKeys(n, el) {
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              selected = n;
              openNdv(n);
              return;
            }
            const step = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
            if (!step) return;
            e.preventDefault();
            const seq = ordered();
            const next = seq[clamp(seq.indexOf(n) + step, 0, seq.length - 1)];
            if (!next) return;
            selected = next;
            place();
            next.el.focus();
          });
        }

        function wireNodeDrag(n, el) {
          let start = null;
          el.addEventListener("pointerdown", (e) => {
            if (e.button !== 0 || e.target.closest(".tools")) return;
            e.stopPropagation();
            el.setPointerCapture(e.pointerId);
            start = { px: e.clientX, py: e.clientY, x: n.x, y: n.y, moved: false };
            selected = n;
            el.focus();
            place();
          });
          el.addEventListener("pointermove", (e) => {
            if (!start) return;
            const dx = (e.clientX - start.px) / view.z;
            const dy = (e.clientY - start.py) / view.z;
            if (!start.moved && Math.abs(dx) + Math.abs(dy) > 3) {
              start.moved = true;
              snap();
            }
            n.x = start.x + dx;
            n.y = start.y + dy;
            place();
          });
          const end = () => {
            if (!start) return;
            // Snap back to lanes so the x order that defines execution order is unambiguous.
            if (start.moved) {
              ordered().forEach((m, i) => {
                m.x = GAP_X * (i + 1);
              });
            }
            draw();
            if (start.moved) onChange();
            start = null;
          };
          el.addEventListener("pointerup", end);
          el.addEventListener("pointercancel", end);
        }

        function remove(n) {
          snap();
          n.el.remove();
          nodes = nodes.filter((x) => x !== n);
          if (selected === n) selected = null;
          draw();
          onChange();
        }

        // Slot a new node into the gap before `index`, shifting the tail right when there is no room.
        function placeAt(index) {
          const seq = ordered();
          if (index >= seq.length) {
            const last = seq[seq.length - 1];
            return last ? { x: last.x + GAP_X, y: last.y } : { x: GAP_X, y: 0 };
          }
          const next = seq[index];
          const prev = index > 0 ? seq[index - 1] : null;
          const prevX = prev ? prev.x : 0;
          if (next.x - prevX >= GAP_X * 1.6)
            return { x: (prevX + next.x) / 2, y: prev ? prev.y : next.y };
          for (const n of seq.slice(index)) n.x += GAP_X;
          return { x: prevX + GAP_X, y: next.y };
        }

        function add(verb, index, pos) {
          snap();
          const at = pos || placeAt(index == null ? nodes.length : index);
          const form = formFromStep(stepSchemaProps(), verb, seedStep(verb), methodTable());
          const n = { verb, form, extra: {}, x: at.x, y: at.y };
          nodes.push(n);
          makeNodeEl(n);
          selected = n;
          draw();
          openNdv(n, { skipSnap: true }); // the sync fires when the modal closes, so a blank step never flashes an error
        }

        function slotOf(before) {
          if (!before) return nodes.length;
          const i = ordered().indexOf(before);
          return i < 0 ? nodes.length : i;
        }

        function openPalette(before) {
          closePalette();
          palette = document.createElement("div");
          palette.className = "palette";
          const head = document.createElement("h3");
          head.textContent = "add a step — click, or drag onto the canvas";
          palette.appendChild(head);
          for (const verb of VERBS) {
            const t = NODE_TYPES[verb];
            const item = document.createElement("button");
            item.className = "item";
            item.draggable = true;
            item.style.setProperty("--tint", t.tint);
            const icon = document.createElement("span");
            icon.className = "icon";
            icon.textContent = t.icon;
            const title = document.createElement("span");
            title.textContent = t.title;
            const desc = document.createElement("small");
            desc.textContent = t.desc;
            item.append(icon, title, desc);
            item.ondragstart = (e) => e.dataTransfer.setData("text/plain", verb);
            item.onclick = () => {
              const index = slotOf(before);
              closePalette();
              add(verb, index);
            };
            palette.appendChild(item);
          }
          const close = document.createElement("button");
          close.textContent = "close";
          close.onclick = closePalette;
          palette.appendChild(close);
          root.appendChild(palette);
        }

        function closePalette() {
          if (palette) palette.remove();
          palette = null;
        }

        function toCanvas(clientX, clientY) {
          const r = root.getBoundingClientRect();
          return {
            x: (clientX - r.left - view.x) / view.z,
            y: (clientY - r.top - view.y) / view.z,
          };
        }

        root.addEventListener("dragover", (e) => e.preventDefault());
        root.addEventListener("drop", (e) => {
          e.preventDefault();
          const verb = e.dataTransfer.getData("text/plain");
          if (!NODE_TYPES[verb]) return;
          closePalette();
          const p = toCanvas(e.clientX, e.clientY);
          add(verb, null, { x: p.x - NODE_W / 2, y: p.y - NODE_H / 2 });
        });

        let pan = null;
        root.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          if (e.target.closest(".node, .plus, .palette, .zoombar, .viewbar, .ndv, .empty")) return;
          selected = null;
          place();
          pan = { px: e.clientX, py: e.clientY, x: view.x, y: view.y };
          root.classList.add("panning");
          root.setPointerCapture(e.pointerId);
        });
        root.addEventListener("pointermove", (e) => {
          if (!pan) return;
          view.x = pan.x + (e.clientX - pan.px);
          view.y = pan.y + (e.clientY - pan.py);
          applyView();
        });
        const endPan = () => {
          pan = null;
          root.classList.remove("panning");
        };
        root.addEventListener("pointerup", endPan);
        root.addEventListener("pointercancel", endPan);

        function bounds() {
          let minX = 0;
          let minY = 0;
          let maxX = NODE_W;
          let maxY = NODE_H;
          for (const n of nodes) {
            minX = Math.min(minX, n.x);
            minY = Math.min(minY, n.y);
            maxX = Math.max(maxX, n.x + NODE_W);
            maxY = Math.max(maxY, n.y + NODE_H);
          }
          return { minX, minY, maxX, maxY: maxY + 40 }; // node labels hang below the box
        }

        // Only swallow the wheel when there is off-screen content in that direction.
        function canPan(dx, dy) {
          const r = root.getBoundingClientRect();
          const b = bounds();

        if (loadError) showProblem(false, loadError);
        runValidate();
        if (editorMode === "visual") setMode("visual");
      }

      function mkScopeSelect(scope) {
        const sel = document.createElement("select");
        for (const s of ["repo", "global"]) {
          const o = document.createElement("option");
          o.value = s;
          o.textContent = s === "repo" ? "local" : "global";
          if (s === scope) o.selected = true;
          sel.appendChild(o);
        }
        return sel;
      }

      function mkBtn(label, fn) {
        const b = document.createElement("button");
        b.textContent = label;
        b.onclick = fn;
        return b;
      }

      function setStatus(el, ok, msg, jump) {
        el.textContent = msg || "";
        el.className = "status " + (ok === "info" ? "" : ok ? "ok" : "bad") + (jump ? " jump" : "");
        el.onclick = jump || null;
        el.title = jump ? "jump to the line" : "";
      }

      async function renderConfig() {
        $("list").classList.add("hide");
        const pane = $("pane");
        pane.innerHTML = "";
        const bar = document.createElement("div");
        bar.className = "bar";
        const scopeSel = mkScopeSelect("repo");
        let shownScope = scopeSel.value;
        let cfgSeq = 0;
        const ta = document.createElement("textarea");
        ta.setAttribute("aria-label", "config YAML");
        const status = document.createElement("div");
        status.className = "status";
        const save = mkBtn("save", async () => {
          const r = await api("/api/config", {
            method: "PUT",
            body: JSON.stringify({ scope: shownScope, text: ta.value }),
          });
          setStatus(status, !!r.data.ok, r.data.ok ? "saved" : r.data.error || "save failed");
          if (!r.data.ok) return;
          configDirty = false;
          toast("saved " + (shownScope === "repo" ? "local" : "global") + " config", true);
        });
        save.className = "primary";
        // Last-write-wins: a superseded load must not drop its text into a newer scope's buffer.
        const load = async () => {
          const seq = ++cfgSeq;
          const want = scopeSel.value;
          save.disabled = true;
          setStatus(status, "info", "loading…");
          const r = await api("/api/config?scope=" + want);
          if (seq !== cfgSeq || !ta.isConnected) return;
          save.disabled = false;
          if (r.status !== 200) {
            setStatus(status, false, r.data.error || "load failed");
            return;
          }
          ta.value = r.data.text || "";
          shownScope = want;
          configDirty = false;
          setStatus(status, "info", "");
        };
        scopeSel.onchange = () => {
          if (configDirty && !confirm("discard unsaved config changes?")) {
            scopeSel.value = shownScope;
            return;
          }
          load();
        };
        ta.oninput = () => {
          configDirty = true;
        };
        bar.append(scopeSel, save);
        pane.append(bar, ta, status);
        await load();
      }

      function fmtWhen(ts) {
        const d = new Date(ts);
        if (isNaN(d)) return ts;
        return d.toLocaleString(undefined, {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      async function renderRuns() {
        $("list").classList.add("hide");
        const pane = $("pane");
        pane.innerHTML = "<p class=hint>loading…</p>";
        const { data } = await api("/api/runs");
        const runs = data.runs || [];
        pane.innerHTML = "";
        if (!runs.length) {
          pane.innerHTML = "<p class=hint>no runs yet</p>";
          return;
        }
        const wrap = document.createElement("div");
        wrap.id = "runs-list";
        for (const r of runs) {
          const row = document.createElement("div");
          row.className = "run";
          const status = r.ok ? "ok" : "failed";
          row.innerHTML =
            '<span class="dot ' +
            (r.ok ? "ok" : "bad") +
            '"></span>' +
            '<span class="name">' +
            esc(r.workflow) +
            "</span>" +
            '<span class="' +
            (r.ok ? "hint" : "err") +
            '">' +
            esc(status) +
            "</span>" +
            (r.error ? '<span class="err">— ' + esc(r.error) + "</span>" : "") +
            '<span class="when">' +
            esc(fmtWhen(r.ts)) +
            "</span>";
          wrap.appendChild(row);
        }
        pane.appendChild(wrap);
      }

      document.querySelectorAll(".tab").forEach(
        (b) =>
          (b.onclick = () => {
            if (!confirmLeave()) return;
            tab = b.dataset.tab;
            if (tab === "workflows") current = null;
            render();
          }),
      );
      addEventListener("beforeunload", (e) => {
        if (!editorDirty && !configDirty) return;
        e.preventDefault();
        e.returnValue = "";
      });

      function setHash(h) {
        if (location.hash !== "#" + h) location.hash = h;
      }

      // #w=<scope>:<name> — a link straight to one workflow, so an agent can hand over a
      // single URL and then keep rewriting the file while the page follows along.
      function applyHash() {
        const m = /^#w=(repo|global):([a-z0-9][a-z0-9-_]*)$/.exec(location.hash);
        if (!m) return;
        const [, scope, name] = m;
        if (current && current.name === name && current.scope === scope) return;
        if (!confirmLeave()) return;
        tab = "workflows";
        const entry = state.entries.find((e) => e.name === name);
        if (entry) {
          const has = scope === "repo" ? entry.inRepo : entry.inGlobal;
          return openWorkflow(name, has ? scope : entry.source);
        }
        wantOpen = { name, scope }; // not written yet — liveTick opens it once it appears
        current = null;
        renderWorkflows();
        $("pane").innerHTML = "<p class=hint>waiting for " + esc(name) + "…</p>";
      }

      let liveSig = "";
      let liveBusy = false;

      // Poll disk so a workflow an agent is writing shows up (and redraws) without a reload.
      // Local edits win: a dirty buffer is never overwritten.
      async function liveTick() {
        if (liveBusy || document.hidden || tab !== "workflows" || editorDirty || configDirty)
          return;
        liveBusy = true;
        try {
          const s = await api("/api/state");
          if (s.status === 200 && !s.data.error) {
            const sig = JSON.stringify(s.data.entries || []);
            if (sig !== liveSig) {
              liveSig = sig;
              state = Object.assign(state, s.data);
              renderWorkflows();
              if (wantOpen) applyHash();
            }
          }
          if (!current || !current.name || editorDirty) return;
          const r = await api(
            "/api/workflow?name=" + encodeURIComponent(current.name) + "&scope=" + current.scope,
          );
          if (r.status !== 200 || editorDirty) return;
          const text = r.data.text || "";
          if (text === editorFileText) return;
          renderEditor(current.name, current.scope, text, r.data.error || "");
        } finally {
          liveBusy = false;
        }
      }

      addEventListener("hashchange", applyHash);
      setInterval(liveTick, 1500);
      loadState().then(applyHash);
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>herdr-workflows</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: rgb(44 50 60);
        --bg-elevated: rgb(52 58 70);
        --ink: rgb(236 239 244);
        --ink-soft: rgb(216 222 233);
        --muted: rgb(154 163 181);
        --line: rgb(61 68 82);
        --line-strong: rgb(76 86 106);
        --accent: rgb(233 226 118);
        --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
        --green: rgb(163 190 140);
        --red: rgb(201 131 138);
        --term-bg: rgb(35 40 49);
        --term-border: rgb(59 66 82);
        --term-text: rgb(216 222 233);
        --fill: var(--accent);
        --fill-ink: rgb(38 41 42);
        --canvas-bg: rgb(38 43 52);
        --canvas-dot: rgb(64 72 88);
        --edge: rgb(104 114 134);
        --scrim: rgb(24 27 33 / 72%);
        --n-trigger: rgb(180 142 173);
        --n-run: rgb(163 190 140);
        --n-agent: rgb(129 161 193);
        --n-use: rgb(235 203 139);
        --n-prim: rgb(143 188 187);
        --tok-key: var(--n-agent);
        --tok-verb: var(--accent);
        --tok-str: var(--green);
        --tok-num: var(--n-use);
        --tok-com: var(--muted);
        --tok-blk: var(--n-prim);
        --tok-ph: var(--n-trigger);
        --tok-pun: var(--muted);
        --caret: var(--accent);
        --pop-bg: var(--bg-elevated);
        --pop-sel: var(--accent-soft);
        --toast-bg: var(--bg-elevated);
        --num-bg: var(--line-strong);
        --radius: 4px;
        --radius-sm: 2px;
        --mono: "JetBrains Mono Variable", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--mono);
        font-size: 14px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      ::selection {
        background: color-mix(in srgb, var(--accent) 25%, transparent);
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--line-strong);
        border-radius: 6px;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 1ms !important;
          animation-duration: 1ms !important;
        }
      }

      header {
        display: flex;
        gap: 1.2rem;
        align-items: center;
        padding: 0.7rem 1.1rem;
        border-bottom: 1px solid var(--line);
        background: var(--bg-elevated);
      }
      header h1 {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      header h1 span {
        color: var(--muted);
        font-weight: 400;
      }
      header .tabs {
        display: flex;
        gap: 0.25rem;
        padding-left: 1.2rem;
        border-left: 1px solid var(--line-strong);
      }
      header .repo {
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
      }
      header .repo b {
        color: var(--ink-soft);
        font-weight: 600;
      }

      button,
      select,
      input {
        font: inherit;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        padding: 0.4rem 0.75rem;
        cursor: pointer;
        transition:
          background 120ms ease,
          border-color 120ms ease,
          color 120ms ease;
      }
      button:hover:not(:disabled),
      select:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      button:not(.plus):active {
        transform: translateY(1px);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--fill-ink);
        font-weight: 600;
      }
      button.primary:hover {
        background: var(--fill);
      }
      input {
        min-width: 9rem;
        cursor: text;
      }
      input[type="checkbox"] {
        min-width: 0;
        padding: 0;
        width: 1rem;
        height: 1rem;
        cursor: pointer;
        accent-color: var(--accent);
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        border-color: transparent;
      }

      .tab {
        font-weight: 600;
      }
      .tab.on {
        background: var(--accent);
        color: var(--fill-ink);
        border-color: var(--accent);
      }
      .tab.on:hover {
        background: var(--fill);
      }

      main {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        flex: 1;
        min-height: 0;
      }
      main.full {
        grid-template-columns: minmax(0, 1fr);
      }
      aside {
        border-right: 1px solid var(--line);
        overflow: auto;
        padding: 0.6rem;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
      aside .row {
        width: 100%;
        text-align: left;
        padding: 0.45rem 0.6rem;
        border-radius: var(--radius);
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        gap: 0.5rem;
        align-items: center;
        border: 1px solid transparent;
      }
      aside .row:hover {
        background: var(--accent-soft);
      }
      aside .row.on {
        background: var(--accent);
        color: var(--fill-ink);
      }
      aside .row.on .badge {
        color: var(--fill-ink);
        opacity: 0.8;
      }
      aside .row.bad > span:first-child {
        color: var(--red);
      }
      .badge {
        font-size: 11px;
        color: var(--muted);
      }

      section {
        display: flex;
        flex-direction: column;
        padding: 1rem 1.2rem;
        gap: 0.7rem;
        overflow: auto;
      }
      .bar {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .bar .cap {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      textarea {
        flex: 1;
        min-height: 55vh;
        font: inherit;
        padding: 0.8rem 1rem;
        border: 1px solid var(--term-border);
        border-radius: var(--radius);
        background: var(--term-bg);
        color: var(--term-text);
        resize: vertical;
        line-height: 1.7;
      }
      .status {
        min-height: 1.4rem;
        white-space: pre-wrap;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .status.bad {
        color: var(--red);
      }
      .status.ok {
        color: var(--green);
      }
      .status.jump {
        cursor: pointer;
        text-decoration: underline dotted;
      }
      code {
        background: var(--term-bg);
        border: 1px solid var(--term-border);
        padding: 0.12rem 0.4rem;
        border-radius: var(--radius-sm);
        color: var(--accent);
      }
      .hint {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .hide {
        display: none !important;
      }

      .toast {
        position: fixed;
        right: 1.1rem;
        bottom: 1.1rem;
        z-index: 50;
        padding: 0.55rem 0.9rem;
        border-radius: var(--radius);
        background: var(--toast-bg);
        border: 1px solid var(--line-strong);
        box-shadow: 0 6px 20px var(--scrim);
        font-size: 0.85rem;
      }
      .toast.ok {
        border-color: var(--green);
        color: var(--green);
      }
      .toast.bad {
        border-color: var(--red);
        color: var(--red);
      }

      /* yaml editor: highlighted <pre> under a transparent-text textarea; metrics must match exactly */
      .ed {
        position: relative;
        flex: 1;
        min-height: 55vh;
      }
      .ed .hl,
      .ed textarea {
        position: absolute;
        inset: 0;
        margin: 0;
        font: inherit;
        font-family: var(--mono);
        font-size: 14px;
        line-height: 1.7;
        letter-spacing: normal;
        tab-size: 2;
        padding: 0.8rem 1rem;
        border: 1px solid var(--term-border);
        border-radius: var(--radius);
        white-space: pre-wrap;
        overflow-wrap: break-word;
        overflow-y: scroll;
        overflow-x: hidden;
      }
      .ed .hl {
        border-color: transparent;
        background: var(--term-bg);
        color: var(--term-text);
        pointer-events: none;
      }
      .ed .hl::-webkit-scrollbar-thumb {
        background: transparent;
      }
      .ed .hl.mirror {
        visibility: hidden;
      }
      .ed textarea {
        resize: none;
        background: transparent;
        color: transparent;
        caret-color: var(--caret);
      }
      .tok-key {
        color: var(--tok-key);
      }
      .tok-verb {
        color: var(--tok-verb);
        font-weight: 600;
      }
      .tok-str {
        color: var(--tok-str);
      }
      .tok-num {
        color: var(--tok-num);
      }
      .tok-com {
        color: var(--tok-com);
        font-style: italic;
      }
      .tok-blk {
        color: var(--tok-blk);
      }
      .tok-ph {
        color: var(--tok-ph);
      }
      .tok-pun {
        color: var(--tok-pun);
      }

      .ac {
        position: absolute;
        z-index: 6;
        min-width: 12rem;
        max-width: 22rem;
        max-height: 12rem;
        overflow: auto;
        background: var(--pop-bg);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        box-shadow: 0 6px 20px var(--scrim);
        font-size: 0.85rem;
      }
      .ac div {
        padding: 0.2rem 0.6rem;
        cursor: pointer;
        white-space: nowrap;
      }
      .ac div.on {
        background: var(--pop-sel);
        color: var(--accent);
      }

      .seg {
        display: inline-flex;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .seg button {
        border: 0;
        border-radius: 0;
        padding: 0.4rem 0.8rem;
      }
      .seg button.on {
        background: var(--accent);
        color: var(--fill-ink);
      }
      .seg button.on:hover {
        background: var(--fill);
      }
      .addbar {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
      }

      /* canvas */
      .canvas {
        position: relative;
        flex: none;
        height: 62vh;
        min-height: 22rem;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background-color: var(--canvas-bg);
        background-image: radial-gradient(var(--canvas-dot) 1px, transparent 1px);
        touch-action: none;
        cursor: grab;
      }
      .canvas:focus {
        outline: none;
      }
      .canvas:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .canvas.panning {
        cursor: grabbing;
      }
      .canvas .edges {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      .canvas .edges path {
        fill: none;
        stroke: var(--edge);
        stroke-width: 2;
      }
      .canvas .layer {
        position: absolute;
        inset: 0;
        transform-origin: 0 0;
        pointer-events: none;
      }
      .canvas .layer > * {
        pointer-events: auto;
      }
      .canvas .empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 0.6rem;
        pointer-events: none;
        text-align: center;
      }
      .canvas .empty p {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .canvas .empty button {
        pointer-events: auto;
        background: var(--bg-elevated);
      }

      .node {
        position: absolute;
        width: 96px;
        height: 96px;
        border-radius: 8px;
        border: 1px solid var(--line-strong);
        background: var(--bg-elevated);
        display: grid;
        place-items: center;
        cursor: grab;
        user-select: none;
      }
      .node:active {
        cursor: grabbing;
      }
      .node.sel,
      .node:focus-visible {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-soft);
        outline: none;
      }
      .node.trigger {
        border-radius: 46px 8px 8px 46px;
        cursor: default;
      }
      .node .icon {
        font-size: 1.5rem;
        line-height: 1;
        color: var(--tint);
      }
      .node .num {
        position: absolute;
        top: -9px;
        left: -9px;
        min-width: 20px;
        height: 20px;
        padding: 0 4px;
        border-radius: 10px;
        background: var(--num-bg);
        color: var(--ink);
        font-size: 11px;
        font-weight: 700;
        line-height: 20px;
        text-align: center;
      }
      .node .ext {
        position: absolute;
        top: -9px;
        right: -9px;
        width: 20px;
        height: 20px;
        border-radius: 10px;
        background: var(--n-trigger);
        color: var(--fill-ink);
        font-size: 11px;
        font-weight: 700;
        line-height: 20px;
        text-align: center;
      }
      .node .label {
        position: absolute;
        top: 104px;
        left: -42px;
        width: 180px;
        text-align: center;
        font-size: 12px;
        line-height: 1.35;
        color: var(--ink-soft);
        pointer-events: none;
      }
      .node .label small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .node .port {
        position: absolute;
        top: 50%;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--edge);
        transform: translateY(-50%);
      }
      .node .port.in {
        left: -5px;
      }
      .node .port.out {
        right: -5px;
      }
      .node .tools {
        position: absolute;
        top: -30px;
        right: 0;
        display: none;
        gap: 0.25rem;
      }
      .node:hover .tools,
      .node.sel .tools {
        display: flex;
      }
      .node .tools button {
        padding: 0.1rem 0.35rem;
        font-size: 12px;
        background: var(--bg-elevated);
      }
      .plus {
        position: absolute;
        width: 20px;
        height: 20px;
        padding: 0;
        min-width: 0;
        display: grid;
        place-items: center;
        font-size: 13px;
        line-height: 1;
        border-radius: var(--radius-sm);
        background: var(--canvas-bg);
        color: var(--muted);
      }
      .plus:hover {
        color: var(--accent);
      }

      .zoombar {
        position: absolute;
        left: 0.6rem;
        bottom: 0.6rem;
        display: flex;
        gap: 0.25rem;
      }
      .zoombar button {
        padding: 0.2rem 0.5rem;
        background: var(--bg-elevated);
      }
      .canvas .addnode {
        position: absolute;
        top: 0.6rem;
        right: 0.6rem;
        background: var(--bg-elevated);
      }
      .canvas .tip {
        position: absolute;
        right: 0.6rem;
        bottom: 0.6rem;
        font-size: 11px;
        color: var(--muted);
        pointer-events: none;
      }

      .palette {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 17rem;
        padding: 0.6rem;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        background: var(--bg-elevated);
        border-left: 1px solid var(--line);
        overflow: auto;
        z-index: 4;
      }
      .palette h3 {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }
      .palette .item {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.1rem 0.6rem;
        text-align: left;
        padding: 0.5rem 0.6rem;
      }
      .palette .item .icon {
        grid-row: span 2;
        align-self: center;
        font-size: 1.1rem;
        color: var(--tint);
      }
      .palette .item small {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
      }

      /* node parameters modal — scoped to the canvas so editor teardown removes it */
      .ndv {
        position: absolute;
        inset: 0;
        background: var(--scrim);
        display: grid;
        place-items: center;
        z-index: 10;
      }
      .ndv .panel {
        width: min(46rem, 92%);
        max-height: 94%;
        overflow: auto;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        padding: 1rem 1.1rem;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
      }
      .ndv .head {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      .ndv .head .icon {
        font-size: 1.3rem;
        color: var(--tint);
      }
      .ndv .head input {
        flex: 1;
      }
      .ndv .kept {
        font-size: 0.75rem;
        color: var(--n-trigger);
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        font-size: 0.72rem;
        color: var(--muted);
      }
      .field textarea {
        min-height: 5rem;
        font-size: 0.85rem;
        flex: none;
      }
      .field input,
      .field select {
        font-size: 0.85rem;
      }
      .field.inline {
        flex-direction: row;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.8rem;
        color: var(--ink-soft);
      }

      /* runs */
      #runs-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .run {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 0.6rem 0.8rem;
        background: var(--bg-elevated);
      }
      .run .dot {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        flex: none;
        background: var(--muted);
      }
      .run .dot.ok {
        background: var(--green);
      }
      .run .dot.bad {
        background: var(--red);
      }
      .run .name {
        font-weight: 600;
      }
      .run .when {
        color: var(--muted);
        font-size: 0.8rem;
        margin-left: auto;
        white-space: nowrap;
      }
      .run .err {
        color: var(--red);
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>herdr<span>-workflows</span></h1>
      <nav class="tabs">
        <button class="tab on" data-tab="workflows">Workflows</button>
        <button class="tab" data-tab="config">Config</button>
        <button class="tab" data-tab="runs">Runs</button>
      </nav>
      <span id="repo" class="repo"></span>
    </header>
    <main>
      <aside id="list"></aside>
      <section id="pane"></section>
    </main>
    <script>
      const TOKEN = "__HWF_TOKEN__";
      const $ = (id) => document.getElementById(id);
      let state = { entries: [], profiles: [], repoRoot: "" };
      let tab = "workflows";
      let current = null; // {name, scope}
      let openSeq = 0; // last-click-wins token for openWorkflow
      let configDirty = false;
      let editorDirty = false;
      let editorFileText = ""; // open workflow as last read from disk — live reload compares to it
      let editorMode = "text"; // desired mode, kept across live reloads
      let wantOpen = null; // {name, scope} from the URL hash; opened as soon as the file exists

      function errMsg(e) {
        return (e && e.message) || String(e);
      }

      function esc(s) {
        return String(s == null ? "" : s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }

      // Lives on <body>, so it outlives the post-save re-render of the editor pane.
      function toast(msg, ok) {
        const t = document.createElement("div");
        t.className = "toast " + (ok ? "ok" : "bad");
        t.setAttribute("role", "status");
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2600);
      }

      async function api(path, opts) {
        const o = opts || {};
        o.headers = Object.assign({ "x-hwf-token": TOKEN }, o.headers || {});
        if (o.body) o.headers["content-type"] = "application/json";
        let res;
        try {
          res = await fetch(path, o);
        } catch (e) {
          return {
            status: 0,
            data: { ok: false, error: "cannot reach the server — " + errMsg(e) },
          };
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          data.ok = false;
          if (!data.error) data.error = "server returned " + res.status;
        }
        return { status: res.status, data };
      }

      function confirmLeave() {
        if (configDirty && !confirm("discard unsaved config changes?")) return false;
        if (editorDirty && !confirm("discard unsaved workflow changes?")) return false;
        configDirty = false;
        editorDirty = false;
        return true;
      }

      async function loadState() {
        const { status, data } = await api("/api/state");
        if (status !== 200 || data.error) {
          state = { entries: [], profiles: [], repoRoot: "" };
          const pane = $("pane");
          pane.innerHTML = "";
          const p = document.createElement("p");
          p.className = "status bad";
          p.textContent = "cannot reach the hwf server — reload to retry (" + data.error + ")";
          pane.appendChild(p);
          return;
        }
        state = Object.assign({ entries: [], profiles: [], repoRoot: "" }, data);
        $("repo").innerHTML = "repo <b>" + esc(state.repoRoot) + "</b>";
        render();
      }

      function render() {
        document
          .querySelectorAll(".tab")
          .forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
        document.querySelector("main").classList.toggle("full", tab !== "workflows");
        if (tab === "workflows") return renderWorkflows();
        if (tab === "config") return renderConfig();
        return renderRuns();
      }

      function renderWorkflows() {
        const list = $("list");
        list.classList.remove("hide");
        list.innerHTML = "";
        const nu = document.createElement("button");
        nu.textContent = "+ new";
        nu.className = "tab";
        nu.style.width = "100%";
        nu.onclick = newWorkflow;
        list.appendChild(nu);
        const addRow = (e) => {
          const row = document.createElement("button");
          row.type = "button";
          row.className =
            "row" + (!e.valid ? " bad" : "") + (current && current.name === e.name ? " on" : "");
          const name = document.createElement("span");
          name.textContent = e.name;
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent =
            e.inRepo && e.inGlobal ? "local + global" : e.source === "repo" ? "local" : "global";
          row.append(name, badge);
          row.onclick = () => {
            if (confirmLeave()) openWorkflow(e.name, e.source);
          };
          list.appendChild(row);
        };
        for (const e of state.entries) if (!e.hidden) addRow(e);
        const hidden = state.entries.filter((e) => e.hidden);
        if (hidden.length) {
          const head = document.createElement("p");
          head.className = "hint";
          head.textContent = "background — not shown in the picker";
          list.appendChild(head);
          for (const e of hidden) addRow(e);
        }
        if (state.entries.length === 0) {
          const empty = document.createElement("p");
          empty.className = "hint";
          empty.textContent = "no workflows yet — create one above";
          list.appendChild(empty);
        }
        if (!current) $("pane").innerHTML = "<p class=hint>Select a workflow or create one.</p>";
      }

      async function openWorkflow(name, scope) {
        const seq = ++openSeq;
        current = { name, scope };
        wantOpen = null;
        setHash("w=" + scope + ":" + name);
        renderWorkflows();
        const pane = $("pane");
        pane.innerHTML = "<p class=hint>loading…</p>";
        const r = await api("/api/workflow?name=" + encodeURIComponent(name) + "&scope=" + scope);
        if (seq !== openSeq) return;
        // A stored file that fails to parse still opens: the text came back, the error is pinned.
        if (r.status !== 200) {
          pane.innerHTML = "";
          const p = document.createElement("p");
          p.className = "status bad";
          p.textContent = r.data.error || "could not load " + name;
          pane.appendChild(p);
          return;
        }
        renderEditor(name, scope, r.data.text || "", r.data.error || "");
      }

      function newWorkflow() {
        if (!confirmLeave()) return;
        openSeq += 1; // cancel any in-flight openWorkflow
        current = { name: "", scope: "repo" };
        renderWorkflows();
        renderEditor("", "repo", "steps:\n  - run: echo hello\n", "");
      }

      // Readable step blocks appended at the end of the step list (the right slot for a linear runner).
      const SKELETONS = {
        run: "  - run: ",
        agent: "  - agent: \n    prompt: |-\n      ",
        use: "  - use: ",
        primitive: "  - pane.split: { direction: right }\n",
      };

      const VERBS = ["run", "agent", "use", "primitive"];

      // Mirrors the Zod schema in src/workflow/parse.ts.
      const TOP_KEYS = ["desc", "hidden", "inputs", "on_error", "steps"];
      const STEP_KEYS = [
        "agent",
        "allow_fail",
        "as",
        "cwd",
        "env",
        "for",
        "in",
        "name",
        "on_error",
        "out",
        "prompt",
        "ratio",
        "retry",
        "run",
        "shell",
        "timeout",
        "use",
        "wait",
        "when",
        "with",
      ];

      const NODE_TYPES = {
        run: {
          title: "Execute Command",
          icon: ">_",
          tint: "var(--n-run)",
          desc: "Run a shell command in a herdr pane",
        },
        agent: {
          title: "Agent",
          icon: "✦",
          tint: "var(--n-agent)",
          desc: "Send a prompt to a configured agent",
        },
        use: {
          title: "Sub-workflow",
          icon: "⊞",
          tint: "var(--n-use)",
          desc: "Run another workflow inline",
        },
        primitive: {
          title: "herdr Primitive",
          icon: "⌗",
          tint: "var(--n-prim)",
          desc: "Call a dotted herdr method",
        },
      };

      const SVGNS = "http://www.w3.org/2000/svg";
      const NODE_W = 96;
      const NODE_H = 96;
      const GAP_X = 240;

      function verbOf(step) {
        if (step.run !== undefined) return "run";
        if (step.agent !== undefined) return "agent";
        if (step.use !== undefined) return "use";
        const method = Object.keys(step).find((k) => k.includes("."));
        if (method) return "primitive";
        return "run";
      }

      function primitiveMethod(step) {
        return Object.keys(step).find((k) => k.includes(".")) || "pane.split";
      }

      function fieldsFor(verb) {
        const paneOpts = ["", "here", "tab", "right", "down"];
        const tail = [
          { k: "in", l: "pane", t: "select", opts: paneOpts },
          { k: "out", l: "capture output as" },
          { k: "timeout", l: "timeout seconds" },
          { k: "wait", l: "detach (wait: false)", t: "check" },
        ];
        if (verb === "run")
          return [
            { k: "run", l: "command", t: "area" },
            {
              k: "argv",
              l: "argv list — JSON array form, required for {placeholders}",
              t: "check",
            },
            { k: "shell", l: "shell" },
          ].concat(tail);
        if (verb === "agent")
          return [
            { k: "agent", l: "agent", t: "select", opts: [""].concat(state.profiles) },
            { k: "prompt", l: "prompt", t: "area" },
          ].concat(tail);
        if (verb === "use")
          return [
            {
              k: "use",
              l: "workflow",
              t: "select",
              opts: [""].concat(state.entries.map((e) => e.name)),
            },
            { k: "with", l: "with — JSON object", t: "area" },
          ];
        return [
          { k: "method", l: "method (e.g. pane.split)" },
          { k: "params", l: "params — JSON object, blank for none", t: "area" },
          { k: "out", l: "out map — JSON object", t: "area" },
        ];
      }

      function jsonOf(v) {
        return v && typeof v === "object" ? JSON.stringify(v) : "";
      }

      function formFrom(verb, step) {
        const f = { name: typeof step.name === "string" ? step.name : "" };
        if (verb === "primitive") {
          const method = primitiveMethod(step);
          f.method = method;
          f.params = step[method] == null ? "" : jsonOf(step[method]);
          f.out = jsonOf(step.out);
          return f;
        }
        if (verb === "use") {
          f.use = step.use || "";
          f.with = jsonOf(step.with);
          return f;
        }
        if (verb === "run") {
          f.argv = Array.isArray(step.run);
          f.run = f.argv ? JSON.stringify(step.run) : typeof step.run === "string" ? step.run : "";
          f.shell = step.shell || "";
        } else {
          f.agent = step.agent || "";
          f.prompt = step.prompt || "";
        }
        f.in = step.in || "";
        f.out = typeof step.out === "string" ? step.out : "";
        f.timeout = step.timeout ? String(step.timeout) : "";
        f.wait = step.wait === false;
        return f;
      }

      // Step keys the form has no widget for (when/for/retry/env/…): carried through untouched.
      function extraOf(verb, step) {
        const used = new Set(["name"]);
        if (verb === "primitive") {
          used.add(primitiveMethod(step));
          used.add("out");
        } else if (verb === "use") {
          used.add("use");
          used.add("with");
        } else {
          used.add(verb);
          used.add("in");
          used.add("timeout");
          used.add(verb === "run" ? "shell" : "prompt");
          if (typeof step.out === "string") used.add("out");
          if (step.wait === false) used.add("wait");
        }
        const extra = {};
        for (const k of Object.keys(step)) if (!used.has(k)) extra[k] = step[k];
        return extra;
      }

      // Live form values → a raw step the /api/format endpoint accepts, or an error to show.
      function stepFrom(verb, form, extra) {
        const out = Object.assign({}, extra);
        const s = (k) => String(form[k] ?? "").trim();
        const jsonInto = (key, raw, label) => {
          try {
            out[key] = JSON.parse(raw);
            return null;
          } catch {
            return label + " must be valid JSON";
          }
        };
        if (verb === "run") {
          if (form.argv) {
            const err = jsonInto("run", s("run") || "[]", "run argv");
            if (err) return { error: err };
            if (!Array.isArray(out.run)) return { error: "run argv must be a JSON array" };
          } else {
            out.run = String(form.run ?? ""); // leading/trailing whitespace can be meaningful
          }
          if (s("shell")) out.shell = s("shell");
        } else if (verb === "agent") {
          out.agent = s("agent");
          if (form.prompt) out.prompt = form.prompt;
        } else if (verb === "use") {
          out.use = s("use");
          if (s("with")) {
            const err = jsonInto("with", s("with"), "with");
            if (err) return { error: err };
          }
        } else {
          const method = s("method");
          if (!method.includes(".")) return { error: "method must be a dotted herdr name" };
          if (!s("params")) out[method] = null;
          else {
            const err = jsonInto(method, s("params"), "params");
            if (err) return { error: err };
          }
          if (s("out")) {
            const e2 = jsonInto("out", s("out"), "out map");
            if (e2) return { error: e2 };
          }
        }
        if (verb === "run" || verb === "agent") {
          if (s("in")) out.in = s("in");
          if (s("out")) out.out = s("out");
          if (s("timeout")) {
            const n = Number(s("timeout"));
            if (!Number.isInteger(n) || n <= 0)
              return { error: "timeout must be a positive integer" };
            out.timeout = n;
          }
          if (form.wait) out.wait = false;
        }
        if (s("name")) out.name = s("name");
        return { step: out };
      }

      function seedStep(verb) {
        if (verb === "primitive") return { "pane.split": { direction: "right" } };
        return { [verb]: "" };
      }

      function nodeSummary(verb, form) {
        if (verb === "run") return form.run || "no command";
        if (verb === "agent") return form.agent || "no agent";
        if (verb === "use") return form.use || "no workflow";
        return form.method || "pane.split";
      }

      function nodeTitle(verb, form) {
        return form.name || NODE_TYPES[verb].title;
      }

      function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
      }

      // n8n-style canvas: pan/zoom surface, one box per step, execution order = left-to-right.
      function makeCanvas(root, onChange, triggerLabel) {
        const svg = document.createElementNS(SVGNS, "svg");
        svg.setAttribute("class", "edges");
        const g = document.createElementNS(SVGNS, "g");
        svg.appendChild(g);
        const layer = document.createElement("div");
        layer.className = "layer";
        root.append(svg, layer);
        root.tabIndex = 0;

        let nodes = [];
        let view = { x: 60, y: 90, z: 1 };
        let selected = null;
        let palette = null;
        let ndv = null;
        const undos = [];

        const trigger = document.createElement("div");
        trigger.className = "node trigger";
        trigger.style.setProperty("--tint", "var(--n-trigger)");
        trigger.innerHTML =
          '<span class="icon">⚡</span><span class="port out"></span><span class="label"></span>';
        trigger.querySelector(".label").textContent = triggerLabel();
        layer.appendChild(trigger);

        const empty = document.createElement("div");
        empty.className = "empty hide";
        const emptyMsg = document.createElement("p");
        emptyMsg.textContent = "This workflow has no steps yet.";
        const emptyBtn = document.createElement("button");
        emptyBtn.textContent = "add your first step";
        emptyBtn.onclick = () => openPalette(null);
        empty.append(emptyMsg, emptyBtn);
        root.appendChild(empty);

        function ordered() {
          return nodes.slice().sort((a, b) => a.x - b.x || a.y - b.y);
        }

        function snap() {
          undos.push(
            nodes.map((n) => ({
              verb: n.verb,
              form: Object.assign({}, n.form),
              extra: n.extra,
              x: n.x,
              y: n.y,
            })),
          );
          if (undos.length > 40) undos.shift();
        }

        function setNodes(recs) {
          for (const n of nodes) n.el.remove();
          nodes = recs.map((r) => ({
            verb: r.verb,
            form: Object.assign({}, r.form),
            extra: r.extra,
            x: r.x,
            y: r.y,
          }));
          for (const n of nodes) makeNodeEl(n);
          selected = null;
        }

        function undo() {
          const prev = undos.pop();
          if (!prev) return;
          setNodes(prev);
          draw();
          onChange();
        }

        function applyView() {
          const t = "translate(" + view.x + "px," + view.y + "px) scale(" + view.z + ")";
          layer.style.transform = t;
          g.setAttribute(
            "transform",
            "translate(" + view.x + "," + view.y + ") scale(" + view.z + ")",
          );
          root.style.backgroundSize = 20 * view.z + "px " + 20 * view.z + "px";
          root.style.backgroundPosition = view.x + "px " + view.y + "px";
        }

        // Counter-scale so the 20px hit target stays clickable when the canvas is zoomed out.
        function plusScale() {
          return "translate(-50%,-50%) scale(" + Math.max(1, 1 / view.z) + ")";
        }

        function rescalePlus() {
          const t = plusScale();
          layer.querySelectorAll(".plus").forEach((b) => (b.style.transform = t));
        }

        function edge(x1, y1, x2, y2) {
          const d = Math.max(50, (x2 - x1) / 2);
          const p = document.createElementNS(SVGNS, "path");
          p.setAttribute(
            "d",
            "M " +
              x1 +
              " " +
              y1 +
              " C " +
              (x1 + d) +
              " " +
              y1 +
              ", " +
              (x2 - d) +
              " " +
              y2 +
              ", " +
              x2 +
              " " +
              y2,
          );
          g.appendChild(p);
        }

        // `before` is the node the new step lands in front of (null = append), re-resolved on click.
        function plusAt(x, y, before) {
          const b = document.createElement("button");
          b.className = "plus";
          b.textContent = "+";
          b.title = "add a step here";
          b.style.left = x + "px";
          b.style.top = y + "px";
          b.style.transform = plusScale();
          b.onclick = (e) => {
            e.stopPropagation();
            openPalette(before);
          };
          layer.appendChild(b);
        }

        function place() {
          ordered().forEach((n, i) => {
            n.el.style.left = n.x + "px";
            n.el.style.top = n.y + "px";
            n.el.classList.toggle("sel", selected === n);
            n.el.querySelector(".num").textContent = i + 1;
          });
        }

        function draw() {
          place();
          g.innerHTML = "";
          layer.querySelectorAll(".plus").forEach((el) => el.remove());
          const seq = ordered();
          empty.classList.toggle("hide", seq.length > 0);
          let px = NODE_W;
          let py = NODE_H / 2;
          seq.forEach((n) => {
            const cy = n.y + NODE_H / 2;
            edge(px, py, n.x, cy);
            plusAt((px + n.x) / 2, (py + cy) / 2, n);
            px = n.x + NODE_W;
            py = cy;
          });
          edge(px, py, px + 56, py);
          plusAt(px + 66, py, null);
        }

        function relabel(n) {
          const label = n.el.querySelector(".label");
          const title = nodeTitle(n.verb, n.form);
          const summary = nodeSummary(n.verb, n.form);
          label.textContent = title;
          const sub = document.createElement("small");
          sub.textContent = summary;
          label.appendChild(sub);
          const keys = Object.keys(n.extra);
          const ext = n.el.querySelector(".ext");
          ext.classList.toggle("hide", keys.length === 0);
          ext.title = keys.length
            ? "kept from YAML, not shown in this form: " + keys.join(", ")
            : "";
          n.el.setAttribute("aria-label", "step " + title + " — " + summary);
        }

        function makeNodeEl(n) {
          const el = document.createElement("div");
          el.className = "node";
          el.tabIndex = 0;
          el.setAttribute("role", "button");
          el.style.setProperty("--tint", NODE_TYPES[n.verb].tint);
          el.innerHTML =
            '<span class="icon"></span><span class="num"></span><span class="ext hide">⚙</span>' +
            '<span class="port in"></span><span class="port out"></span>' +
            '<span class="label"></span><span class="tools"></span>';
          el.querySelector(".icon").textContent = NODE_TYPES[n.verb].icon;
          const del = document.createElement("button");
          del.textContent = "✕";
          del.title = "delete step";
          del.onclick = (e) => {
            e.stopPropagation();
            remove(n);
          };
          el.querySelector(".tools").appendChild(del);
          el.ondblclick = (e) => {
            e.stopPropagation();
            openNdv(n);
          };
          wireNodeDrag(n, el);
          wireNodeKeys(n, el);
          n.el = el;
          layer.appendChild(el);
          relabel(n);
          return el;
        }

        function wireNodeKeys(n, el) {
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              selected = n;
              openNdv(n);
              return;
            }
            const step = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
            if (!step) return;
            e.preventDefault();
            const seq = ordered();
            const next = seq[clamp(seq.indexOf(n) + step, 0, seq.length - 1)];
            if (!next) return;
            selected = next;
            place();
            next.el.focus();
          });
        }

        function wireNodeDrag(n, el) {
          let start = null;
          el.addEventListener("pointerdown", (e) => {
            if (e.button !== 0 || e.target.closest(".tools")) return;
            e.stopPropagation();
            el.setPointerCapture(e.pointerId);
            start = { px: e.clientX, py: e.clientY, x: n.x, y: n.y, moved: false };
            selected = n;
            el.focus();
            place();
          });
          el.addEventListener("pointermove", (e) => {
            if (!start) return;
            const dx = (e.clientX - start.px) / view.z;
            const dy = (e.clientY - start.py) / view.z;
            if (!start.moved && Math.abs(dx) + Math.abs(dy) > 3) {
              start.moved = true;
              snap();
            }
            n.x = start.x + dx;
            n.y = start.y + dy;
            place();
          });
          const end = () => {
            if (!start) return;
            // Snap back to lanes so the x order that defines execution order is unambiguous.
            if (start.moved) {
              ordered().forEach((m, i) => {
                m.x = GAP_X * (i + 1);
              });
            }
            draw();
            if (start.moved) onChange();
            start = null;
          };
          el.addEventListener("pointerup", end);
          el.addEventListener("pointercancel", end);
        }

        function remove(n) {
          snap();
          n.el.remove();
          nodes = nodes.filter((x) => x !== n);
          if (selected === n) selected = null;
          draw();
          onChange();
        }

        // Slot a new node into the gap before `index`, shifting the tail right when there is no room.
        function placeAt(index) {
          const seq = ordered();
          if (index >= seq.length) {
            const last = seq[seq.length - 1];
            return last ? { x: last.x + GAP_X, y: last.y } : { x: GAP_X, y: 0 };
          }
          const next = seq[index];
          const prev = index > 0 ? seq[index - 1] : null;
          const prevX = prev ? prev.x : 0;
          if (next.x - prevX >= GAP_X * 1.6)
            return { x: (prevX + next.x) / 2, y: prev ? prev.y : next.y };
          for (const n of seq.slice(index)) n.x += GAP_X;
          return { x: prevX + GAP_X, y: next.y };
        }

        function add(verb, index, pos) {
          snap();
          const at = pos || placeAt(index == null ? nodes.length : index);
          const n = { verb, form: formFrom(verb, seedStep(verb)), extra: {}, x: at.x, y: at.y };
          nodes.push(n);
          makeNodeEl(n);
          selected = n;
          draw();
          openNdv(n); // the sync fires when the modal closes, so a blank step never flashes an error
        }

        function slotOf(before) {
          if (!before) return nodes.length;
          const i = ordered().indexOf(before);
          return i < 0 ? nodes.length : i;
        }

        function openPalette(before) {
          closePalette();
          palette = document.createElement("div");
          palette.className = "palette";
          const head = document.createElement("h3");
          head.textContent = "add a step — click, or drag onto the canvas";
          palette.appendChild(head);
          for (const verb of VERBS) {
            const t = NODE_TYPES[verb];
            const item = document.createElement("button");
            item.className = "item";
            item.draggable = true;
            item.style.setProperty("--tint", t.tint);
            const icon = document.createElement("span");
            icon.className = "icon";
            icon.textContent = t.icon;
            const title = document.createElement("span");
            title.textContent = t.title;
            const desc = document.createElement("small");
            desc.textContent = t.desc;
            item.append(icon, title, desc);
            item.ondragstart = (e) => e.dataTransfer.setData("text/plain", verb);
            item.onclick = () => {
              const index = slotOf(before);
              closePalette();
              add(verb, index);
            };
            palette.appendChild(item);
          }
          const close = document.createElement("button");
          close.textContent = "close";
          close.onclick = closePalette;
          palette.appendChild(close);
          root.appendChild(palette);
        }

        function closePalette() {
          if (palette) palette.remove();
          palette = null;
        }

        function toCanvas(clientX, clientY) {
          const r = root.getBoundingClientRect();
          return {
            x: (clientX - r.left - view.x) / view.z,
            y: (clientY - r.top - view.y) / view.z,
          };
        }

        root.addEventListener("dragover", (e) => e.preventDefault());
        root.addEventListener("drop", (e) => {
          e.preventDefault();
          const verb = e.dataTransfer.getData("text/plain");
          if (!NODE_TYPES[verb]) return;
          closePalette();
          const p = toCanvas(e.clientX, e.clientY);
          add(verb, null, { x: p.x - NODE_W / 2, y: p.y - NODE_H / 2 });
        });

        let pan = null;
        root.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          if (e.target.closest(".node, .plus, .palette, .zoombar, .addnode, .ndv, .empty")) return;
          selected = null;
          place();
          pan = { px: e.clientX, py: e.clientY, x: view.x, y: view.y };
          root.classList.add("panning");
          root.setPointerCapture(e.pointerId);
        });
        root.addEventListener("pointermove", (e) => {
          if (!pan) return;
          view.x = pan.x + (e.clientX - pan.px);
          view.y = pan.y + (e.clientY - pan.py);
          applyView();
        });
        const endPan = () => {
          pan = null;
          root.classList.remove("panning");
        };
        root.addEventListener("pointerup", endPan);
        root.addEventListener("pointercancel", endPan);

        function bounds() {
          let minX = 0;
          let minY = 0;
          let maxX = NODE_W;
          let maxY = NODE_H;
          for (const n of nodes) {
            minX = Math.min(minX, n.x);
            minY = Math.min(minY, n.y);
            maxX = Math.max(maxX, n.x + NODE_W);
            maxY = Math.max(maxY, n.y + NODE_H);
          }
          return { minX, minY, maxX, maxY: maxY + 40 }; // node labels hang below the box
        }

        // Only swallow the wheel when there is off-screen content in that direction.
        function canPan(dx, dy) {
          const r = root.getBoundingClientRect();
          const b = bounds();
          if (dy > 0 && view.y + b.maxY * view.z > r.height) return true;
          if (dy < 0 && view.y + b.minY * view.z < 0) return true;
          if (dx > 0 && view.x + b.maxX * view.z > r.width) return true;
          if (dx < 0 && view.x + b.minX * view.z < 0) return true;
          return false;
        }

        root.addEventListener(
          "wheel",
          (e) => {
            if (e.ctrlKey || e.metaKey) {
              e.preventDefault();
              zoomAt(Math.exp(-e.deltaY / 300), e.clientX, e.clientY);
              return;
            }
            if (!canPan(e.deltaX, e.deltaY)) return;
            e.preventDefault();
            view.x -= e.deltaX;
            view.y -= e.deltaY;
            applyView();
          },
          { passive: false },
        );

        root.addEventListener("keydown", (e) => {
          if (ndv || e.target.closest("input, textarea, select, .palette")) return;
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") {
            e.preventDefault();
            undo();
            return;
          }
          if ((e.key === "Delete" || e.key === "Backspace") && selected) {
            e.preventDefault();
            remove(selected);
          }
          if (e.key === "Escape") closePalette();
        });

        function zoomAt(factor, clientX, clientY) {
          const r = root.getBoundingClientRect();
          const cx = clientX === undefined ? r.width / 2 : clientX - r.left;
          const cy = clientY === undefined ? r.height / 2 : clientY - r.top;
          const z = clamp(view.z * factor, 0.25, 2.5);
          const k = z / view.z;
          view.x = cx - (cx - view.x) * k;
          view.y = cy - (cy - view.y) * k;
          view.z = z;
          applyView();
          rescalePlus();
        }

        function fit() {
          const r = root.getBoundingClientRect();
          if (!r.width) return;
          const b = bounds();
          const z = clamp(
            Math.min((r.width - 120) / (b.maxX - b.minX), (r.height - 120) / (b.maxY - b.minY)),
            0.25,
            1.2,
          );
          view.z = z;
          view.x = (r.width - (b.maxX - b.minX) * z) / 2 - b.minX * z;
          view.y = (r.height - (b.maxY - b.minY) * z) / 2 - b.minY * z;
          applyView();
          rescalePlus();
        }

        const zoombar = document.createElement("div");
        zoombar.className = "zoombar";
        for (const [label, fn] of [
          ["−", () => zoomAt(1 / 1.2)],
          ["+", () => zoomAt(1.2)],
          ["⤢", fit],
          ["1:1", () => zoomAt(1 / view.z)],
        ]) {
          const b = document.createElement("button");
          b.textContent = label;
          b.onclick = fn;
          zoombar.appendChild(b);
        }
        root.appendChild(zoombar);

        const addBtn = document.createElement("button");
        addBtn.className = "addnode";
        addBtn.textContent = "+ add step";
        addBtn.onclick = () => openPalette(null);
        root.appendChild(addBtn);

        const tip = document.createElement("span");
        tip.className = "tip";
        tip.textContent =
          "drag to move · scroll to pan · ⌘/ctrl+scroll to zoom · ⌘/ctrl+Z undo · Enter opens a step";
        root.appendChild(tip);

        function closeNdv() {
          if (!ndv) return;
          const n = ndv.node;
          ndv.wrap.remove();
          ndv = null;
          relabel(n);
          draw();
          onChange();
        }

        function trapTab(wrap, e) {
          const f = wrap.querySelectorAll("input, select, textarea, button");
          if (!f.length) return;
          const first = f[0];
          const last = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }

        // Node parameters, n8n's detail view: edits write straight into the node's form.
        function openNdv(n) {
          closeNdv();
          const t = NODE_TYPES[n.verb];
          const wrap = document.createElement("div");
          wrap.className = "ndv";
          wrap.setAttribute("role", "dialog");
          wrap.setAttribute("aria-modal", "true");
          wrap.setAttribute("aria-label", nodeTitle(n.verb, n.form));
          const panel = document.createElement("div");
          panel.className = "panel";
          panel.style.setProperty("--tint", t.tint);
          const head = document.createElement("div");
          head.className = "head";
          const icon = document.createElement("span");
          icon.className = "icon";
          icon.textContent = t.icon;
          const nameIn = document.createElement("input");
          nameIn.placeholder = t.title;
          nameIn.value = n.form.name || "";
          nameIn.oninput = () => {
            n.form.name = nameIn.value;
            relabel(n);
          };
          head.append(icon, nameIn);
          panel.appendChild(head);

          const keptKeys = Object.keys(n.extra);
          if (keptKeys.length) {
            const kept = document.createElement("p");
            kept.className = "kept";
            kept.textContent = "⚙ kept from YAML, edit in yaml mode: " + keptKeys.join(", ");
            panel.appendChild(kept);
          }

          for (const f of fieldsFor(n.verb)) {
            const wrapF = document.createElement("label");
            wrapF.className = "field" + (f.t === "check" ? " inline" : "");
            let el;
            if (f.t === "check") {
              el = document.createElement("input");
              el.type = "checkbox";
              el.checked = !!n.form[f.k];
              el.onchange = () => {
                n.form[f.k] = el.checked;
                relabel(n);
              };
              wrapF.append(el, document.createTextNode(f.l));
            } else {
              const cap = document.createElement("span");
              cap.textContent = f.l;
              if (f.t === "select") {
                el = document.createElement("select");
                const opts = f.opts.includes(n.form[f.k] || "")
                  ? f.opts
                  : f.opts.concat([n.form[f.k]]);
                for (const o of opts) {
                  const opt = document.createElement("option");
                  opt.value = o;
                  opt.textContent = o || "—";
                  if (o === (n.form[f.k] || "")) opt.selected = true;
                  el.appendChild(opt);
                }
              } else {
                el = document.createElement(f.t === "area" ? "textarea" : "input");
                el.value = n.form[f.k] || "";
              }
              const write = () => {
                n.form[f.k] = el.value;
                relabel(n);
              };
              el.oninput = write;
              el.onchange = write;
              wrapF.append(cap, el);
            }
            panel.appendChild(wrapF);
          }

          const done = document.createElement("button");
          done.textContent = "back to canvas";
          done.onclick = closeNdv;
          panel.appendChild(done);

          wrap.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              closeNdv();
              return;
            }
            if (e.key === "Tab") trapTab(wrap, e);
          });
          wrap.onpointerdown = (e) => {
            e.stopPropagation();
            if (e.target === wrap) closeNdv();
          };
          wrap.appendChild(panel);
          root.appendChild(wrap);
          ndv = { wrap, node: n };
          nameIn.focus();
        }

        applyView();
        draw();

        return {
          load(steps) {
            closePalette();
            closeNdv();
            undos.length = 0;
            setNodes(
              steps.map((step, i) => {
                const verb = verbOf(step);
                return {
                  verb,
                  form: formFrom(verb, step),
                  extra: extraOf(verb, step),
                  x: GAP_X * (i + 1),
                  y: 0,
                };
              }),
            );
            draw();
            fit();
          },
          steps() {
            const out = [];
            for (const n of ordered()) {
              const r = stepFrom(n.verb, n.form, n.extra);
              if (r.error) return { error: nodeTitle(n.verb, n.form) + ": " + r.error };
              out.push(r.step);
            }
            return { steps: out };
          },
          setTrigger(label) {
            trigger.querySelector(".label").textContent = label;
          },
        };
      }

      /* ---------- YAML syntax highlighting ---------- */

      const VERB_RE = /^(?:run|agent|use|[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)+)$/;
      const PH_RE = /\{[a-z][a-z0-9_]*\}/g;
      const KV_RE = /^("[^"]*"|'[^']*'|[A-Za-z_][\w.-]*):(\s|$)/;

      function span(cls, text) {
        return '<span class="' + cls + '">' + esc(text) + "</span>";
      }

      function hlText(raw) {
        return esc(raw).replace(PH_RE, (m) => '<span class="tok-ph">' + m + "</span>");
      }

      function hlValue(raw) {
        const t = raw.trim();
        if (!t) return esc(raw);
        let cls = "";
        if (/^[|>][-+\d]*$/.test(t)) cls = "tok-blk";
        else if (/^"[\s\S]*"$/.test(t) || /^'[\s\S]*'$/.test(t)) cls = "tok-str";
        else if (/^(-?\d+(\.\d+)?|true|false|null|~)$/i.test(t)) cls = "tok-num";
        const inner = hlText(raw);
        return cls ? '<span class="' + cls + '">' + inner + "</span>" : inner;
      }

      function hlLine(line) {
        const lead = /^(\s*(?:-\s+)?)/.exec(line)[1];
        let rest = line.slice(lead.length);
        if (!rest) return esc(line);
        if (rest.startsWith("#")) return esc(lead) + span("tok-com", rest);
        // Trailing comments only when no quoting is in play, so `echo "# x"` stays intact.
        let trail = "";
        const hash = rest.indexOf(" #");
        if (hash >= 0 && !/["']/.test(rest.slice(0, hash))) {
          trail = span("tok-com", rest.slice(hash + 1));
          rest = rest.slice(0, hash + 1);
        }
        const kv = KV_RE.exec(rest);
        if (!kv) return esc(lead) + hlValue(rest) + trail;
        const cls = VERB_RE.test(kv[1]) ? "tok-verb" : "tok-key";
        return (
          esc(lead) +
          span(cls, kv[1]) +
          span("tok-pun", ":") +
          hlValue(rest.slice(kv[0].length - kv[2].length)) +
          trail
        );
      }

      // Trailing newline: without it the browser collapses the last line and the layers drift apart.
      function highlight(text) {
        return text.split("\n").map(hlLine).join("\n") + "\n";
      }

      /* ---------- YAML textarea: highlight + smart indent + autocomplete ---------- */

      function mkCodeEditor(initial, onInput) {
        const wrap = document.createElement("div");
        wrap.className = "ed";
        const pre = document.createElement("pre");
        pre.className = "hl";
        pre.setAttribute("aria-hidden", "true");
        const mirror = document.createElement("pre");
        mirror.className = "hl mirror";
        mirror.setAttribute("aria-hidden", "true");
        const ta = document.createElement("textarea");
        ta.spellcheck = false;
        ta.setAttribute("aria-label", "workflow YAML");
        ta.value = initial;
        const pop = document.createElement("div");
        pop.className = "ac hide";
        pop.setAttribute("role", "listbox");
        wrap.append(pre, mirror, ta, pop);

        let hlTimer = null;
        let composing = false;
        let escaped = false;
        let items = [];
        let sel = 0;
        let tokenStart = 0;
        let suffix = "";

        const paint = () => {
          pre.innerHTML = highlight(ta.value);
        };
        const refresh = () => {
          clearTimeout(hlTimer);
          if (composing) return;
          hlTimer = setTimeout(paint, 60);
        };
        const lineHeight = () => parseFloat(getComputedStyle(ta).lineHeight) || 22;

        function hideAc() {
          pop.classList.add("hide");
          items = [];
        }

        function acOpen() {
          return !pop.classList.contains("hide");
        }

        function context() {
          const v = ta.value;
          const p = ta.selectionStart;
          if (p !== ta.selectionEnd) return null;
          const ls = v.lastIndexOf("\n", p - 1) + 1;
          const line = v.slice(ls, p);
          if (line.includes("#")) return null;
          const named = /^\s*(?:-\s+)?(agent|use)\s*:\s*(\S*)$/.exec(line);
          if (named) {
            const pool =
              named[1] === "agent" || named[1] === "using"
                ? state.profiles
                : state.entries.map((e) => e.name);
            return { start: p - named[2].length, prefix: named[2], pool, suffix: "" };
          }
          const key = /^(\s*)(-\s+)?([a-z][a-z0-9_.]*)?$/.exec(line);
          if (!key) return null;
          const prefix = key[3] || "";
          if (!prefix) return null;
          const pool = key[1].length === 0 && !key[2] ? TOP_KEYS : STEP_KEYS;
          return { start: p - prefix.length, prefix, pool, suffix: ": " };
        }

        function caretTop() {
          mirror.textContent = ta.value.slice(0, ta.selectionStart);
          const mark = document.createElement("span");
          mark.textContent = "\u200b";
          mirror.appendChild(mark);
          return { top: mark.offsetTop, left: mark.offsetLeft };
        }

        function paintAc() {
          pop.innerHTML = "";
          items.forEach((it, i) => {
            const row = document.createElement("div");
            row.textContent = it;
            row.setAttribute("role", "option");
            row.className = i === sel ? "on" : "";
            row.onmousedown = (e) => {
              e.preventDefault();
              sel = i;
              accept();
            };
            pop.appendChild(row);
          });
          pop.classList.remove("hide");
          const box = caretTop();
          const lh = lineHeight();
          let top = box.top - ta.scrollTop + lh;
          if (top + pop.offsetHeight > wrap.clientHeight)
            top = box.top - ta.scrollTop - pop.offsetHeight;
          pop.style.top = Math.max(0, top) + "px";
          pop.style.left = Math.max(0, Math.min(box.left, wrap.clientWidth - 200)) + "px";
        }

        function suggest() {
          const c = context();
          if (!c) return hideAc();
          const list = c.pool.filter((x) => x.startsWith(c.prefix) && x !== c.prefix);
          if (!list.length) return hideAc();
          items = list.slice(0, 8);
          sel = 0;
          tokenStart = c.start;
          suffix = c.suffix;
          paintAc();
        }

        // execCommand keeps the native undo stack alive; setting .value directly would wipe it.
        function accept() {
          const val = items[sel];
          if (val == null) return;
          ta.focus();
          ta.setSelectionRange(tokenStart, ta.selectionStart);
          document.execCommand("insertText", false, val + suffix);
          hideAc();
        }

        function indent(back) {
          const v = ta.value;
          const a = ta.selectionStart;
          const b = ta.selectionEnd;
          if (a === b && !back) {
            document.execCommand("insertText", false, "  ");
            return;
          }
          const ls = v.lastIndexOf("\n", a - 1) + 1;
          let le = v.indexOf("\n", b);
          if (le < 0) le = v.length;
          const next = v
            .slice(ls, le)
            .split("\n")
            .map((l) => (back ? l.replace(/^ {1,2}/, "") : "  " + l))
            .join("\n");
          ta.setSelectionRange(ls, le);
          document.execCommand("insertText", false, next);
          ta.setSelectionRange(ls, ls + next.length);
        }

        function newline() {
          const v = ta.value;
          const p = ta.selectionStart;
          const line = v.slice(v.lastIndexOf("\n", p - 1) + 1, p);
          const lead = /^[ \t]*/.exec(line)[0];
          document.execCommand(
            "insertText",
            false,
            "\n" + lead + (/[:-]\s*$/.test(line) ? "  " : ""),
          );
        }

        ta.addEventListener("keydown", (e) => {
          if (acOpen()) {
            if (e.key === "ArrowDown" || e.key === "ArrowUp") {
              e.preventDefault();
              sel = (sel + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length;
              paintAc();
              return;
            }
            if (e.key === "Enter" || e.key === "Tab") {
              e.preventDefault();
              accept();
              return;
            }
            if (e.key === "Escape") {
              e.preventDefault();
              hideAc();
              return;
            }
          }
          if (e.key === "Escape") {
            escaped = true; // Escape then Tab moves focus out instead of indenting
            return;
          }
          if (e.key === "Tab") {
            if (escaped) {
              escaped = false;
              return;
            }
            e.preventDefault();
            indent(e.shiftKey);
            return;
          }
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            newline();
            return;
          }
          escaped = false;
        });

        ta.addEventListener("input", () => {
          refresh();
          suggest();
          onInput();
        });
        ta.addEventListener("compositionstart", () => {
          composing = true;
        });
        ta.addEventListener("compositionend", () => {
          composing = false;
          refresh();
        });
        ta.addEventListener("scroll", () => {
          pre.scrollTop = ta.scrollTop;
          pre.scrollLeft = ta.scrollLeft;
        });
        ta.addEventListener("blur", hideAc);
        paint();

        return {
          wrap,
          ta,
          setValue(text) {
            ta.value = text;
            hideAc();
            paint();
          },
          gotoLine(i) {
            const lines = ta.value.split("\n");
            if (i < 0 || i >= lines.length) return;
            let start = 0;
            for (let k = 0; k < i; k++) start += lines[k].length + 1;
            ta.focus();
            ta.setSelectionRange(start, start + lines[i].length);
            ta.scrollTop = Math.max(0, i * lineHeight() - ta.clientHeight / 2);
            pre.scrollTop = ta.scrollTop;
          },
        };
      }

      // "buffer.yaml, step 2, run: …" → the 0-based line of that step (and its key, when named).
      function errorLine(text, err) {
        const sm = /\bstep (\d+)/.exec(err || "");
        if (!sm) return -1;
        const lines = text.split("\n");
        const want = Number(sm[1]);
        let inSteps = false;
        let seen = 0;
        let at = -1;
        for (let i = 0; i < lines.length && at < 0; i++) {
          if (/^steps:/.test(lines[i])) inSteps = true;
          else if (!inSteps) continue;
          else if (/^\S/.test(lines[i])) inSteps = false;
          else if (/^\s*-\s/.test(lines[i]) && ++seen === want) at = i;
        }
        if (at < 0) return -1;
        const km = /\bstep \d+, ([a-z_][a-z0-9_.]*):/.exec(err);
        if (!km) return at;
        const keyRe = new RegExp("(^|-\\s+)" + km[1].replace(/\./g, "\\.") + "\\s*:");
        for (let i = at; i < lines.length; i++) {
          if (i > at && /^\s*-\s/.test(lines[i])) break;
          if (keyRe.test(lines[i])) return i;
        }
        return at;
      }

      function renderEditor(name, scope, text, loadError) {
        const pane = $("pane");
        pane.innerHTML = "";
        editorDirty = false;
        editorFileText = text;
        let mode = "text";
        let extras = {}; // inputs / on_error carried through canvas mode untouched
        let validateTimer = null;
        let syncTimer = null;
        let syncSeq = 0;

        const nameIn = document.createElement("input");
        nameIn.placeholder = "name";
        nameIn.value = name;
        const scopeSel = mkScopeSelect(scope);

        const modeSeg = document.createElement("div");
        modeSeg.className = "seg";
        const textBtn = mkBtn("yaml", () => setMode("text"));
        const visBtn = mkBtn("canvas", () => setMode("visual"));
        textBtn.classList.add("on");
        modeSeg.append(textBtn, visBtn);

        const addbar = document.createElement("div");
        addbar.className = "addbar";
        const addCap = document.createElement("span");
        addCap.className = "cap";
        addCap.textContent = "append";
        addbar.appendChild(addCap);
        for (const verb of VERBS) addbar.appendChild(mkBtn("+ " + verb, () => addStep(verb)));

        const bar1 = document.createElement("div");
        bar1.className = "bar";
        bar1.append(nameIn, scopeSel, modeSeg, addbar);

        const ed = mkCodeEditor(text, () => {
          editorDirty = true;
          runValidate();
        });
        const ta = ed.ta;

        const canvasHost = document.createElement("div");
        canvasHost.className = "canvas hide";
        const canvas = makeCanvas(
          canvasHost,
          () => scheduleSync(),
          () => "When you run: hwf run " + (nameIn.value.trim() || "<name>"),
        );

        const status = document.createElement("div");
        status.className = "status";

        function runValidate() {
          clearTimeout(validateTimer);
          validateTimer = setTimeout(async () => {
            const r = await api("/api/validate", {
              method: "POST",
              body: JSON.stringify({ name: nameIn.value.trim() || "buffer", text: ta.value }),
            });
            if (!ta.isConnected) return; // editor was replaced while the request was in flight
            showProblem(r.data.ok, r.data.ok ? "valid" : r.data.error);
          }, 350);
        }

        function showProblem(ok, msg) {
          const line = ok ? -1 : errorLine(ta.value, msg);
          setStatus(status, ok, msg, line < 0 ? null : () => ed.gotoLine(line));
        }

        function addStep(verb) {
          let t = ta.value.replace(/\s+$/, "");
          if (!/^steps:/m.test(t)) t = (t ? t + "\n" : "") + "steps:";
          ed.setValue(t + "\n\n" + SKELETONS[verb] + "\n");
          editorDirty = true;
          ta.focus();
          ta.setSelectionRange(ta.value.length, ta.value.length);
          runValidate();
        }

        async function setMode(next) {
          if (next === mode) return;
          if (next === "visual") {
            const r = await api("/api/parse", {
              method: "POST",
              body: JSON.stringify({ text: ta.value }),
            });
            if (!r.data.ok) {
              showProblem(
                false,
                "fix YAML before canvas edit — " + (r.data.error || "parse failed"),
              );
              return;
            }
            extras = {};
            if (r.data.doc.desc) extras.desc = r.data.doc.desc;
            if (r.data.doc.hidden) extras.hidden = r.data.doc.hidden;
            if (r.data.doc.inputs) extras.inputs = r.data.doc.inputs;
            if (r.data.doc.on_error) extras.on_error = r.data.doc.on_error;
            canvasHost.classList.remove("hide");
            canvas.load(r.data.doc.steps);
          } else if (!(await syncFromCanvas())) {
            return; // stale YAML would wipe the node edits on the way back in
          }
          mode = next;
          editorMode = next;
          textBtn.classList.toggle("on", mode === "text");
          visBtn.classList.toggle("on", mode === "visual");
          ed.wrap.classList.toggle("hide", mode !== "text");
          addbar.classList.toggle("hide", mode !== "text");
          canvasHost.classList.toggle("hide", mode !== "visual");
        }

        function scheduleSync() {
          clearTimeout(syncTimer);
          syncTimer = setTimeout(() => syncFromCanvas(), 300);
        }

        // Canvas → raw steps → server format → back into the shared YAML buffer, then validate.
        async function syncFromCanvas() {
          clearTimeout(syncTimer);
          const built = canvas.steps();
          if (built.error) {
            setStatus(status, false, built.error);
            return false;
          }
          if (built.steps.length === 0) {
            setStatus(status, "info", "no steps yet — add your first step on the canvas");
            return false;
          }
          const seq = ++syncSeq;
          const r = await api("/api/format", {
            method: "POST",
            body: JSON.stringify({ doc: Object.assign({}, extras, { steps: built.steps }) }),
          });
          if (seq !== syncSeq || !ta.isConnected) return false; // a newer sync already won
          if (!r.data.ok) {
            setStatus(status, false, r.data.error || "format failed");
            return false;
          }
          ed.setValue(r.data.text);
          editorDirty = true;
          runValidate();
          return true;
        }

        const bar2 = document.createElement("div");
        bar2.className = "bar";
        const save = mkBtn("save", async () => {
          if (mode === "visual" && !(await syncFromCanvas())) return;
          const newName = nameIn.value.trim();
          const newScope = scopeSel.value;
          const r = await api("/api/workflow", {
            method: "PUT",
            body: JSON.stringify({ name: newName, scope: newScope, text: ta.value }),
          });
          if (!r.data.ok) {
            showProblem(false, r.data.error || "save failed");
            toast("not saved — " + (r.data.error || "save failed"), false);
            return;
          }
          editorDirty = false;
          // Renamed or re-scoped: drop the previous file so a save doesn't silently fork.
          if (name && (name !== newName || scope !== newScope)) {
            await api("/api/workflow", { method: "DELETE", body: JSON.stringify({ name, scope }) });
          }
          toast("saved " + newName, true);
          await loadState();
          await openWorkflow(newName, newScope);
        });
        save.className = "primary";
        const copy = mkBtn("copy", () => {
          navigator.clipboard.writeText(ta.value).then(
            () => toast("YAML copied to clipboard", true),
            (e) => toast("copy failed — " + errMsg(e), false),
          );
        });
        const download = mkBtn("download", () => {
          const blob = new Blob([ta.value], { type: "text/yaml" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = (nameIn.value.trim() || "workflow") + ".yaml";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        });
        bar2.append(save, copy, download);

        const entry = state.entries.find((e) => e.name === name);
        const inBoth = !!entry && entry.inRepo && entry.inGlobal;

        // Move (copy to the other scope, then drop the source) only when the name lives in one scope;
        // when it exists in both, a move would clobber, so no button.
        if (entry && !inBoth) {
          const otherLabel = (s) => (s === "repo" ? "global" : "local");
          const move = mkBtn("", async () => {
            const fromScope = scopeSel.value;
            const to = fromScope === "repo" ? "global" : "repo";
            const mvName = nameIn.value.trim();
            const p = await api("/api/promote", {
              method: "POST",
              body: JSON.stringify({ name: mvName, from: fromScope, to }),
            });
            if (!p.data.ok) {
              setStatus(status, false, p.data.error || "move failed");
              return;
            }
            await api("/api/workflow", {
              method: "DELETE",
              body: JSON.stringify({ name: mvName, scope: fromScope }),
            });
            editorDirty = false;
            toast("moved to " + otherLabel(fromScope), true);
            await loadState();
            await openWorkflow(mvName, to);
          });
          const syncMoveLabel = () => {
            move.textContent = "move to " + otherLabel(scopeSel.value);
          };
          scopeSel.addEventListener("change", syncMoveLabel);
          syncMoveLabel();
          bar2.appendChild(move);
        }

        async function dropScopes(scopes) {
          for (const s of scopes)
            await api("/api/workflow", {
              method: "DELETE",
              body: JSON.stringify({ name, scope: s }),
            });
          editorDirty = false;
          current = null;
          toast("deleted " + name, true);
          await loadState();
        }

        // Delete: when the name exists in both scopes, let the user pick which variant(s) to remove.
        if (inBoth) {
          const delSel = document.createElement("select");
          for (const [val, lbl] of [
            ["repo", "local"],
            ["global", "global"],
            ["both", "both"],
          ]) {
            const o = document.createElement("option");
            o.value = val;
            o.textContent = lbl;
            delSel.appendChild(o);
          }
          const del = mkBtn("delete", () => {
            const which = delSel.value;
            if (!confirm("delete " + name + " (" + (which === "repo" ? "local" : which) + ")?"))
              return;
            dropScopes(which === "both" ? ["repo", "global"] : [which]);
          });
          bar2.append(delSel, del);
        } else {
          const del = mkBtn("delete", () => {
            if (!confirm("delete " + name + "?")) return;
            dropScopes([scope]);
          });
          bar2.appendChild(del);
        }

        const foot = document.createElement("div");
        foot.className = "hint";
        foot.append("run in a terminal: ");
        const footCmd = document.createElement("code");
        foot.append(footCmd, " (no run from browser)");
        const setFoot = () => {
          footCmd.textContent = "hwf run " + (nameIn.value.trim() || "<name>");
          canvas.setTrigger("When you run: hwf run " + (nameIn.value.trim() || "<name>"));
        };
        setFoot();
        nameIn.oninput = () => {
          editorDirty = true;
          setFoot();
        };

        pane.append(bar1, ed.wrap, canvasHost, status, bar2, foot);

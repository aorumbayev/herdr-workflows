          if (dy > 0 && view.y + b.maxY * view.z > r.height) return true;
          if (dy < 0 && view.y + b.minY * view.z < 0) return true;
          if (dx > 0 && view.x + b.maxX * view.z > r.width) return true;
          if (dx < 0 && view.x + b.minX * view.z < 0) return true;
          return false;
        }

        root.addEventListener(
          "wheel",
          (e) => {
            if (e.ctrlKey || e.metaKey) {
              e.preventDefault();
              zoomAt(Math.exp(-e.deltaY / 300), e.clientX, e.clientY);
              return;
            }
            if (!canPan(e.deltaX, e.deltaY)) return;
            e.preventDefault();
            view.x -= e.deltaX;
            view.y -= e.deltaY;
            applyView();
          },
          { passive: false },
        );

        root.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            if (palette) {
              e.preventDefault();
              closePalette();
            } else if (!tip.hidden) {
              e.preventDefault();
              setTipOpen(false);
            } else if (expanded && !ndv) {
              e.preventDefault();
              setExpanded(false);
            }
            return;
          }
          if (ndv || e.target.closest("input, textarea, select, .palette")) return;
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") {
            e.preventDefault();
            if (e.shiftKey) redo();
            else undo();
            return;
          }
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "y") {
            e.preventDefault();
            redo();
            return;
          }
          if ((e.key === "Delete" || e.key === "Backspace") && selected) {
            e.preventDefault();
            remove(selected);
          }
        });

        function zoomAt(factor, clientX, clientY) {
          const r = root.getBoundingClientRect();
          const cx = clientX === undefined ? r.width / 2 : clientX - r.left;
          const cy = clientY === undefined ? r.height / 2 : clientY - r.top;
          const z = clamp(view.z * factor, 0.25, 2.5);
          const k = z / view.z;
          view.x = cx - (cx - view.x) * k;
          view.y = cy - (cy - view.y) * k;
          view.z = z;
          applyView();
          rescalePlus();
        }

        function fit() {
          const r = root.getBoundingClientRect();
          if (!r.width) return;
          const b = bounds();
          const z = clamp(
            Math.min((r.width - 120) / (b.maxX - b.minX), (r.height - 120) / (b.maxY - b.minY)),
            0.25,
            1.2,
          );
          view.z = z;
          view.x = (r.width - (b.maxX - b.minX) * z) / 2 - b.minX * z;
          view.y = (r.height - (b.maxY - b.minY) * z) / 2 - b.minY * z;
          applyView();
          rescalePlus();
        }

        const zoombar = document.createElement("div");
        zoombar.className = "zoombar";
        for (const item of [
          { label: "−", name: "Zoom out", fn: () => zoomAt(1 / 1.2) },
          {
            label: Math.round(view.z * 100) + "%",
            name: "Reset zoom",
            pct: true,
            fn: () => zoomAt(1 / view.z),
          },
          { label: "+", name: "Zoom in", fn: () => zoomAt(1.2) },
        ]) {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = item.label;
          b.title = item.name;
          b.setAttribute("aria-label", item.name);
          b.onclick = item.fn;
          if (item.pct) zoomPct = b;
          zoombar.appendChild(b);
        }
        root.appendChild(zoombar);

        const viewbar = document.createElement("div");
        viewbar.className = "viewbar";
        const addBtn = document.createElement("button");
        addBtn.type = "button";
        addBtn.textContent = "+";
        addBtn.title = "Add step";
        addBtn.setAttribute("aria-label", "Add step");
        addBtn.onclick = () => openPalette(null);
        viewbar.appendChild(addBtn);
        for (const item of [
          { label: "⤢", name: "Fit canvas", fn: fit },
          { label: "⛶", name: "Expand canvas", expand: true },
        ]) {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = item.label;
          b.title = item.name;
          b.setAttribute("aria-label", item.name);
          if (item.expand) {
            expandBtn = b;
            b.setAttribute("aria-pressed", "false");
            b.onclick = () => setExpanded(!expanded);
          } else {
            b.onclick = item.fn;
          }
          viewbar.appendChild(b);
        }
        const tipBtnEl = document.createElement("button");
        tipBtnEl.type = "button";
        tipBtnEl.textContent = "?";
        tipBtnEl.title = "Keyboard shortcuts";
        tipBtnEl.setAttribute("aria-label", "Keyboard shortcuts");
        tipBtnEl.setAttribute("aria-expanded", "false");
        tipBtnEl.onclick = () => setTipOpen(tip.hidden);
        tipBtn = tipBtnEl;
        viewbar.appendChild(tipBtnEl);
        root.appendChild(viewbar);

        function setExpanded(on) {
          if (on === expanded) return;
          expanded = on;
          root.classList.toggle("expanded", on);
          document.body.classList.toggle("canvas-expanded", on);
          if (expandBtn) {
            const name = on ? "Exit expanded canvas" : "Expand canvas";
            expandBtn.setAttribute("aria-label", name);
            expandBtn.setAttribute("aria-pressed", on ? "true" : "false");
            expandBtn.title = name;
          }
          if (!on && expandBtn) expandBtn.focus();
          requestAnimationFrame(fit);
        }

        function closeNdv() {
          if (!ndv) return;
          const n = ndv.node;
          const changed = ndv.isNew || JSON.stringify(n.form) !== ndv.initialForm;
          ndv.wrap.remove();
          ndv = null;
          relabel(n);
          draw();
          if (changed) onChange();
        }

        function trapTab(wrap, e) {
          const f = wrap.querySelectorAll("input, select, textarea, button");
          if (!f.length) return;
          const first = f[0];
          const last = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }

        // Node parameters, n8n's detail view: fields come from the served schema, words from
        // FIELD_INFO, and messages from the loader. Edits write straight into the node's form.
        function openNdv(n, opts) {
          closeNdv();
          const isNew = !!(opts && opts.skipSnap);
          const initialForm = JSON.stringify(n.form);
          let snapped = isNew;
          const t = NODE_TYPES[n.verb];
          const wrap = document.createElement("div");
          wrap.className = "ndv";
          wrap.setAttribute("role", "dialog");
          wrap.setAttribute("aria-modal", "true");
          wrap.setAttribute("aria-label", nodeTitle(n.verb, n.form));
          const panel = document.createElement("div");
          panel.className = "panel";
          panel.style.setProperty("--tint", t.tint);
          const head = document.createElement("div");
          head.className = "head";
          const icon = document.createElement("span");
          icon.className = "icon";
          icon.textContent = t.icon;
          const nameIn = document.createElement("input");
          nameIn.placeholder = "step id (optional)";
          nameIn.setAttribute("aria-label", "step id");
          nameIn.value = n.form.id || "";
          head.append(icon, nameIn);
          panel.appendChild(head);
          ndv = {
            wrap,
            node: n,
            initialForm,
            isNew,
            fields: {},
            sections: {},
            refreshParams: null,
            ensureSnap: () => {
              if (snapped) return;
              snap();
              snapped = true;
            },
          };
          nameIn.oninput = () => {
            ndv.ensureSnap();
            n.form.id = nameIn.value;
            relabel(n);
          };

          const keptKeys = Object.keys(n.extra);
          if (keptKeys.length) {
            const kept = document.createElement("p");
            kept.className = "kept";
            kept.textContent = "⚙ kept from YAML, edit in yaml mode: " + keptKeys.join(", ");
            panel.appendChild(kept);
          }

          buildSections(panel, n);

          const done = document.createElement("button");
          done.textContent = "back to canvas";
          done.onclick = closeNdv;
          panel.appendChild(done);

          wrap.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              closeNdv();
              return;
            }
            if (e.key === "Tab") trapTab(wrap, e);
          });
          wrap.onpointerdown = (e) => {
            e.stopPropagation();
            if (e.target === wrap) closeNdv();
          };
          wrap.appendChild(panel);
          root.appendChild(wrap);
          paintNdvIssues();
          nameIn.focus();
        }

        // One disclosure per authoring question, collapsed while everything in it is unset.
        function buildSections(panel, n) {
          const fields = stepFields(stepSchemaProps(), n.verb);
          for (const sec of SECTIONS) {
            const mine = fields.filter((f) => f.group === sec.id);
            if (!mine.length) continue;
            const box = document.createElement("div");
            box.className = "sec";
            const head = document.createElement("button");
            head.type = "button";
            head.className = "sechead";
            const title = document.createElement("span");
            title.textContent = sec.title;
            const sum = document.createElement("span");
            sum.className = "sum";
            head.append(title, sum);
            const body = document.createElement("div");
            body.className = "secbody";
            for (const f of mine) body.appendChild(renderField(f, n));
            const open = (on) => {
              head.setAttribute("aria-expanded", on ? "true" : "false");
              body.classList.toggle("hide", !on);
            };
            open(sectionSummary(mine, n.form).length > 0);
            head.onclick = () => open(head.getAttribute("aria-expanded") !== "true");
            box.append(head, body);
            panel.appendChild(box);
            ndv.sections[sec.id] = { head, sum, open, fields: mine };
          }
          refreshSummaries();
        }

        function refreshSummaries() {
          if (!ndv) return;
          for (const id of Object.keys(ndv.sections)) {
            const sec = ndv.sections[id];
            const bits = sectionSummary(sec.fields, ndv.node.form);
            sec.sum.textContent = bits.length ? bits.join(", ") : "not set";
          }
        }

        const COMPOSITE = ["map", "textOrList", "params"];

        function renderField(f, n) {
          const composite = COMPOSITE.includes(f.widget.kind);
          const box = document.createElement(composite ? "div" : "label");
          box.className = "field" + (f.widget.kind === "check" ? " inline" : "");
          const cap = document.createElement("span");
          cap.className = "cap";
          cap.textContent = f.label;
          const write = (v) => {
            ndv.ensureSnap();
            n.form[f.key] = v;
            relabel(n);
            refreshSummaries();
          };
          const control = controlFor(f, n, write);
          if (f.widget.kind === "check") box.append(control, cap);
          else box.append(cap, control);
          if (f.help) {
            const help = document.createElement("small");
            help.className = "help";
            help.textContent = f.help;
            box.appendChild(help);
          }
          const err = document.createElement("p");
          err.className = "ferr hide";
          box.appendChild(err);
          ndv.fields[f.key] = { wrap: box, err };
          return box;
        }

        function controlFor(f, n, write) {
          const kind = f.widget.kind;
          if (kind === "check") return checkControl(f, n, write);
          if (kind === "enum") return enumControl(f, n, write);
          if (kind === "enumText") return attachList(textInput(f, n, write), f.widget.options);
          if (kind === "number") return numberControl(f, n, write);
          if (kind === "map") return mapControl(f, n, write);
          if (kind === "textOrList") return textOrListControl(f, n, write);
          if (kind === "params") return paramsControl(f, n);
          if (kind === "list" || kind === "json") return areaControl(f, n, write);
          if (f.key === "herdr") return methodControl(f, n, write);
          if (f.key === n.verb) return areaControl(f, n, write);
          const el = textInput(f, n, write);
          const hints = SUGGESTIONS[f.key] ? SUGGESTIONS[f.key]() : [];
          return hints.length ? attachList(el, hints) : el;
        }

        function textInput(f, n, write) {
          const el = document.createElement("input");
          el.value = n.form[f.key] || "";
          el.oninput = () => write(el.value);
          return el;
        }

        function areaControl(f, n, write) {
          const el = document.createElement("textarea");
          el.value = n.form[f.key] || "";
          el.oninput = () => write(el.value);
          return el;
        }

        function checkControl(f, n, write) {
          const el = document.createElement("input");
          el.type = "checkbox";
          el.checked = n.form[f.key] === true;
          el.onchange = () => write(el.checked);
          return el;
        }

        function enumControl(f, n, write) {
          const el = document.createElement("select");
          const cur = String(n.form[f.key] ?? "");
          const options = [""].concat(f.widget.options);
          if (cur && !options.includes(cur)) options.push(cur);
          for (const o of options) {
            const opt = document.createElement("option");
            opt.value = o;
            opt.textContent = o || "—";
            if (o === cur) opt.selected = true;
            el.appendChild(opt);
          }
          el.onchange = () => write(el.value);
          return el;
        }

        function numberControl(f, n, write) {
          const el = document.createElement("input");
          el.type = "number";
          if (f.widget.min !== undefined) el.min = String(f.widget.min);
          if (f.widget.max !== undefined) el.max = String(f.widget.max);
          if (f.widget.integer) el.step = "1";
          el.value = n.form[f.key] || "";
          el.oninput = () => write(el.value);
          return el;
        }

        function attachList(el, options) {
          dlSeq += 1;
          const id = "hwf-dl-" + dlSeq;
          const dl = document.createElement("datalist");
          dl.id = id;
          for (const o of options) {
            const opt = document.createElement("option");
            opt.value = o;
            dl.appendChild(opt);
          }
          el.setAttribute("list", id);
          const box = document.createElement("span");
          box.className = "withlist";
          box.append(el, dl);
          return box;
        }

        function mapControl(f, n, write) {
          const box = document.createElement("div");
          box.className = "rows";
          const rows = () => (Array.isArray(n.form[f.key]) ? n.form[f.key] : []);
          const paint = () => {
            box.innerHTML = "";
            rows().forEach((row, i) => box.appendChild(mapRow(f, row, i, rows, write, paint)));
            const add = document.createElement("button");
            add.type = "button";
            add.textContent = "+ add";
            add.onclick = () => {
              write(rows().concat([{ k: "", v: "" }]));
              paint();
            };
            box.appendChild(add);
          };
          paint();
          return box;
        }

        function mapRow(f, row, i, rows, write, paint) {
          const line = document.createElement("div");
          line.className = "row2";
          const commit = (k, v) => write(rows().map((r, j) => (j === i ? { k, v } : r)));
          const name = document.createElement("input");
          name.value = row.k;
          name.placeholder = "name";
          name.setAttribute("aria-label", f.label + " name");
          const value = document.createElement("input");
          value.value = row.v;
          value.placeholder = "value";
          value.setAttribute("aria-label", f.label + " value");
          name.oninput = () => commit(name.value, value.value);
          value.oninput = () => commit(name.value, value.value);
          const drop = document.createElement("button");
          drop.type = "button";
          drop.textContent = "✕";
          drop.setAttribute("aria-label", "remove " + f.label + " row");
          drop.onclick = () => {
            write(rows().filter((r, j) => j !== i));
            paint();
          };
          line.append(name, value, drop);
          return line;
        }

        // The two forms the schema accepts, offered explicitly instead of as JSON array text.
        function textOrListControl(f, n, write) {
          const box = document.createElement("div");
          box.className = "seg";
          const modeKey = f.key + MODE_SUFFIX;
          const el = document.createElement("textarea");
          el.value = n.form[f.key] || "";
          el.oninput = () => write(el.value);
          const bar = document.createElement("div");
          bar.className = "segbar";
          const labels =
            f.key === "run" ? { text: "shell", list: "argv" } : { text: "one", list: "list" };
          const btns = {};
          const setMode = (mode, snapshotFirst) => {
            if (snapshotFirst) ndv.ensureSnap();
            n.form[modeKey] = mode;
            for (const key of Object.keys(btns)) {
              btns[key].setAttribute("aria-pressed", key === mode ? "true" : "false");
              btns[key].classList.toggle("on", key === mode);
            }
            el.placeholder = mode === "list" ? "one entry per line" : "";
            if (snapshotFirst) {
              relabel(n);
              refreshSummaries();
            }
          };
          for (const mode of ["text", "list"]) {
            const b = document.createElement("button");
            b.type = "button";
            b.textContent = labels[mode];
            b.onclick = () => setMode(mode, true);
            btns[mode] = b;
            bar.appendChild(b);
          }
          setMode(n.form[modeKey] === "list" ? "list" : "text", false);
          box.append(bar, el);
          return box;
        }

        function methodControl(f, n, write) {
          const table = methodTable();
          const names = Object.keys(table);
          if (!names.length) return textInput(f, n, write);
          const el = document.createElement("select");
          const cur = String(n.form[f.key] ?? "");
          const options = [""].concat(names.sort());
          if (cur && !table[cur]) options.push(cur);
          for (const name of options) {
            const entry = table[name];
            const opt = document.createElement("option");
            opt.value = name;
            opt.textContent = name
              ? entry && entry.allowed === false
                ? name + " — unavailable"
                : name
              : "—";
            if (entry && entry.allowed === false) {
              opt.disabled = true;
              opt.title = entry.reason || "";
            }
            if (name === cur) opt.selected = true;
            el.appendChild(opt);
          }
          el.onchange = () => {
            write(el.value);
            if (ndv.refreshParams) ndv.refreshParams();
          };
          return el;
        }

        // Parameters of the selected method, from that method's own specification.
        function paramsControl(f, n) {
          const box = document.createElement("div");
          box.className = "rows";
          const paint = () => {
            box.innerHTML = "";
            const entry = methodTable()[String(n.form.herdr ?? "")];
            if (entry && entry.allowed === false) {
              const note = document.createElement("p");
              note.className = "kept";
              note.textContent = "⚠ unavailable — " + (entry.reason || "denied method");
              box.appendChild(note);
            }
            for (const pf of paramFields(entry)) {
              box.appendChild(
                renderField(
                  {
                    key: pf.key,
                    widget: pf.widget,
                    label: pf.required ? pf.name + " (required)" : pf.name,
                    help: "",
                  },
                  n,
                ),
              );
            }
            const open = !entry || entry.params.additionalProperties;
            if (open || String(n.form.params ?? "").trim())
              box.appendChild(
                renderField(
                  { key: "params", widget: { kind: "json" }, label: "params JSON", help: "" },
                  n,
                ),
              );
          };
          paint();
          ndv.refreshParams = paint;
          return box;
        }

        applyView();
        draw();

        return {
          load(steps) {
            closePalette();
            closeNdv();
            setExpanded(false);
            undos.length = 0;
            redos.length = 0;
            const props = stepSchemaProps();
            setNodes(
              steps.map((step, i) => {
                const verb = verbOf(step);
                return {
                  verb,
                  form: formFromStep(props, verb, step, methodTable()),
                  extra: extraOf(props, verb, step),
                  x: GAP_X * (i + 1),
                  y: 0,
                };
              }),
            );
            draw();
            fit();
            if (onHistory) onHistory();
          },
          steps() {
            const props = stepSchemaProps();
            const out = [];
            for (const n of ordered()) {
              const r = stepFromForm(props, n.verb, n.form, n.extra, methodTable());
              if (r.error) return { error: nodeTitle(n.verb, n.form) + ": " + r.error };
              out.push(r.step);
            }
            return { steps: out };
          },
          setIssues,
          setTrigger(label) {
            trigger.querySelector(".label").textContent = label;
          },
          undo,
          redo,
          canUndo() {
            return undos.length > 0;
          },
          canRedo() {
            return redos.length > 0;
          },
          setExpanded,
          onHistoryChange(fn) {
            onHistory = fn;
          },
        };
      }

      /* ---------- YAML syntax highlighting ---------- */

      const VERB_RE = /^(?:run|agent|herdr|workflow|[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)+)$/;
      const PH_RE = /\{\{[^}]+\}\}|context\.transcript(?:_file)?/g;
      const KV_RE = /^("[^"]*"|'[^']*'|[A-Za-z_][\w.-]*):(\s|$)/;

      function span(cls, text) {
        return '<span class="' + cls + '">' + esc(text) + "</span>";
      }

      function hlText(raw) {
        return esc(raw).replace(PH_RE, (m) => '<span class="tok-ph">' + m + "</span>");
      }

      function hlValue(raw) {
        const t = raw.trim();
        if (!t) return esc(raw);
        let cls = "";
        if (/^[|>][-+\d]*$/.test(t)) cls = "tok-blk";
        else if (/^"[\s\S]*"$/.test(t) || /^'[\s\S]*'$/.test(t)) cls = "tok-str";
        else if (/^(-?\d+(\.\d+)?|true|false|null|~)$/i.test(t)) cls = "tok-num";
        const inner = hlText(raw);
        return cls ? '<span class="' + cls + '">' + inner + "</span>" : inner;
      }

      function hlLine(line) {
        const lead = /^(\s*(?:-\s+)?)/.exec(line)[1];
        let rest = line.slice(lead.length);
        if (!rest) return esc(line);
        if (rest.startsWith("#")) return esc(lead) + span("tok-com", rest);
        // Trailing comments only when no quoting is in play, so `echo "# x"` stays intact.
        let trail = "";
        const hash = rest.indexOf(" #");
        if (hash >= 0 && !/["']/.test(rest.slice(0, hash))) {
          trail = span("tok-com", rest.slice(hash + 1));
          rest = rest.slice(0, hash + 1);
        }
        const kv = KV_RE.exec(rest);
        if (!kv) return esc(lead) + hlValue(rest) + trail;
        const cls = VERB_RE.test(kv[1]) ? "tok-verb" : "tok-key";
        return (
          esc(lead) +
          span(cls, kv[1]) +
          span("tok-pun", ":") +
          hlValue(rest.slice(kv[0].length - kv[2].length)) +
          trail
        );
      }

      // Trailing newline: without it the browser collapses the last line and the layers drift apart.
      function highlight(text) {
        return text.split("\n").map(hlLine).join("\n") + "\n";
      }

      function yamlBlock(text) {
        const pre = document.createElement("pre");
        pre.className = "yaml";
        pre.innerHTML = highlight(text || "");
        return pre;
      }

      /* ---------- YAML textarea: highlight + smart indent + autocomplete ---------- */

      function mkCodeEditor(initial, onInput) {
        const wrap = document.createElement("div");
        wrap.className = "ed";
        const pre = document.createElement("pre");
        pre.className = "hl";
        pre.setAttribute("aria-hidden", "true");
        const mirror = document.createElement("pre");
        mirror.className = "hl mirror";
        mirror.setAttribute("aria-hidden", "true");
        const ta = document.createElement("textarea");
        ta.spellcheck = false;
        ta.setAttribute("aria-label", "workflow YAML");
        ta.value = initial;
        const pop = document.createElement("div");
        pop.className = "ac hide";
        pop.setAttribute("role", "listbox");
        wrap.append(pre, mirror, ta, pop);

        let hlTimer = null;
        let composing = false;
        let escaped = false;
        let items = [];
        let sel = 0;
        let tokenStart = 0;
        let suffix = "";

        const paint = () => {
          pre.innerHTML = highlight(ta.value);
        };
        const refresh = () => {
          clearTimeout(hlTimer);
          if (composing) return;
          hlTimer = setTimeout(paint, 60);
        };
        const lineHeight = () => parseFloat(getComputedStyle(ta).lineHeight) || 22;

        function hideAc() {
          pop.classList.add("hide");
          items = [];
        }

        function acOpen() {
          return !pop.classList.contains("hide");
        }

        function context() {
          const v = ta.value;
          const p = ta.selectionStart;
          if (p !== ta.selectionEnd) return null;
          const ls = v.lastIndexOf("\n", p - 1) + 1;
          const line = v.slice(ls, p);
          if (line.includes("#")) return null;
          const named = /^\s*(?:-\s+)?(using|workflow)\s*:\s*(\S*)$/.exec(line);
          if (named) {
            const pool = named[1] === "using" ? state.profiles : state.entries.map((e) => e.name);
            return { start: p - named[2].length, prefix: named[2], pool, suffix: "" };
          }
          const tmpl = /\{\{([a-zA-Z0-9_.]*)$/.exec(line);
          if (tmpl) {
            return {
              start: p - tmpl[1].length,
              prefix: tmpl[1],
              pool: CONTEXT_HINTS.map((h) => h.replace(/^\{\{|\}\}$/g, "")),
              suffix: "}}",
            };
          }
          const key = /^(\s*)(-\s+)?([a-z][a-z0-9_.]*)?$/.exec(line);
          if (!key) return null;
          const prefix = key[3] || "";
          if (!prefix) return null;
          const pool = key[1].length === 0 && !key[2] ? TOP_KEYS : STEP_KEYS;
          return { start: p - prefix.length, prefix, pool, suffix: ": " };
        }

        function caretTop() {
          mirror.textContent = ta.value.slice(0, ta.selectionStart);
          const mark = document.createElement("span");
          mark.textContent = "\u200b";
          mirror.appendChild(mark);
          return { top: mark.offsetTop, left: mark.offsetLeft };
        }

        function paintAc() {
          pop.innerHTML = "";
          items.forEach((it, i) => {
            const row = document.createElement("div");
            row.textContent = it;
            row.setAttribute("role", "option");
            row.className = i === sel ? "on" : "";
            row.onmousedown = (e) => {
              e.preventDefault();
              sel = i;
              accept();
            };
            pop.appendChild(row);
          });
          pop.classList.remove("hide");
          const box = caretTop();
          const lh = lineHeight();
          let top = box.top - ta.scrollTop + lh;
          if (top + pop.offsetHeight > wrap.clientHeight)
            top = box.top - ta.scrollTop - pop.offsetHeight;
          pop.style.top = Math.max(0, top) + "px";
          pop.style.left = Math.max(0, Math.min(box.left, wrap.clientWidth - 200)) + "px";
        }

        function suggest() {
          const c = context();
          if (!c) return hideAc();
          const list = c.pool.filter((x) => x.startsWith(c.prefix) && x !== c.prefix);
          if (!list.length) return hideAc();
          items = list.slice(0, 8);
          sel = 0;
          tokenStart = c.start;
          suffix = c.suffix;
          paintAc();
        }

        // execCommand keeps the native undo stack alive; setting .value directly would wipe it.
        function accept() {
          const val = items[sel];
          if (val == null) return;
          ta.focus();
          ta.setSelectionRange(tokenStart, ta.selectionStart);
          document.execCommand("insertText", false, val + suffix);
          hideAc();
        }

        function indent(back) {
          const v = ta.value;
          const a = ta.selectionStart;
          const b = ta.selectionEnd;
          if (a === b && !back) {
            document.execCommand("insertText", false, "  ");
            return;
          }
          const ls = v.lastIndexOf("\n", a - 1) + 1;
          let le = v.indexOf("\n", b);
          if (le < 0) le = v.length;
          const next = v
            .slice(ls, le)
            .split("\n")
            .map((l) => (back ? l.replace(/^ {1,2}/, "") : "  " + l))
            .join("\n");
          ta.setSelectionRange(ls, le);
          document.execCommand("insertText", false, next);
          ta.setSelectionRange(ls, ls + next.length);
        }

        function newline() {
          const v = ta.value;
          const p = ta.selectionStart;
          const line = v.slice(v.lastIndexOf("\n", p - 1) + 1, p);
          const lead = /^[ \t]*/.exec(line)[0];
          document.execCommand(
            "insertText",
            false,
            "\n" + lead + (/[:-]\s*$/.test(line) ? "  " : ""),
          );
        }

        ta.addEventListener("keydown", (e) => {
          if (acOpen()) {
            if (e.key === "ArrowDown" || e.key === "ArrowUp") {
              e.preventDefault();
              sel = (sel + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length;
              paintAc();
              return;
            }
            if (e.key === "Enter" || e.key === "Tab") {
              e.preventDefault();
              accept();
              return;
            }
            if (e.key === "Escape") {
              e.preventDefault();
              hideAc();
              return;
            }
          }
          if (e.key === "Escape") {
            escaped = true; // Escape then Tab moves focus out instead of indenting
            return;
          }
          if (e.key === "Tab") {
            if (escaped) {
              escaped = false;
              return;
            }
            e.preventDefault();
            indent(e.shiftKey);
            return;
          }
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            newline();
            return;
          }
          escaped = false;
        });

        ta.addEventListener("input", () => {
          refresh();
          suggest();
          onInput();
        });
        ta.addEventListener("compositionstart", () => {
          composing = true;
        });
        ta.addEventListener("compositionend", () => {
          composing = false;
          refresh();
        });
        ta.addEventListener("scroll", () => {
          pre.scrollTop = ta.scrollTop;
          pre.scrollLeft = ta.scrollLeft;
        });
        ta.addEventListener("blur", hideAc);
        paint();

        return {
          wrap,
          ta,
          setValue(text) {
            ta.value = text;
            hideAc();
            paint();
          },
          gotoLine(i) {
            const lines = ta.value.split("\n");
            if (i < 0 || i >= lines.length) return;
            let start = 0;
            for (let k = 0; k < i; k++) start += lines[k].length + 1;
            ta.focus();
            ta.setSelectionRange(start, start + lines[i].length);
            ta.scrollTop = Math.max(0, i * lineHeight() - ta.clientHeight / 2);
            pre.scrollTop = ta.scrollTop;
          },
        };
      }

      // "buffer.yaml, step 2, run: …" → the 0-based line of that step (and its key, when named).
      function errorLine(text, err) {
        const sm = /\bstep (\d+)/.exec(err || "");
        if (!sm) return -1;
        const lines = text.split("\n");
        const want = Number(sm[1]);
        let inSteps = false;
        let seen = 0;
        let at = -1;
        for (let i = 0; i < lines.length && at < 0; i++) {
          if (/^steps:/.test(lines[i])) inSteps = true;
          else if (!inSteps) continue;
          else if (/^\S/.test(lines[i])) inSteps = false;
          else if (/^\s*-\s/.test(lines[i]) && ++seen === want) at = i;
        }
        if (at < 0) return -1;
        const km = /\bstep \d+, ([a-z_][a-z0-9_.]*):/.exec(err);
        if (!km) return at;
        const keyRe = new RegExp("(^|-\\s+)" + km[1].replace(/\./g, "\\.") + "\\s*:");
        for (let i = at; i < lines.length; i++) {
          if (i > at && /^\s*-\s/.test(lines[i])) break;
          if (keyRe.test(lines[i])) return i;
        }
        return at;
      }

      function renderEditor(name, scope, text, loadError, flags, base) {
        const pane = $("pane");
        pane.innerHTML = "";
        document.body.classList.remove("canvas-expanded");
        editorDirty = false;
        editorFileText = text;
        let savedName = name;
        let savedScope = scope;
        let savedText = text;
        let sourceName = name;
        let sourceScope = scope;
        let sourceBase = base;
        let canvasPending = false;
        let mode = "text";
        let extras = { version: "v1alpha1" }; // metadata carried through canvas mode untouched
        let validateTimer = null;
        let syncTimer = null;
        let syncSeq = 0;

        const nameIn = document.createElement("input");
        nameIn.placeholder = "name";
        nameIn.value = name;
        const scopeSel = mkScopeSelect(scope);

        const modeSeg = document.createElement("div");
        modeSeg.className = "seg";
        const textBtn = mkBtn("yaml", () => setMode("text"));
        const visBtn = mkBtn("canvas", () => setMode("visual"));
        textBtn.classList.add("on");
        modeSeg.append(textBtn, visBtn);

        const stepMenu = mkMenu(
          "+ step",
          VERBS.map((verb) => ({ label: "+ " + verb, fn: () => addStep(verb) })),
        );

        const flagBox = document.createElement("span");
        flagBox.className = "chip";
        function paintFlags(list) {
          const items = list || [];
          if (!items.length) {
            flagBox.classList.remove("warn");
            flagBox.textContent = "";
            flagBox.classList.add("hide");
            return;
          }
          flagBox.classList.remove("hide");
          flagBox.classList.add("warn");
          flagBox.textContent = "sensitive: " + items.join(" · ");
        }
        paintFlags(flags);

        const spacer = document.createElement("span");
        spacer.className = "bar-spacer";

        const ed = mkCodeEditor(text, () => {
          refreshDirty();
          runValidate();
        });
        const ta = ed.ta;

        const canvasHost = document.createElement("div");
        canvasHost.className = "canvas hide";
        const canvas = makeCanvas(
          canvasHost,
          () => {
            canvasPending = true;
            refreshDirty();
            scheduleSync();
          },
          () => "When you run: hwf run " + (nameIn.value.trim() || "<name>"),
        );

        const status = document.createElement("div");
        status.className = "status";

        const unsaved = document.createElement("span");
        unsaved.className = "unsaved hide";
        unsaved.setAttribute("role", "status");
        unsaved.textContent = "unsaved changes";

        const undoBtn = mkBtn("↶", () => doHistory("undo"));
        undoBtn.classList.add("hist");
        undoBtn.setAttribute("aria-label", "Undo");
        const redoBtn = mkBtn("↷", () => doHistory("redo"));
        redoBtn.classList.add("hist");
        redoBtn.setAttribute("aria-label", "Redo");

        // Narrow viewports hide the bar pair and show these instead; they share its enabled state.
        const histItems = [
          { label: "undo", fn: () => doHistory("undo"), className: "hist-item", pair: undoBtn },
          { label: "redo", fn: () => doHistory("redo"), className: "hist-item", pair: redoBtn },
        ];

        function refreshDirty() {
          const dirty =
            canvasPending ||
            nameIn.value.trim() !== savedName ||
            scopeSel.value !== savedScope ||
            ta.value !== savedText;
          editorDirty = dirty;
          unsaved.classList.toggle("hide", !dirty);
          save.classList.toggle("hide", !dirty);
          updateHistoryBtns();
        }

        function updateHistoryBtns() {
          if (mode === "visual") {
            undoBtn.disabled = !canvas.canUndo();
            redoBtn.disabled = !canvas.canRedo();
          } else {
            undoBtn.disabled = false;
            redoBtn.disabled = false;
          }
          for (const item of histItems) {
            if (item.el) item.el.disabled = item.pair.disabled;
          }
        }

        function doHistory(kind) {
          if (mode === "visual") {
            if (kind === "undo") canvas.undo();
            else canvas.redo();
            return;
          }
          ta.focus();
          document.execCommand(kind);
          refreshDirty();
        }

        canvas.onHistoryChange(updateHistoryBtns);

        function runValidate() {
          clearTimeout(validateTimer);
          validateTimer = setTimeout(async () => {
            const r = await api("/api/validate", {
              method: "POST",
              body: JSON.stringify({ name: nameIn.value.trim() || "buffer", text: ta.value }),
            });
            if (!ta.isConnected) return; // editor was replaced while the request was in flight
            showProblem(r.data.ok, r.data.ok ? "" : r.data.error);
            const t = ta.value;
            const next = [];
            if (/^\s*-\s*run\s*:/m.test(t) || /\n\s*-\s*run\s*:/.test(t)) next.push("commands");
            if (/context\.transcript(?:_file)?/.test(t)) next.push("transcript");
            for (const m of t.matchAll(/^\s*herdr:\s*(\S+)/gm)) {
              const method = m[1];
              if (
                /^(pane\.close|tab\.close|workspace\.close|agent\.send_keys|pane\.send_keys|pane\.send_text|pane\.send_input|worktree\.create|layout\.apply)$/.test(
                  method,
                )
              )
                next.push("herdr:" + method);
            }
            paintFlags([...new Set(next)]);
          }, 350);
        }

        function showProblem(ok, msg) {
          const line = ok ? -1 : errorLine(ta.value, msg);
          setStatus(status, ok, msg, line < 0 ? null : () => ed.gotoLine(line));
        }

        function addStep(verb) {
          let t = ta.value.replace(/\s+$/, "");
          if (!/^steps:/m.test(t)) t = (t ? t + "\n" : "") + "steps:";
          ed.setValue(t + "\n\n" + SKELETONS[verb] + "\n");
          refreshDirty();
          ta.focus();
          ta.setSelectionRange(ta.value.length, ta.value.length);
          runValidate();
        }

        async function setMode(next) {
          if (next === mode) return;
          if (next === "visual") {
            const r = await api("/api/parse", {
              method: "POST",
              body: JSON.stringify({ text: ta.value }),
            });
            if (!r.data.ok) {
              showProblem(
                false,
                "fix YAML before canvas edit — " + (r.data.error || "parse failed"),
              );
              return;
            }
            extras = { version: "v1alpha1" };
            if (r.data.doc.version) extras.version = r.data.doc.version;
            if (r.data.doc.title) extras.title = r.data.doc.title;
            if (r.data.doc.description) extras.description = r.data.doc.description;
            if (r.data.doc.hidden) extras.hidden = r.data.doc.hidden;
            if (r.data.doc.inputs) extras.inputs = r.data.doc.inputs;
            if (r.data.doc.returns) extras.returns = r.data.doc.returns;
            if (r.data.doc.on_failure) extras.on_failure = r.data.doc.on_failure;
            // The editor leaves first: the canvas grows into its space, so load() fits to the
            // height it will keep.
            ed.wrap.classList.add("hide");
            canvasHost.classList.remove("hide");
            canvas.load(r.data.doc.steps);
          } else {
            canvas.setExpanded(false);
            if (!(await syncFromCanvas())) {
              return; // stale YAML would wipe the node edits on the way back in
            }
          }
          mode = next;
          editorMode = next;
          textBtn.classList.toggle("on", mode === "text");
          visBtn.classList.toggle("on", mode === "visual");
          ed.wrap.classList.toggle("hide", mode !== "text");
          stepMenu.classList.toggle("hide", mode !== "text");
          canvasHost.classList.toggle("hide", mode !== "visual");
          updateHistoryBtns();
        }

        function scheduleSync() {
          clearTimeout(syncTimer);
          syncTimer = setTimeout(() => syncFromCanvas(), 300);
        }

        // Canvas → raw steps → server format → back into the shared YAML buffer, then validate.
        async function syncFromCanvas() {
          clearTimeout(syncTimer);
          const built = canvas.steps();
          if (built.error) {
            setStatus(status, false, built.error);
            return false;
          }
          if (built.steps.length === 0) {
            setStatus(status, "info", "no steps yet — add your first step on the canvas");
            return false;
          }
          const seq = ++syncSeq;
          const r = await api("/api/format", {
            method: "POST",
            body: JSON.stringify({
              doc: Object.assign({ version: "v1alpha1" }, extras, { steps: built.steps }),
            }),
          });
          if (seq !== syncSeq || !ta.isConnected) return false; // a newer sync already won
          if (!r.data.ok) {
            // Each issue the loader addressed to a field is painted there; the rest stay here.
            const painted = canvas.setIssues(r.data.issues || []);
            const rest = painted.rest.join("; ");
            setStatus(
              status,
              false,
              rest ||
                (painted.count
                  ? painted.count + " problem(s) shown on the marked step(s)"
                  : r.data.error || "format failed"),
            );
            return false;
          }
          canvas.setIssues([]);
          ed.setValue(r.data.text);
          canvasPending = false;
          refreshDirty();
          runValidate();
          return true;
        }

        const save = mkBtn("save", async () => {
          if (mode === "visual" && !(await syncFromCanvas())) return;
          const newName = nameIn.value.trim();
          const newScope = scopeSel.value;
          // One request: the server overwrites the path this buffer came from, or claims a
          // free destination and drops the source. Either the whole save lands, or nothing.
          const putBody = { name: newName, scope: newScope, text: ta.value };
          if (sourceName) {
            putBody.previousName = sourceName;
            putBody.previousScope = sourceScope;
            if (sourceBase) putBody.base = sourceBase;
          }
          const r = await api("/api/workflow", {
            method: "PUT",
            body: JSON.stringify(putBody),
          });
          if (!r.data.ok) {
            // A failed save leaves the buffer alone; only a save that could not undo its own
            // copy changed the disk, and it says so, so the list is refreshed just for that.
            showProblem(false, r.data.error || "save failed");
            toast("not saved — " + (r.data.error || "save failed"), false);
            if (r.data.orphan) await loadState();
            return;
          }
          savedName = newName;
          savedScope = newScope;
          savedText = ta.value;
          sourceName = newName;
          sourceScope = newScope;
          sourceBase = r.data.base || sourceBase;
          canvasPending = false;
          refreshDirty();
          toast("saved " + newName, true);
          await loadState();
          await openWorkflow(newName, newScope);
        });
        save.className = "primary";
        save.setAttribute("aria-label", "Save");

        const entry = state.entries.find((e) => e.name === name);
        const inBoth = !!entry && entry.inRepo && entry.inGlobal;
        if (inBoth) {
          scopeSel.disabled = true;
          scopeSel.title = "local and global variants both exist";
        }

        async function dropScopes(scopes) {
          for (const s of scopes) {
            const r = await api("/api/workflow", {
              method: "DELETE",
              body: JSON.stringify({ name, scope: s }),
            });
            if (r.data.ok) continue;
            const msg = "not deleted — " + (r.data.error || "delete failed");
            showProblem(false, msg);
            toast(msg, false);
            await loadState();
            return;
          }
          editorDirty = false;
          current = null;
          toast("deleted " + name, true);
          await loadState();
        }

        const overflowItems = [
          ...histItems,
          {
            label: "copy",
            fn: () => {
              navigator.clipboard.writeText(ta.value).then(
                () => toast("YAML copied to clipboard", true),
                (e) => toast("copy failed — " + errMsg(e), false),
              );
            },
          },
          {
            label: "download",
            fn: () => {
              const blob = new Blob([ta.value], { type: "text/yaml" });
              const a = document.createElement("a");
              a.href = URL.createObjectURL(blob);
              a.download = (nameIn.value.trim() || "workflow") + ".yaml";
              document.body.appendChild(a);
              a.click();
              a.remove();
              setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            },
          },
        ];
        if (name) {
          overflowItems.push({
            label: "share",
            fn: () => {
              if (!confirmLeave()) return;
              openShare(scope, name);
            },
          });
        }
        if (inBoth) {
          for (const [scopes, lbl] of [
            [["repo"], "local"],
            [["global"], "global"],
            [["repo", "global"], "both"],
          ]) {
            overflowItems.push({
              label: "delete " + lbl,
              fn: () => {
                if (!confirm("delete " + name + " (" + lbl + ")?")) return;
                dropScopes(scopes);
              },
            });
          }
        } else {
          overflowItems.push({
            label: "delete",
            fn: () => {
              if (!confirm("delete " + name + "?")) return;
              dropScopes([scope]);
            },
          });
        }
        const overflow = mkMenu("⋯", overflowItems, "More actions");

        const bar = document.createElement("div");
        bar.className = "bar";
        bar.append(
          nameIn,
          scopeSel,
          flagBox,
          spacer,
          modeSeg,
          stepMenu,
          undoBtn,
          redoBtn,
          unsaved,
          save,
          overflow,
        );

        const setFoot = () => {
          canvas.setTrigger("When you run: hwf run " + (nameIn.value.trim() || "<name>"));
        };
        setFoot();
        nameIn.oninput = () => {
          refreshDirty();
          setFoot();
        };
        scopeSel.onchange = () => refreshDirty();

        pane.append(bar, ed.wrap, canvasHost, status);
        refreshDirty();
        if (loadError) showProblem(false, loadError);
        runValidate();
        if (editorMode === "visual") setMode("visual");
      }

      function mkScopeSelect(scope) {
        const sel = document.createElement("select");
        for (const s of ["repo", "global"]) {
          const o = document.createElement("option");
          o.value = s;
          o.textContent = s === "repo" ? "local" : "global";
          if (s === scope) o.selected = true;
          sel.appendChild(o);
        }
        return sel;
      }

      function mkBtn(label, fn) {
        const b = document.createElement("button");
        b.textContent = label;
        b.onclick = fn;
        return b;
      }

      function mkMenu(label, items, name) {
        const wrap = document.createElement("div");
        wrap.className = "menu";
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = label;
        btn.setAttribute("aria-haspopup", "menu");
        btn.setAttribute("aria-expanded", "false");
        btn.setAttribute("aria-label", name || label);
        btn.title = name || label;
        const pop = document.createElement("div");
        pop.className = "menu-pop";
        pop.setAttribute("role", "menu");
        pop.hidden = true;
        // `back` is false when the pointer landed elsewhere: returning focus would steal it.
        function close(back) {
          if (pop.hidden) return;
          pop.hidden = true;
          btn.setAttribute("aria-expanded", "false");
          document.removeEventListener("pointerdown", onOut, true);
          if (back) btn.focus();
        }
        function onOut(e) {
          if (!wrap.contains(e.target)) close(false);
        }
        function open() {
          pop.hidden = false;
          btn.setAttribute("aria-expanded", "true");
          document.addEventListener("pointerdown", onOut, true);
          const first = [...pop.querySelectorAll('[role="menuitem"]')].find(
            (el) => el.getClientRects().length > 0,
          );
          if (first) first.focus();
        }
        for (const item of items) {
          const b = document.createElement("button");
          b.type = "button";
          b.setAttribute("role", "menuitem");
          b.textContent = item.label;
          if (item.className) b.className = item.className;
          b.onclick = () => {
            close(true);
            item.fn();
          };
          item.el = b;
          pop.appendChild(b);
        }
        btn.onclick = () => {
          if (pop.hidden) open();
          else close(true);
        };
        pop.addEventListener("keydown", (e) => {
          if (e.key !== "Escape") return;
          e.preventDefault();
          e.stopPropagation();
          close(true);
        });
        wrap.append(btn, pop);
        return wrap;
      }

      function setStatus(el, ok, msg, jump) {
        el.textContent = msg || "";
        el.className = "status " + (ok === "info" ? "" : ok ? "ok" : "bad") + (jump ? " jump" : "");
        el.onclick = jump || null;
        el.title = jump ? "jump to the line" : "";
      }

      async function renderConfig() {
        $("list").classList.add("hide");
        const pane = $("pane");
        pane.innerHTML = "";
        const bar = document.createElement("div");
        bar.className = "bar";
        const scopeSel = mkScopeSelect("repo");
        let shownScope = scopeSel.value;
        let cfgSeq = 0;
        const ta = document.createElement("textarea");
        ta.setAttribute("aria-label", "config YAML");
        const status = document.createElement("div");
        status.className = "status";
        const save = mkBtn("save", async () => {
          const r = await api("/api/config", {
            method: "PUT",
            body: JSON.stringify({ scope: shownScope, text: ta.value }),
          });
          setStatus(status, !!r.data.ok, r.data.ok ? "saved" : r.data.error || "save failed");
          if (!r.data.ok) return;
          configDirty = false;
          toast("saved " + (shownScope === "repo" ? "local" : "global") + " config", true);
        });
        save.className = "primary";
        // Last-write-wins: a superseded load must not drop its text into a newer scope's buffer.
        const load = async () => {
          const seq = ++cfgSeq;
          const want = scopeSel.value;
          save.disabled = true;
          setStatus(status, "info", "loading…");
          const r = await api("/api/config?scope=" + want);
          if (seq !== cfgSeq || !ta.isConnected) return;
          save.disabled = false;
          if (r.status !== 200) {
            setStatus(status, false, r.data.error || "load failed");
            return;
          }
          ta.value = r.data.text || "";
          shownScope = want;
          configDirty = false;
          setStatus(status, "info", "");
        };
        scopeSel.onchange = () => {
          if (configDirty && !confirm("discard unsaved config changes?")) {
            scopeSel.value = shownScope;
            return;
          }
          load();
        };
        ta.oninput = () => {
          configDirty = true;
        };
        bar.append(scopeSel, save);
        pane.append(bar, ta, status);
        await load();
      }

      function fmtWhen(ts) {
        const d = new Date(ts);
        if (isNaN(d)) return ts;
        return d.toLocaleString(undefined, {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function announce(text) {
        const live = $("live");
        if (!live) return;
        live.textContent = "";
        live.textContent = text;
      }

      function statusText(status) {
        return String(status || "").toUpperCase();
      }

      function runsEmptyCopy(data) {
        if (data && data.unavailable) return "run history storage is unavailable";
        const runs = (data && data.runs) || [];
        if (runsQuery.trim()) return "no matching runs";
        if (runsLocation === "current") return "no runs in this worktree — try All folders";
        return "no workflow has run yet";
      }

      function appendRunBlock(host, block) {
        if (block.kind === "head") {
          const head = document.createElement("div");
          head.innerHTML =
            "<strong>" +
            esc(block.status) +
            "</strong> · " +
            esc(block.title || "") +
            " · <code>" +
            esc(block.display_id || "") +
            "</code> · " +
            esc(block.elapsed || "");
          host.appendChild(head);
          return;
        }
        if (block.kind === "note") {
          const note = document.createElement("p");
          note.className = "hint";
          note.textContent = block.text;
          host.appendChild(note);
          return;
        }
        if (block.kind === "error") {
          const err = document.createElement("p");
          err.className = "err";
          err.textContent = block.text;
          host.appendChild(err);
          return;
        }
        const row = document.createElement("div");
        row.className = "step" + (block.depth > 0 ? " nested" : "");
        row.style.paddingLeft = block.depth ? block.depth * 12 + "px" : "";
        row.textContent =
          block.ordinal +
          "/" +
          block.total +
          " " +
          block.label +
          (block.outcome ? " · " + block.outcome : "");
        host.appendChild(row);
        if (block.explanation) {
          const expl = document.createElement("p");
          expl.className = "err";
          expl.style.paddingLeft = (block.depth + 1) * 12 + "px";
          expl.textContent = block.explanation;
          host.appendChild(expl);
        }
      }

      function renderRunInspector(host, detail, blocks) {
        host.innerHTML = "";
        if (!detail) {
          host.innerHTML = "<p class=hint>select a run</p>";
          return;
        }
        if (detail.kind === "invalid" || detail.kind === "missing" || detail.kind === "expired") {
          for (const block of blocks || []) appendRunBlock(host, block);
          if (!blocks || !blocks.length) {
            const p = document.createElement("p");
            p.className = "hint";
            p.textContent = detail.message || detail.kind;
            host.appendChild(p);
          }
          const back = document.createElement("button");
          back.type = "button";
          back.textContent = "Back to runs";
          back.id = runsBackFocusId();
          back.onclick = () => {
            runsSelectedId = null;
            routeView = exitRouteView(routeView);
            runsNarrowPane = "list";
            history.replaceState(null, "", location.pathname + location.search + "#");
            void refreshRuns(true);
          };
          host.appendChild(back);
          return;
        }
        if (detail.kind === "unavailable") {
          for (const block of blocks || []) appendRunBlock(host, block);
          if (!blocks || !blocks.length) {
            host.innerHTML = "<p class=hint>run history storage is unavailable</p>";
          }
          return;
        }
        for (const block of blocks || []) appendRunBlock(host, block);
        if (detail.open_workflow) {
          const open = document.createElement("button");
          open.type = "button";
          open.textContent = "Open current workflow";
          open.onclick = () => openWorkflow(detail.open_workflow.name, detail.open_workflow.source);
          host.appendChild(open);
        }
      }

      async function fetchRunDetail(id) {
        const r = await api("/api/run?id=" + encodeURIComponent(id));
        if (r.data && r.data.detail) {
          return { detail: r.data.detail, blocks: r.data.blocks || [] };
        }
        const detail = {
          kind: "unavailable",
          id,
          message: "run detail unavailable",
        };
        return {
          detail,
          blocks: [{ kind: "error", text: detail.message }],
        };
      }

      function paintInspectorBody(payload) {
        const body = document.getElementById("runs-inspector-body");
        if (!body) return;
        const scroll = body.scrollTop;
        renderRunInspector(body, payload && payload.detail, payload && payload.blocks);
        body.scrollTop = scroll;
      }

      async function refreshRuns(forceList) {
        if (tab !== "runs" || document.hidden) return;
        if (runsAbort) runsAbort.abort();
        const ac = new AbortController();
        runsAbort = ac;
        const gen = runsPoll.begin();
        const params = new URLSearchParams();
        params.set("location", runsLocation);
        if (runsQuery.trim()) params.set("q", runsQuery.trim());
        const prevList = document.querySelector(".runs-list");
        const prevBody = document.getElementById("runs-inspector-body");
        const saved = {
          listScrollTop: prevList ? prevList.scrollTop : 0,
          inspectorScrollTop: prevBody ? prevBody.scrollTop : 0,
          focusId: document.activeElement && document.activeElement.id,
        };
        const listRes = await fetch("/api/runs?" + params.toString(), {
          headers: { "x-hwf-token": TOKEN },
          signal: ac.signal,
        }).catch(() => null);
        if (!listRes || !runsPoll.current(gen) || tab !== "runs") return;
        const data = await listRes.json().catch(() => ({ runs: [] }));
        if (!runsPoll.current(gen) || tab !== "runs") return;
        paintRuns(data, forceList, saved);
        if (runsSelectedId) {
          const selectedId = runsSelectedId;
          const payload = await fetchRunDetail(selectedId);
          if (!runsPoll.current(gen) || tab !== "runs" || runsSelectedId !== selectedId) return;
          paintInspectorBody(payload);
          const detail = payload.detail;
          const nextStatus = detail && detail.status;
          if (observeRunStatus(selectedId, nextStatus)) {
            announce((detail.workflow || "run") + " " + statusText(nextStatus));
          }
        }
      }

      function paintRuns(data, forceList, saved) {
        const pane = $("pane");
        const focusId = resolveFocusAfterPaint(
          (saved && saved.focusId) || (document.activeElement && document.activeElement.id),
          runsSelectedId,
        );
        const locations = (data && data.locations) || [
          { id: "current", label: "Current" },
          { id: "all", label: "All folders" },
        ];
        const runs = (data && data.runs) || [];
        runsSelectedId = adoptRunsSelection(runs, runsSelectedId, forceList, !!routeView);
        const shell = document.createElement("div");
        shell.className =
          "runs-shell" + (runsNarrowPane === "detail" ? " narrow-detail" : " narrow-list");
        const controls = document.createElement("div");
        controls.className = "runs-controls";
        const locLabel = document.createElement("label");
        locLabel.textContent = "Location";
        const loc = document.createElement("select");
        loc.id = "runs-location";
        for (const item of locations) {
          const opt = document.createElement("option");
          opt.value = item.id;
          opt.textContent = item.label;
          if (item.id === runsLocation) opt.selected = true;
          loc.appendChild(opt);
        }
        loc.onchange = () => {
          runsLocation = loc.value;
          void refreshRuns(true);
        };
        locLabel.appendChild(loc);
        const searchLabel = document.createElement("label");
        searchLabel.textContent = "Search";
        const search = document.createElement("input");
        search.id = "runs-search";
        search.type = "search";
        search.value = runsQuery;
        search.placeholder = "workflow, status, id…";
        search.oninput = () => {
          runsQuery = search.value;
          void refreshRuns(true);
        };
        searchLabel.appendChild(search);
        controls.appendChild(locLabel);
        controls.appendChild(searchLabel);
        shell.appendChild(controls);

        const listPane = document.createElement("div");
        listPane.className = "runs-list-pane";
        const list = document.createElement("div");
        list.className = "runs-list";
        list.setAttribute("role", "listbox");
        list.setAttribute("aria-label", "Runs");
        if (!runs.length) {
          const empty = document.createElement("p");
          empty.className = "hint";
          empty.textContent = runsEmptyCopy(data);
          list.appendChild(empty);
        } else {
          for (const r of runs) {
            const row = document.createElement("button");
            row.type = "button";
            row.id = runRowFocusId(r.id);
            row.className = "run-row" + (r.id === runsSelectedId ? " on" : "");
            row.setAttribute("role", "option");
            row.setAttribute("aria-selected", r.id === runsSelectedId ? "true" : "false");
            row.innerHTML =
              '<span class="run-status">' +
              esc(statusText(r.status)) +
              "</span><span><strong>" +
              esc(r.title || r.workflow) +
              "</strong><div class=run-meta>" +
              esc(r.display_id || "") +
              (r.progress ? " · " + r.progress.done + "/" + r.progress.total : "") +
              "</div></span><span class=run-meta>" +
              esc(fmtWhen(r.started_at)) +
              "</span>";
            row.onclick = () => {
              runsSelectedId = r.id;
              seedSelectedStatus(r.id, r.status);
              runsNarrowPane = "detail";
              setHash("run=" + r.id);
              void refreshRuns(false);
            };
            list.appendChild(row);
          }
        }
        listPane.appendChild(list);
        shell.appendChild(listPane);

        const inspector = document.createElement("div");
        inspector.className = "runs-inspector";
        inspector.id = "runs-inspector";
        const back = document.createElement("button");
        back.type = "button";
        back.id = runsBackFocusId();
        back.className = "runs-narrow-only";
        back.textContent = "Back to runs";
        back.onclick = () => {
          runsNarrowPane = "list";
          paintRuns(data, true, {
            listScrollTop: list.scrollTop,
            inspectorScrollTop: 0,
            focusId: "runs-search",
          });
        };
        inspector.appendChild(back);
        const body = document.createElement("div");
        body.id = "runs-inspector-body";
        if (!runsSelectedId) {
          body.innerHTML = "<p class=hint>select a run</p>";
        } else {
          body.innerHTML = "<p class=hint>loading…</p>";
        }
        inspector.appendChild(body);
        shell.appendChild(inspector);
        pane.innerHTML = "";
        pane.appendChild(shell);
        if (saved) {
          list.scrollTop = saved.listScrollTop || 0;
          body.scrollTop = saved.inspectorScrollTop || 0;
        }
        if (focusId && $(focusId)) $(focusId).focus();
      }

      async function renderRuns() {
        $("list").classList.add("hide");
        const pane = $("pane");
        pane.innerHTML = "<p class=hint>loading…</p>";
        await refreshRuns(runsNarrowPane === "list");
      }

      setInterval(() => {
        if (tab === "runs" && !document.hidden) void refreshRuns(false);
      }, 3000);

      async function renderShare(scope, name) {
        syncWorkflowLayout();
        const pane = $("pane");
        const seq = openWorkflowToken.begin();
        pane.innerHTML = "<p class=hint>loading share…</p>";
        const r = await api(
          "/api/share?name=" + encodeURIComponent(name) + "&scope=" + encodeURIComponent(scope),
        );
        if (!openWorkflowToken.current(seq)) return;
        if (!routeView || routeView.kind !== "share") return;
        pane.innerHTML = "";
        const head = document.createElement("div");
        head.className = "route-head";
        head.innerHTML =
          "<h2>share <code>" +
          esc(scope) +
          ":" +
          esc(name) +
          "</code></h2><span class=hint>connected workflows · import command</span>";
        pane.appendChild(head);
        if (r.status !== 200 || !r.data.ok) {
          const err = document.createElement("p");
          err.className = "status bad";
          err.textContent = r.data.error || "could not build share bundle";
          pane.appendChild(err);
          return;
        }
        const provenance = {};
        for (const p of r.data.provenance || []) provenance[p.name] = p.source;
        const entries = r.data.entries || [];
        if (!entries.length) {
          const empty = document.createElement("p");
          empty.className = "hint";
          empty.textContent = "bundle is empty";
          pane.appendChild(empty);
          return;
        }
        const names = document.createElement("div");
        names.className = "flags";
        names.textContent =
          "includes " +
          entries
            .map((e) => {
              const src = provenance[e.name];
              const label = src === "repo" ? "local" : src === "global" ? "global" : "local";
              return e.name + " (" + label + ")";
            })
            .join(" · ");
        pane.appendChild(names);
        const cap = document.createElement("p");
        cap.className = "bar";
        cap.innerHTML = "<span class=cap>import command</span>";
        pane.appendChild(cap);
        const cmd = document.createElement("div");
        cmd.className = "cmd-box";
        cmd.setAttribute("role", "textbox");
        cmd.setAttribute("aria-readonly", "true");
        cmd.setAttribute("aria-label", "import command");
        cmd.tabIndex = 0;
        cmd.textContent = r.data.command || "";
        pane.appendChild(cmd);
        const bar = document.createElement("div");
        bar.className = "bar";
        const copy = mkBtn("copy import command", () => {
          navigator.clipboard.writeText(r.data.command || "").then(
            () => toast("import command copied", true),
            (e) => toast("copy failed — " + errMsg(e), false),
          );
        });
        copy.className = "primary";
        bar.appendChild(copy);
        pane.appendChild(bar);
        const listCap = document.createElement("p");
        listCap.className = "bar";
        listCap.innerHTML = "<span class=cap>bundled workflows</span>";
        pane.appendChild(listCap);
        const bundle = document.createElement("div");
        bundle.className = "bundle";
        for (const e of entries) {
          const item = document.createElement("div");
          item.className = "item";
          const top = document.createElement("div");
          top.className = "top";
          top.innerHTML =
            "<span class=name>" +
            esc(e.name) +
            "</span><span class=badge>" +
            esc(
              provenance[e.name] === "global"
                ? "global"
                : provenance[e.name] === "repo"
                  ? "local"
                  : "—",
            ) +
            "</span>";
          item.append(top, yamlBlock(e.yaml || ""));
          bundle.appendChild(item);
        }
        pane.appendChild(bundle);
      }

      function renderImport() {
        syncWorkflowLayout();
        const pane = $("pane");
        pane.innerHTML = "";
        const head = document.createElement("div");
        head.className = "route-head";
        head.innerHTML =
          "<h2>import workflows</h2><span class=hint>review every YAML · one destination · no run</span>";
        pane.appendChild(head);
        const paste = document.createElement("textarea");
        paste.id = "import-paste";
        paste.setAttribute("aria-label", "import command, encoded bundle, or workflow YAML");
        paste.placeholder =
          'hwf workflow import "…"  — encoded bundle — or paste raw workflow YAML';
        pane.appendChild(paste);
        const nameRow = document.createElement("div");
        nameRow.className = "bar";
        nameRow.innerHTML = "<span class=cap>name (raw YAML)</span>";
        const nameIn = document.createElement("input");
        nameIn.type = "text";
        nameIn.id = "import-name";
        nameIn.setAttribute("aria-label", "workflow name for raw YAML import");
        nameIn.placeholder = "required when pasting YAML";
        nameRow.appendChild(nameIn);
        pane.appendChild(nameRow);
        const bar = document.createElement("div");
        bar.className = "bar";
        const previewBtn = mkBtn("preview", () => runImportPreview());
        previewBtn.className = "primary";
        bar.appendChild(previewBtn);
        pane.appendChild(bar);
        const status = document.createElement("div");
        status.id = "import-status";
        status.className = "status";
        pane.appendChild(status);
        const review = document.createElement("div");
        review.id = "import-review";
        pane.appendChild(review);

        async function runImportPreview() {
          const text = paste.value.trim();
          review.innerHTML = "";
          if (!text) {
            setStatus(status, false, "paste an import command, encoded bundle, or workflow YAML");
            return;
          }
          const yamlName = (nameIn.value || "").trim();
          setStatus(status, "info", "loading preview…");
          const r = await api("/api/import/preview", {
            method: "POST",
            body: JSON.stringify({ text, name: yamlName || undefined }),
          });
          if (!r.data.ok) {
            setStatus(status, false, r.data.error || "preview failed");
            return;
          }
          setStatus(status, true, "preview ready — choose a destination and confirm");
          const entries = r.data.entries || [];
          const warnings = r.data.warnings || [];
          const unresolved = r.data.unresolvedChildren || [];
          const availability = r.data.availability || {};

          if (r.data.banner) {
            const banner = document.createElement("div");
            banner.className = "flags warn";
            banner.textContent = r.data.banner.trim();
            review.appendChild(banner);
          }
          if (warnings.length) {
            const wl = document.createElement("div");
            wl.className = "flags warn";
            wl.textContent = "warnings · " + warnings.join(" · ");
            review.appendChild(wl);
          }
          if (unresolved.length) {
            const note = document.createElement("p");
            note.className = "hint";
            note.textContent =
              "referenced but not in bundle: " +
              unresolved.join(", ") +
              " — resolve on import host";
            review.appendChild(note);
          }
          if (!entries.length) {
            const empty = document.createElement("p");
            empty.className = "hint";
            empty.textContent = "no workflows in this bundle";
            review.appendChild(empty);
            return;
          }
          const bundle = document.createElement("div");
          bundle.className = "bundle";
          for (const e of entries) {
            const item = document.createElement("div");
            item.className = "item";
            const top = document.createElement("div");
            top.className = "top";
            const warnBits = (e.warnings || []).length ? " · " + e.warnings.join(" · ") : "";
            top.innerHTML =
              "<span class=name>" +
              esc(e.title || e.name) +
              "</span><span class=badge>" +
              esc(e.name) +
              esc(warnBits) +
              "</span>";
            item.append(top, yamlBlock(e.yaml || ""));
            bundle.appendChild(item);
          }
          review.appendChild(bundle);

          const dest = document.createElement("div");
          dest.className = "bar";
          dest.innerHTML = "<span class=cap>destination</span>";
          const scopeSel = document.createElement("select");
          scopeSel.setAttribute("aria-label", "import destination scope");
          for (const s of ["repo", "global"]) {
            const o = document.createElement("option");
            o.value = s;
            o.textContent = s === "repo" ? "local (repo)" : "global";
            scopeSel.appendChild(o);
          }
          dest.appendChild(scopeSel);
          const conflictHint = document.createElement("span");
          conflictHint.className = "hint";
          const syncConflicts = () => {
            const scope = scopeSel.value;
            const conflicts = (availability[scope] && availability[scope].conflicts) || [];
            conflictHint.textContent = conflicts.length
              ? "conflicts: " + conflicts.map((c) => c.name || c).join(", ")
              : "no name conflicts in " + (scope === "repo" ? "local" : "global");
          };
          scopeSel.onchange = syncConflicts;
          syncConflicts();
          dest.appendChild(conflictHint);
          review.appendChild(dest);

          const actions = document.createElement("div");
          actions.className = "bar";
          const confirmBtn = mkBtn("confirm import", async () => {
            const scope = scopeSel.value;
            const n = entries.length;
            if (
              !confirm(
                "import " +
                  n +
                  " workflow" +
                  (n === 1 ? "" : "s") +
                  " into " +
                  (scope === "repo" ? "local (repo)" : "global") +
                  "?",
              )
            )
              return;
            await writeImport(text, scope, false, yamlName || undefined);
          });
          confirmBtn.className = "primary";
          actions.appendChild(confirmBtn);
          review.appendChild(actions);
          const resultBox = document.createElement("div");
          resultBox.id = "import-result";
          resultBox.className = "status";
          review.appendChild(resultBox);

          async function writeImport(payload, scope, replaceAll, name) {
            const out = $("import-result") || resultBox;
            setStatus(out, "info", replaceAll ? "replacing…" : "importing…");
            const wr = await api("/api/import", {
              method: "POST",
              body: JSON.stringify({ text: payload, scope, replaceAll, name }),
            });
            if (wr.status === 409) {
              const conflicts = wr.data.conflicts || [];
              const names = conflicts.map((c) => c.name || c).join(", ");
              if (
                !confirm(
                  "replace existing workflows (" +
                    (names || "conflicts") +
                    ")? this overwrites every conflicting file in the chosen scope.",
                )
              ) {
                setStatus(out, false, "import cancelled — existing files kept");
                return;
              }
              return writeImport(payload, scope, true, name);
            }
            if (!wr.data.ok) {
              setStatus(out, false, wr.data.error || "import failed");
              toast("import failed", false);
              return;
            }
            const saved = wr.data.results || [];
            const msg =
              "saved " +
              saved.length +
              " file" +
              (saved.length === 1 ? "" : "s") +
              (saved.length ? ": " + saved.map((s) => s.name).join(", ") : "");
            setStatus(out, true, msg);
            toast(msg, true);
            await loadState();
          }
        }
      }

      function openShare(scope, name) {
        openWorkflowToken.bump();
        routeView = exitRouteView(routeView);

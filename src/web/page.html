        routeView = { kind: "share", scope, name };
        current = null;
        wantOpen = null;
        tab = "workflows";
        setHash("share=" + scope + ":" + name);
        syncTabs();
        syncWorkflowLayout();
        void renderShare(scope, name);
      }

      function openImport() {
        openWorkflowToken.bump();
        routeView = exitRouteView(routeView);
        routeView = { kind: "import" };
        current = null;
        wantOpen = null;
        tab = "workflows";
        setHash("import");
        syncTabs();
        syncWorkflowLayout();
        renderImport();
      }

      document.querySelectorAll(".tab").forEach(
        (b) =>
          (b.onclick = () => {
            if (!confirmLeave()) return;
            routeView = exitRouteView(routeView);
            clearRouteHash();
            tab = b.dataset.tab;
            if (tab === "workflows") current = null;
            render();
          }),
      );
      addEventListener("beforeunload", (e) => {
        if (!editorDirty && !configDirty) return;
        e.preventDefault();
        e.returnValue = "";
      });

      function setHash(h) {
        if (location.hash !== "#" + h) location.hash = h;
      }

      // #w=<scope>:<name> — editor deep link
      // #share=<scope>:<name> — share bundle + import command
      // #import — paste/preview/confirm import (no run)
      // #new — blank unsaved editor (same as + new)
      // empty hash — leave share/import (and editor deep-link) for the workflow list
      function applyHash() {
        const hash = location.hash.slice(1);
        if (!hash) {
          if (!routeView && !current) return;
          if (!confirmLeave()) {
            restoreRouteHash();
            return;
          }
          openWorkflowToken.bump();
          routeView = exitRouteView(routeView);
          current = null;
          wantOpen = null;
          tab = "workflows";
          syncTabs();
          syncWorkflowLayout();
          renderWorkflows();
          return;
        }
        if (hash === "new") {
          if (routeView && routeView.kind === "new") return;
          if (!confirmLeave()) {
            restoreRouteHash();
            return;
          }
          newWorkflow();
          return;
        }
        if (hash === "import") {
          if (routeView && routeView.kind === "import") return;
          if (!confirmLeave()) {
            restoreRouteHash();
            return;
          }
          openImport();
          return;
        }
        const share = /^share=(repo|global):([a-z0-9][a-z0-9-_]*)$/.exec(hash);
        if (share) {
          const scope = share[1];
          const name = share[2];
          if (
            routeView &&
            routeView.kind === "share" &&
            routeView.scope === scope &&
            routeView.name === name
          )
            return;
          if (!confirmLeave()) {
            restoreRouteHash();
            return;
          }
          openShare(scope, name);
          return;
        }
        if (hash.startsWith("run=")) {
          const parsed = parseRunHash(hash);
          const id = parsed.id;
          const complete = parsed.complete === true;
          const routeGen = runsRoute.begin();
          tab = "runs";
          routeView = { kind: "run", id, state: complete ? "ok" : "invalid" };
          runsSelectedId = complete ? id : null;
          seedSelectedStatus(complete ? id : null, null);
          runsNarrowPane = "detail";
          runsLocation = "current";
          syncTabs();
          syncWorkflowLayout();
          void (async () => {
            if (!complete) {
              if (!runsRoute.current(routeGen)) return;
              $("pane").innerHTML = "";
              const shell = document.createElement("div");
              shell.className = "runs-shell narrow-detail";
              const inspector = document.createElement("div");
              inspector.className = "runs-inspector";
              inspector.id = "runs-inspector";
              const back = document.createElement("button");
              back.type = "button";
              back.id = runsBackFocusId();
              back.className = "runs-narrow-only";
              back.textContent = "Back to runs";
              back.onclick = () => {
                runsSelectedId = null;
                routeView = exitRouteView(routeView);
                runsNarrowPane = "list";
                history.replaceState(null, "", location.pathname + location.search + "#");
                void refreshRuns(true);
              };
              inspector.appendChild(back);
              const body = document.createElement("div");
              body.id = "runs-inspector-body";
              renderRunInspector(
                body,
                { kind: "invalid", message: "run link is not a complete UUID" },
                [{ kind: "error", text: "run link is not a complete UUID" }],
              );
              inspector.appendChild(body);
              shell.appendChild(inspector);
              $("pane").appendChild(shell);
              return;
            }
            const payload = await fetchRunDetail(id);
            if (!runsRoute.current(routeGen)) return;
            const detail = payload.detail;
            if (detail.kind === "snapshot") runsLocation = detail.checkout_root;
            observeRunStatus(id, detail.status || null);
            await refreshRuns(false);
            if (!runsRoute.current(routeGen)) return;
          })();
          return;
        }
        const m = /^w=(repo|global):([a-z0-9][a-z0-9-_]*)$/.exec(hash);
        if (!m) return;
        const [, scope, name] = m;
        if (!routeView && current && current.name === name && current.scope === scope) return;
        if (!confirmLeave()) {
          restoreRouteHash();
          return;
        }
        tab = "workflows";
        const entry = state.entries.find((e) => e.name === name);
        if (entry) {
          const has = scope === "repo" ? entry.inRepo : entry.inGlobal;
          return openWorkflow(name, has ? scope : entry.source);
        }
        routeView = exitRouteView(routeView);
        wantOpen = { name, scope }; // not written yet — liveTick opens it once it appears
        current = null;
        syncWorkflowLayout();
        renderWorkflows();
        $("pane").innerHTML = "<p class=hint>waiting for " + esc(name) + "…</p>";
      }

      let liveSig = "";
      let liveBusy = false;

      // Poll disk so a workflow an agent is writing shows up (and redraws) without a reload.
      // Local edits win: a dirty buffer is never overwritten.
      async function liveTick() {
        if (
          liveBusy ||
          document.hidden ||
          tab !== "workflows" ||
          routeView ||
          editorDirty ||
          configDirty
        )
          return;
        liveBusy = true;
        try {
          const s = await api("/api/state");
          if (s.status === 200 && !s.data.error) {
            const sig = JSON.stringify(s.data.entries || []);
            if (sig !== liveSig) {
              liveSig = sig;
              state = Object.assign(state, s.data);
              renderWorkflows();
              if (wantOpen) applyHash();
            }
          }
          if (!current || !current.name || editorDirty) return;
          const r = await api(
            "/api/workflow?name=" + encodeURIComponent(current.name) + "&scope=" + current.scope,
          );
          if (r.status !== 200 || editorDirty) return;
          const text = r.data.text || "";
          if (text === editorFileText) return;
          renderEditor(current.name, current.scope, text, r.data.error || "", [], r.data.base);
        } finally {
          liveBusy = false;
        }
      }

      addEventListener("hashchange", applyHash);
      setInterval(liveTick, 1500);
      loadState().then(applyHash);

      function themeMode() {
        try {
          const t = localStorage.getItem(THEME_KEY);
          if (t === "light" || t === "dark") return t;
        } catch (e) {}
        return null;
      }

      function syncThemeControl() {
        const btn = $("theme-btn");
        if (!btn) return;
        const mode = themeMode();
        const label = mode || "system";
        btn.textContent = label;
        btn.setAttribute("aria-label", "Theme: " + label);
        btn.setAttribute("aria-pressed", mode ? "true" : "false");
        document.documentElement.dataset.theme =
          mode || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      }

      function cycleTheme() {
        const cur = themeMode();
        const i = THEME_CYCLE.indexOf(cur);
        const next = THEME_CYCLE[(i + 1) % THEME_CYCLE.length];
        try {
          if (next) localStorage.setItem(THEME_KEY, next);
          else localStorage.removeItem(THEME_KEY);
        } catch (e) {}
        syncThemeControl();
      }

      $("theme-btn").addEventListener("click", cycleTheme);
      $("list-rail").addEventListener("click", () => setListCollapsed(false));
      syncThemeControl();
      syncListToggle();
      try {
        matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => {
          if (themeMode() == null) syncThemeControl();
        });
      } catch (e) {}
    </script>
  </body>
</html>

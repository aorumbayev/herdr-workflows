version: v1alpha1
title: Worktree
description: Create a worktree and focus it
inputs:
  branch: text
  base:
    type: choice
    options: [main, develop]
    default: main
steps:
  - herdr: worktree.create
    params:
      branch: "{{inputs.branch}}"
      base: "{{inputs.base}}"
      label: "{{inputs.branch}}"
      focus: true

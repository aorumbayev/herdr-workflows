# Reads the transcript of the pane you launch this from, before step 1.
# Works out of the box only when that pane runs claude with herdr's claude
# integration installed. Any other agent kind needs a `transcripts:` extractor
# in .hwf/config.yaml, or the run fails preflight. See /guide#hand-your-session-to-an-agent.
version: v1alpha1
title: Handoff
description: Distil this session's transcript and hand it to a fresh agent
inputs:
  target: profile
  focus:
    type: text
    default: ""
  placement:
    type: choice
    description: where the fresh agent opens
    options: [tab, beside, below]
    default: tab
  close_source:
    type: choice
    options: [keep, close]
    default: keep
on_failure:
  herdr: notification.show
  params:
    title: handoff failed
    body: "{{context.error.message}}"
    sound: request
steps:
  - id: brief
    agent: |
      The absolute path below is a UTF-8 file containing a coding agent session
      transcript. Read that file and distil it into a handoff prompt for a fresh
      agent session.

      Keep (signal): architectural decisions with rationale; working solutions
      adopted; configuration choices (versions, settings, flags, env vars);
      files created/modified with paths and why; constraints discovered;
      productive dead ends in one sentence each; open questions; anything the
      next session would otherwise re-discover.

      Drop (noise): corrections and retries, verbose tool output, permission
      prompts, repeated attempts.

      Use this shape, omitting empty sections:

      Continue the work from the previous session. Here is the context you need:

      **Project**: <path>
      **Branch**: <branch, if known>

      ## Background
      ## What was done
      ## Decisions in effect
      ## Current state
      ## Open questions
      ## Your next steps
      1. <directive>

      Never invent decisions or context not present in the transcript; note
      unclear items as open questions.

      Transcript file — read it before you write anything, because run cleanup
      removes it when the run ends (do not ask for its contents to be pasted):
      {{context.transcript_file}}

      Write the finished handoff to .hwf/tmp/handoff.md, relative to the repo
      root, as well as to the file you are asked to write below. That copy
      outlives the run.

      Do not print the handoff in the chat. Printing it again costs a second
      full render for no reader. Reply with one word: Done.
    using: "{{inputs.target}}"
    timeout: 30m
    pane:
      open: beside
      focus: false
      close: success

  - herdr: notification.show
    params:
      title: handoff ready
      body: "opening {{inputs.target}} in {{inputs.placement}}"
      sound: done

  - agent: |
      Focus: {{inputs.focus}}

      {{steps.brief.response}}
    using: "{{inputs.target}}"
    background: true
    pane:
      open: "{{inputs.placement}}"

  - herdr: tab.close
    params:
      tab_id: "{{context.tab}}"
    when:
      - '{{inputs.close_source}} == "close"'
      - '{{inputs.placement}} == "tab"'
    continue_on_error: true

  - herdr: pane.close
    params:
      pane_id: "{{context.pane}}"
    when:
      - '{{inputs.close_source}} == "close"'
      - '{{inputs.placement}} != "tab"'
    continue_on_error: true

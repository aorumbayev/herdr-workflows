version: v1alpha1
title: Review
description: Review the working tree diff, skipping the agent when it is clean
steps:
  - id: diff
    run: [git, diff, HEAD]

  - agent: |
      Review this diff. List blocking issues only.

      {{steps.diff.stdout}}
    using: claude
    when: "{{steps.diff.stdout}}"
    timeout: 15m
    pane:
      open: beside
